e jamais envoyer à une IA générative grand public (guide du 29/04/2024, avant R34)."], ["h", "5. Compte rendu d'intervention"], ["p", "Vous l'avez fait en gare 1 (exercice « Compte rendu d'intervention avec Copilot »). Vérifiez que votre ligne Objectif nomme la décision attendue (« permettre au chef de pôle de décider s'il faut programmer [ACTION] ») : c'est elle qui fait passer en tête ce qui sert la décision."], ["tip", "Visez le bon format en deux itérations au plus. Si la troisième ne suffit pas, c'est le prompt qu'il faut reprendre, pas la relance."], ["src", [["Microsoft Support, Catch up on meetings with Microsoft 365 Copilot in Teams", "https://support.microsoft.com/en-US/teams/copilot/catch-up-on-meetings-with-microsoft-365-copilot-in-teams"], ["Microsoft Support, Get started writing prompts (objectif, contexte, source, attentes)", "https://support.microsoft.com/topic/f6c3b467-f07c-4db1-ae54-ffac96184dd5"], ["Microsoft, guide d'étude de l'examen AB-730", "https://learn.microsoft.com/credentials/certifications/resources/study-guides/ab-730"], ["ANSSI, Recommandations de sécurité pour un système d'IA générative (29/04/2024)", "https://messervices.cyber.gouv.fr/guides/recommandations-de-securite-pour-un-systeme-dia-generative"]]]], "formes": ["classement"]}, {"id": "l3r", "title": "Exemple résolu : le récap d'une réunion de préparation (voie Pro)", "min": 14, "voie": "pro", "formes": ["processus"], "blocks": [["p", "Cas fictif, différent de l'exercice. Votre équipe a préparé sur Teams l'exercice annuel de bascule sur la liaison de secours entre [POSTE_D] et [POSTE_E]. Vous voulez le récap avec les actions, pour les participants et pour [AGENT_5], absent, à qui l'équipe pense confier une tâche."], ["warn", "Feu orange : une réunion interne. Copilot dans Teams, ou SNCF Group GPT avec la transcription collée. Les participants ont été prévenus avant le lancement de la transcription."], ["code", "Extrait de transcription FICTIVE :\n[AGENT_1] : On fait la bascule le mardi 1er décembre, de 21 h à 22 h.\n[AGENT_2] : Je préviens la supervision la veille.\n[AGENT_3] : La fiche réflexe est à mettre à jour. Je veux bien le faire, mais seulement si j'ai la dernière version du schéma.\n[AGENT_1] : Qui réserve la salle de crise ?\n[AGENT_4] : Pas moi, je suis en congé cette semaine-là.\n[AGENT_1] : On demandera à [AGENT_5].\n[AGENT_2] : Je ne sais pas si l'équipe voisine sera disponible ce soir-là.\n[AGENT_1] : On se revoit jeudi prochain."], ["trajet", "Les étapes", ["Repérer les trois sortes de phrases : décision (« on fait »), action acceptée (« je préviens »), simple question ou doute (« qui réserve ? », « je ne sais pas si »).", "Classer les cas délicats avant d'écrire le prompt : une action acceptée sous condition reste une action, avec sa condition ; une action proposée à un absent n'est pas acceptée ; un refus n'est pas une action ; un doute devient un point ouvert.", "Écrire le prompt : la Cible change le contenu (ici, un absent concerné) ; les Contraintes disent comment traiter ces cas.", "Lancer le prompt dans Copilot (dans la réunion ou depuis son récap, selon votre version), ou dans SNCF Group GPT avec la transcription collée.", "Vérifier chaque ligne du tableau contre la transcription, puis envoyer."]], ["code", "Rôle : tu es secrétaire de réunion d'une équipe de maintenance télécom ferroviaire.\nCible : les participants, et [AGENT_5], absent, à qui l'équipe pense confier la réservation de la salle de crise.\nObjectif : que chacun sache ce qui est décidé, qui fait quoi et pour quand, et que [AGENT_5] voie ce qu'on attend de lui avant d'accepter.\nContexte : la transcription de la réunion de préparation de l'exercice de bascule.\nFormat : 1) Décisions (puces) ; 2) Actions en tableau Qui / Quoi / Échéance ; 3) Points ouverts ; 4) Prochain point ; 150 mots maximum.\nContraintes : n'attribue une action qu'à la personne qui l'a acceptée ; une action proposée à un absent va dans les points ouverts ; garde les échéances telles qu'énoncées, sans les convertir en date ; recopie une condition avec l'action ; garde les marqueurs [AGENT_n].\nSi le responsable ou l'échéance d'une action manque, écris « à préciser »."], ["code", "Récap obtenu, relu et envoyé :\n1) Décisions\n- Exercice de bascule le mardi 1er décembre, de 21 h à 22 h.\n2) Actions : voir le tableau ci-dessous."], ["table", ["Qui", "Quoi", "Échéance"], [["[AGENT_2]", "Prévenir la supervision", "La veille de la bascule"], ["[AGENT_3]", "Mettre à jour la fiche réflexe, si la dernière version du schéma lui est fournie", "À préciser"], ["À préciser", "Fournir la dernière version du schéma à [AGENT_3]", "À préciser"], ["À préciser", "Réserver la salle de crise", "À préciser"]]], ["code", "3) Points ouverts\n- Salle de crise : l'équipe propose [AGENT_5], qui n'a pas encore accepté. [AGENT_4] n'est pas disponible.\n- Disponibilité de l'équipe voisine le soir de la bascule : inconnue.\n4) Prochain point : jeudi prochain (date à préciser).\n\nRègle appliquée : une décision qui attend l'accord d'un absent reste un point ouvert, pas une décision ; un doute sans personne désignée devient une action « À préciser »."], ["table", ["Ligne du récap", "Passage de la transcription", "Verdict"], [["Bascule le 1er décembre, 21 h - 22 h", "« le mardi 1er décembre, de 21 h à 22 h »", "Conforme. Le 1er décembre 2026 est bien un mardi (calendrier)"], ["[AGENT_2] prévient la supervision", "« Je préviens la supervision la veille »", "Action acceptée ; échéance gardée telle quelle"], ["[AGENT_3] et la fiche réflexe", "« Je veux bien… mais seulement si… »", "Action acceptée sous condition : condition recopiée"], ["Schéma à fournir", "Rien : personne ne s'en charge", "Action sans responsable : « à préciser », c'est voulu"], ["Salle de crise", "« On demandera à [AGENT_5] »", "Proposition à un absent, pas une acceptation : point ouvert"], ["Équipe voisine", "« Je ne sais pas si… »", "Doute : point ouvert, pas une action"]]], ["tip", "Vérification : comptez les « je » de la transcription (« je préviens », « je veux bien ») : chacun doit donner une ligne d'action, et aucune action ne doit avoir un « Qui » que la transcription ne justifie pas. Une échéance relative (« la veille », « jeudi prochain ») reste telle quelle : c'est vous qui ajoutez la date, si vous en êtes sûr."], ["warn", "Erreur fréquente : Copilot écrit « [AGENT_5] : réserver la salle de crise ». C'est faux : il n'était pas là et n'a rien accepté. Corrigez avant l'envoi."]]}, {"id": "l4", "title": "Créer un visuel et vérifier ses droits", "min": 20, "voie": "both", "blocks": [["def", "Article 50 de l'AI Act (aperçu)", "Depuis le 2 août 2026, une image, un son ou une vidéo générés ou modifiés par IA qui ressemblent de façon réaliste à une personne, un lieu ou un événement réels (hypertrucage) doivent être signalés de façon visible. Détail : gare 5.", "", "def:article-50-apercu"], ["def", "Journal d'usage", "Tableau où vous notez, pour chaque contenu produit avec l'IA : date, outil, feu, données utilisées, vérification faite. Modèle : gare 5, leçon « Le carnet de bord ».", "", "def:journal-usage-apercu"], ["p", "Générer une image prend dix secondes. Savoir si l'on peut l'utiliser prend plus de temps, et c'est la partie qui compte. Règle de la gare : visuel pro avec l'outil sous licence de l'employeur ; outils gratuits pour le perso."], ["def", "Image générée", "Une image produite par un modèle à partir d'un texte (et parfois d'une image de référence). En France, une production purement synthétique, sans apport créatif humain significatif, n'est en principe pas protégée par le droit d'auteur (rapport du CSPLA (Conseil supérieur de la propriété littéraire et artistique), juillet 2026). Elle peut pourtant contrefaire une œuvre ou une marque existante.", "", "def:image-generee"], ["def", "Indemnisation (engagement de propriété intellectuelle)", "La promesse contractuelle d'un éditeur de défendre son client, voire de payer, si une sortie générée est attaquée pour contrefaçon. Elle dépend du contrat, pas de l'outil : la même marque peut couvrir l'offre entreprise et pas l'offre gratuite.", "", "def:indemnisation"], ["def", "Customer Copyright Commitment (Microsoft)", "L'engagement de Microsoft envers les clients des Copilot commerciaux payants, dont Microsoft 365 Copilot. Conditions : laisser actifs les filtres intégrés, ne pas chercher à produire du contenu contrefaisant, ne pas fournir d'entrées sur lesquelles on n'a pas de droits.", "", "def:customer-copyright-commitment"], ["def", "Content Credentials (C2PA)", "Des métadonnées signées, attachées au fichier, qui indiquent son origine et s'il a été généré ou modifié par IA. Adobe les attache aux sorties Firefly. Les conditions de Canva interdisent de les retirer.", "", "def:content-credentials"], ["h", "Le prompt d'image"], ["code", "Sujet : [CE QUI EST REPRÉSENTÉ, sans personne réelle ni marque].\nUsage et cible : [OÙ L'IMAGE SERA VUE, PAR QUI].\nStyle : [pictogramme plat / illustration / photo réaliste].\nCadrage : [plan large / gros plan], [format carré / paysage].\nCouleurs : [palette, contraste élevé pour la lisibilité].\nÀ éviter : texte dans l'image, logos, visages identifiables."], ["tip", "Ajoutez le texte vous-même dans PowerPoint ou Canva. Les modèles déforment encore souvent les lettres, et un mot mal écrit sur un visuel de sécurité décrédibilise tout le support."], ["h", "Quel outil pour quel usage"], ["table", ["Outil", "Accès", "Droits et indemnisation"], [["Copilot, module Create (pro)", "m365.cloud.microsoft/create ou menu Create de l'app Copilot ; formats 1024×1024, 1024×1536, 1536×1024", "Couvert par le Customer Copyright Commitment avec la licence Copilot de l'employeur, sous conditions"], ["Adobe Firefly (perso)", "Générations gratuites quotidiennes sans abonnement (montants non publiés)", "Indemnisation réservée aux contrats entreprise ; les modèles partenaires (Google, OpenAI…) dans Firefly ne sont pas couverts par l'indemnité Firefly"], ["Canva (perso)", "Allocation IA mensuelle sur l'offre gratuite", "Vous possédez la sortie (sauf contenu de bibliothèque sous licence), usage commercial « à vos risques », aucune indemnisation"], ["ChatGPT, Gemini (perso)", "Selon quotas de l'offre gratuite, variables", "Aucune indemnisation sur les comptes gratuits (OpenAI : seulement API (interface de programmation) et Enterprise, selon une source secondaire)"]]], ["warn", "L'image d'une personne réelle, un collègue par exemple, suppose son accord. Diffuser sans consentement un montage réaliste de son image ou de sa voix, généré par IA, est un délit (article 226-8 du Code pénal, modifié par la loi SREN (loi visant à sécuriser et réguler l'espace numérique) du 21 mai 2024, visant à sécuriser et réguler l'espace numérique)."], ["warn", "Aucune indemnisation ne couvre le droit des marques. Pas de logo, pas de matériel identifiable d'une marque, pas de logo SNCF dans un prompt : utilisez la charte graphique officielle à part."], ["h", "La vérification des droits en cinq questions"], ["aiguillage", "Puis-je utiliser cette image ?", [["Compte perso gratuit et usage pro publié ?", "Stop : refaire avec l'outil sous licence employeur"], ["Les conditions de l'outil n'autorisent pas l'usage prévu (interne, publié, commercial) ?", "Stop : changer d'outil ou d'usage"], ["Le prompt contient une personne réelle, une marque, une œuvre ou un artiste nommé ?", "Stop : réécrire le prompt sans eux (personne réelle : accord écrit)"], ["Image réaliste d'une personne, d'un lieu ou d'un événement, et diffusée ?", "Ajouter la mention « généré par IA » (art. 50)"], ["Aucun « Stop » ni mention à ajouter", "Noter outil, date et prompt dans le journal d'usage, puis utiliser"]]], ["h", "Exemple résolu : l'affiche d'une sortie vélo (voie Perso)"], ["p", "Cas fictif, différent de l'exercice. Vous êtes bénévole dans une association cycliste (fictive). Il vous faut une illustration pour l'affiche de la sortie du dimanche, imprimée et publiée sur la page web de l'association. Outil : Canva, compte perso gratuit."], ["trajet", "Les étapes", ["Remplir le gabarit du prompt d'image, rubrique par rubrique.", "Générer, choisir une image, puis ajouter vous-même le titre et la date dans Canva.", "Passer les cinq questions de vérification des droits, dans l'ordre, et écrire la réponse à chacune.", "Noter l'usage dans votre journal d'usage."]], ["code", "Sujet : trois vélos de route garés devant un panneau de chemin de campagne sans inscription, sans aucune personne.\nUsage et cible : affiche A4 d'une association cycliste, vue en ville et sur sa page web.\nStyle : illustration plate, aplats de couleur.\nCadrage : plan large, format portrait.\nCouleurs : vert et bleu, fond clair, contraste élevé pour la lisibilité.\nÀ éviter : texte dans l'image, logos, marques de vélos, visages identifiables."], ["tip", "Le tableau ci-dessous suit l'aiguillage ligne par ligne : chaque « Non » fait passer à la ligne suivante, jusqu'à la dernière."], ["table", ["Question", "Réponse pour ce cas"], [["Compte perso gratuit et usage pro publié ?", "Non : compte perso, usage associatif, pas professionnel"], ["Les conditions de l'outil n'autorisent pas l'usage prévu ?", "Non, elles l'autorisent : Canva indique que vous possédez la sortie ; usage public « à vos risques », sans indemnisation"], ["Personne réelle, marque, œuvre ou artiste nommé dans le prompt ?", "Non : vélos sans marque, aucune personne, aucun style d'artiste"], ["Image réaliste d'une personne, d'un lieu ou d'un événement, diffusée ?", "Non : illustration plate d'un lieu imaginaire. Mention « illustration générée par IA » facultative, ajoutée en petit"], ["Aucun « Stop » ni mention à ajouter ?", "Oui : noter l'usage dans le journal, puis utiliser"]]], ["code", "Journal d'usage : [date] · Canva, compte perso gratuit · affiche sortie vélo (association fictive) · feu vert · prompt ci-dessus · titre et date ajoutés à la main · image contrôlée : ni marque ni lettre déformée."], ["tip", "Vérification : zoomez sur l'image avant de l'utiliser. Cherchez un logo, une marque ou des lettres apparus malgré la rubrique « À éviter ». Si vous en trouvez, régénérez. Pour un visuel pro, la réponse à la première question change tout : refaites-le avec l'outil sous licence de l'employeur."], ["src", [["Microsoft Support, Create AI-generated images with the Microsoft 365 Copilot app", "https://support.microsoft.com/en-us/microsoft-365-copilot/create-ai-generated-images-with-the-microsoft-365-copilot-app"], ["Microsoft, Customer Copyright Commitment (7/09/2023)", "https://blogs.microsoft.com/on-the-issues/2023/09/07/copilot-copyright-commitment/"], ["Adobe, offres Firefly (générations gratuites quotidiennes, modèles partenaires)", "https://www.adobe.com/products/firefly/plans"], ["Adobe, FAQ juridique Firefly pour les clients entreprise (2024)", "https://adobe.com/cc-shared/assets/pdf/enterprise/firefly-legal-faqs-enterprise-customers-2024-06-11.pdf"], ["Beri, comparatif des indemnisations des générateurs d'images (18/10/2026, source secondaire)", "https://www.beri.net/article/best-ai-image-generator-indemnity-firefly-vertex-imagen-openai-getty-shutterstock"], ["Canva, AI Product Terms (en vigueur au 26/06/2026)", "https://www.canva.com/policies/ai-product-terms"], ["Canva, niveaux de qualité IA Standard / Premium / Ultra", "https://www.canva.com/help/canva-ai-quality-tiers-standard-premium-ultra/"], ["donneespersonnelles.fr, deepfakes : cadre juridique", "https://www.donneespersonnelles.fr/deepfakes-cadre-juridique"], ["CNIL, hypertrucage (deepfake)", "https://cnil.fr/fr/hypertrucage-deepfake"], ["Norton Rose Fulbright, rapport du CSPLA sur les œuvres générées par IA (juillet 2026)", "https://connections.nortonrosefulbright.com/post/102o0bm/ai-generated-works-and-copyright-publication-of-a-report-by-the-cspla"]]]], "formes": ["decision", "comparaison"]}, {"id": "l5", "title": "Culture audio et vidéo", "min": 19, "voie": "perso", "blocks": [["p", "Leçon de découverte, sans exercice obligatoire. L'audio et la vidéo générés n'ont pas d'usage métier courant pour un technicien, mais vous les croiserez : transcription d'un vocal, nettoyage d'un enregistrement, vidéo virale qui semble vraie. Il faut savoir ce que font ces outils et ce qu'ils impliquent."], ["h", "Transcrire et nettoyer"], ["table", ["Besoin", "Outil", "Offre gratuite (nov. 2026)"], [["Transcrire une réunion de travail", "Teams (pro, leçon 3)", "Incluse dans votre environnement pro"], ["Transcrire et monter un audio ou une vidéo perso", "Descript", "1 h de média par mois, exports en 720p avec filigrane (source secondaire, CostBench)"], ["Nettoyer un enregistrement vocal (bruit, écho)", "Adobe Podcast, fonction Enhance Speech", "Existe en gratuit ; limites gratuites non vérifiées sur la page officielle"]]], ["warn", "Un enregistrement de collègues est une donnée personnelle et souvent une donnée interne : jamais dans Descript ou Adobe Podcast avec un compte perso. Ces outils sont pour vos projets perso (association, vidéo de vacances, podcast)."], ["h", "Les notions à connaître"], ["def", "Hypertrucage (deepfake)", "Une image, un son ou une vidéo générés ou manipulés par IA qui ressemblent de façon trompeuse à des personnes, lieux ou événements réels. En France, diffuser sans consentement un tel montage de l'image ou de la voix d'une personne, s'il n'est pas évident ou signalé, est puni d'un an et 15 000 €, deux ans et 45 000 € en ligne (article 226-8 du Code pénal).", "", "def:hypertrucage", "rappel"], ["def", "Article 50 de l'AI Act (transparence)", "Applicable depuis le 2 août 2026 : les outils marquent leurs contenus générés, et quiconque publie un hypertrucage pour son entreprise doit le signaler de façon visible. Détail juridique : gare 5, leçon « Transparence, droit d'auteur et deepfakes ».", "", "def:article-50-de-l-ai-act"], ["def", "SynthID", "Le filigrane numérique invisible de Google, inscrit dans les images de la vidéo. Il ne se voit pas à l'œil mais se vérifie avec les outils de Google (application Gemini, notamment).", "", "def:synthid"], ["def", "Filigrane visible", "Un logo ou une mention incrusté dans l'image, que l'on voit. Les offres gratuites l'imposent souvent ; le retirer ne retire pas le marquage invisible et peut violer les conditions d'utilisation.", "", "def:filigrane-visible"], ["h", "Générer une vidéo : Pika, Gemini Omni, Canva en parallèle"], ["table", ["Critère", "Pika", "Gemini Omni (Google)", "Canva"], [["Ce que c'est", "Générateur de clips vidéo courts", "Modèle vidéo de Google présenté à la conférence I/O de mai 2026 ; clips de 10 s avec édition par prompt", "Génération vidéo intégrée à l'éditeur Canva"], ["Accès gratuit", "Offre gratuite à crédits limités", "Gratuit dans Google Vids pour tout compte Google depuis le 23/09/2026, en 1080p, quotas non publiés ; dans l'app Gemini, réservé aux offres payantes Google AI au lancement", "Allocation IA mensuelle de l'offre gratuite ; la vidéo utilise le niveau Premium"], ["Filigrane", "Visible sur l'offre gratuite (le retirer est une fonction payante)", "SynthID invisible sur chaque clip ; filigrane visible non mentionné par Google", "Non précisé sur les pages consultées"], ["Licence", "Pas de licence commerciale en gratuit (source secondaire)", "Non précisé pour l'usage commercial gratuit", "Vous possédez la sortie, usage à vos risques, aucune indemnisation"], ["Marquage C2PA (norme de traçabilité de l'origine des contenus)", "Non vérifié", "Non mentionné par Google (SynthID seulement)", "Interdiction de retirer les métadonnées C2PA"], ["Fiabilité des infos", "Page officielle inaccessible ; source secondaire du 29/10/2026", "Sources officielles Google (blog) et presse", "Conditions officielles Canva"]]], ["p", "Le nom « Veo » désignait le modèle vidéo précédent de Google. Plusieurs sources secondaires indiquent que Gemini Omni l'a remplacé dans l'app Gemini ; Google présente Omni comme le prolongement de ce travail sans dire explicitement qu'il remplace Veo : non vérifié."], ["h", "Le risque deepfake, côté métier"], ["ul", ["Une fausse vidéo de chantier, d'incident ou d'un dirigeant peut circuler. Méfiance devant toute vidéo spectaculaire non sourcée : cherchez la source d'origine avant de la transférer.", "Jamais de vidéo ou de voix générée représentant un collègue, un voyageur ou un lieu réel identifiable, même pour rire.", "Une ingénierie sociale par voix clonée (« c'est le chef, ouvre-moi l'accès ») est un risque réel : en astreinte, rappelez sur le numéro connu."]], ["tip", "Pour découvrir sans risque : un clip de paysage imaginaire dans Google Vids ou Pika, puis cherchez où apparaissent le filigrane et la mention d'origine. C'est le meilleur moyen de comprendre le marquage."], ["carte", "Où chercher la marque d'une vidéo IA", "telephone", [[1, "Image de la vidéo", "Ce que vous voyez. Le filigrane visible est un logo ou une mention incrustés, souvent dans un coin (Pika en gratuit, par exemple). Le retirer ne retire pas le marquage invisible.", 4, ["Image", "Filigrane visible"]], [2, "SynthID : rien ne se voit", "Le filigrane invisible de Google est inscrit dans les images. Il se vérifie avec les outils de Google, notamment l'application Gemini.", 1], [3, "Mention « généré par IA »", "Signalement visible d'un contenu généré. Depuis le 2 août 2026 (article 50 de l'AI Act), il est obligatoire pour un hypertrucage publié par une entreprise (libellé indicatif).", 1], [4, "Compte et date de publication", "Qui a publié en premier ? Devant une vidéo spectaculaire, remontez à la source d'origine avant de transférer.", 1], [5, "Infos du fichier (C2PA)", "Métadonnées de traçabilité de l'origine, invisibles à l'écran. Elles sont facultatives : beaucoup d'outils n'en ajoutent pas (Google ne les mentionne pas pour Gemini Omni), et elles peuvent être retirées. Leur absence ne prouve donc pas que la vidéo est réelle (libellé indicatif).", 1]]], ["carte", "Vérifier une image ou une vidéo avec Gemini", "telephone", [[1, "App Gemini, nouveau chat", "Ouvrez l'app Gemini (ou gemini.google.com) avec votre compte Google perso. La vérification se fait dans une conversation ordinaire.", 1], [2, "+ › Upload Files", "Bouton d'ajout près de la zone de saisie (Add files), puis Upload Files pour un fichier du téléphone, More Uploads › Photos pour Google Photos, ou Add from Drive (libellés confirmés en anglais par l'aide Google, pour le web ; app et français : libellés indicatifs). Un fichier à la fois, 100 Mo au plus ; vidéo de moins de 90 s.", 1], [3, "Votre question", "Écrivez par exemple : « Cette image a-t-elle été créée ou modifiée par l'IA de Google ? ». Pour une capture d'écran, recadrez au plus près de l'image, sans montage.", 1], [4, "Réponse : SynthID", "Filigrane détecté : tout ou partie du fichier vient de l'IA de Google. Rien de détecté : pas l'IA de Google, mais peut-être une autre IA. Pour une vidéo, Gemini indique les passages marqués.", 2], [5, "Réponse : Content Credentials", "Si le fichier en contient (norme C2PA) : composition, historique des modifications, usage d'IA et qui fournit l'information (ex. « Info by Google LLC »). Sur le web et l'app Android, pas encore sur iPhone.", 2], [6, "Limite : environ 10 par jour", "Environ 10 images et 10 vidéos (5 minutes en tout) par 24 heures glissantes.", 1]]], ["carte", "Lire les Content Credentials d'un fichier", "telephone", [[1, "contentcredentials.org/verify", "Site Verify de la Content Authenticity Initiative, à ouvrir dans le navigateur du téléphone. Interface en anglais. Il lit les Content Credentials quel que soit l'outil qui les a ajoutées.", 1], [2, "Select a file from your device", "Choisissez le fichier : image (JPEG, PNG, WebP, HEIC…), vidéo ou audio (MP4, MOV, MP3…) ou PDF.", 1], [3, "Signataire et date", "Qui a signé les Content Credentials, et quand. Un signataire absent de la liste connue apparaît « Unrecognized ».", 1], [4, "App or device used", "Le logiciel ou l'appareil qui a créé le fichier.", 1], [5, "AI-generated content", "Signale qu'un élément a été généré par IA ; l'outil d'IA est nommé dans la partie Process.", 1], [6, "Ingredients", "Les fichiers combinés pour créer celui-ci, chacun avec ses propres Content Credentials s'il en a.", 1], [7, "No Content Credential", "Rien trouvé. Cela ne prouve pas que le fichier est authentique : ces métadonnées sont facultatives et peuvent être retirées.", 1]]], ["src", [["Google, Gemini Omni dans Google Vids, gratuit (23/09/2026)", "https://blog.google/products-and-platforms/products/workspace/gemini-omni-in-google-vids/"], ["eWeek, annonce de Gemini Omni à Google I/O (21/05/2026)", "https://www.eweek.com/fr/news/google-gemini-omni-ai-video-model/"], ["CostBench, offre gratuite Pika (source secondaire, vérifiée le 29/10/2026)", "https://costbench.com/software/ai-video-generators/pika/free-plan/"], ["Canva, niveaux de qualité IA Standard / Premium / Ultra", "https://www.canva.com/help/canva-ai-quality-tiers-standard-premium-ultra/"], ["Canva, AI Product Terms (en vigueur au 26/06/2026)", "https://www.canva.com/policies/ai-product-terms"], ["CostBench, offre gratuite Descript (source secondaire, vérifiée le 29/10/2026)", "https://costbench.com/software/ai-video-generators/descript/free-plan/"], ["Adobe Podcast, page des offres", "https://podcast.adobe.com/en/plans"], ["artificialintelligenceact.eu, règles de transparence de l'article 50", "https://artificialintelligenceact.eu/transparency-rules-article-50/"], ["Faegre Drinker, lignes directrices finales de l'article 50 (30/07/2026)", "https://www.faegredrinker.com/zh/insights/publications/2026/7/eu-ai-act-commission-confirms-transparency-code-of-practice-as-adequate-and-publishes-final-version-of-its-guidelines-on-transparency-obligations"], ["donneespersonnelles.fr, deepfakes : cadre juridique", "https://www.donneespersonnelles.fr/deepfakes-cadre-juridique"], ["CNIL, hypertrucage (deepfake)", "https://cnil.fr/fr/hypertrucage-deepfake"]]]], "formes": ["comparaison", "aspect"]}, {"id": "l6", "title": "Votre bibliothèque de prompts", "min": 12, "voie": "both", "blocks": [["def", "Gem et projet (rappel)", "Un Gem (Gemini) ou un projet (Claude, ChatGPT) est un assistant personnalisé : des instructions et des fichiers de référence enregistrés une fois, réutilisés à chaque conversation.", "", "def:gem-projet"], ["def", "Kit (rappel)", "Onglet de l'app où vous rangez vos prompts et modèles validés, exportable en fichier .md.", "", "def:kit", "rappel"], ["p", "Un bon prompt écrit une fois doit servir cent fois. La bibliothèque, c'est votre caisse à outils : rangée, étiquetée, sans pièce qui n'est pas à vous."], ["def", "Bibliothèque de prompts", "Un ensemble de prompts testés, rangés et documentés, prêts à réutiliser. Chaque fiche contient des variables à la place des données réelles.", "Nom · Usage · Feu · Outil · Prompt avec [VARIABLES] · Date du dernier test · Remarques", "def:bibliotheque-de-prompts"], ["def", "Variable (gabarit)", "Un emplacement entre crochets qui remplace une donnée réelle : [POSTE], [DATE], [FICHIER]. Le prompt devient un gabarit réutilisable et ne contient aucune information interne.", "", "def:variable"], ["trajet", "Le cycle d'une fiche de la bibliothèque", ["Écrire le prompt avec la structure Rôle, Cible, Objectif, Contexte, Format.", "Remplacer chaque donnée réelle par une variable entre crochets : [POSTE], [DATE].", "Le tester sur un cas fictif et noter la date du test.", "Le ranger : Copilot (pro), projet ou Gem (perso), et le Kit de l'app.", "Le retester s'il n'a pas servi depuis six mois : les outils changent."]], ["h", "Côté pro : Microsoft 365 Copilot"], ["table", ["Action", "Comment (libellés de l'interface en anglais, la version française peut différer)"], [["Enregistrer", "Après la réponse, survolez votre prompt, icône signet, titre de 35 caractères maximum. Retrouvez-le via « More prompts », onglet « Your saved prompts ». Il reste privé."], ["Partager", "Sur PC, survolez le prompt exécuté (sur téléphone, touchez-le longuement), « Copy » pour copier un lien, collez-le dans une conversation Teams ou OneNote, avec une phrase sur son usage."], ["Planifier", "Sur PC, survolez le prompt (sur téléphone, touchez-le longuement), « Schedule this prompt », réglez la date, la fréquence et l'avertissement par mail. 10 prompts planifiés au maximum ; gestion dans « Settings and more », « Scheduled prompts »."]]], ["warn", "Un prompt planifié s'exécute sans vous. Réservez-le à des synthèses (« ce que j'ai manqué cette semaine sur le projet [X] ») et relisez chaque résultat avant de l'utiliser."], ["h", "Côté perso : assistants personnalisés"], ["ul", ["Claude et ChatGPT : un projet par usage récurrent, avec ses instructions et ses fichiers de référence publics.", "Gemini : un Gem par usage (par exemple « Reformulateur de mails asso ») ; un Gem peut être partagé par lien.", "Dans tous les cas : pas de données pro, et des instructions écrites selon la même structure R/C/O/C/F."]], ["h", "Le Kit de l'app"], ["p", "L'onglet Kit est votre bibliothèque hors ligne, exportable en .md. Objectif de la formation : 10 prompts métier documentés à la fin du parcours, dont 5 dès cette gare (exercice « Cinq prompts pour le Kit »)."], ["tip", "Testez chaque prompt sur un cas fictif avant de le ranger, et notez la date. Les outils changent : un prompt non retesté depuis six mois est à revérifier."], ["tip", "Un prompt est portable : la même structure marche dans Copilot, Claude, ChatGPT et Gemini. C'est la donnée qui décide de l'outil, pas le prompt."], ["src", [["Rajeev Pentyala, enregistrer et planifier un prompt dans Copilot (23/09/2026)", "https://rajeevpentyala.com/2026/09/23/microsoft-copilot-save-and-schedule-prompts/"], ["Microsoft Support, Share your best prompts with others", "https://support.microsoft.com/en-US/Microsoft-365-Copilot/share-your-best-prompts-with-others"], ["Microsoft Support, Schedule your most used Copilot prompts", "https://support.microsoft.com/en-gb/topic/schedule-your-most-used-copilot-prompts-29dfd5fb-211a-4515-88a6-730b8074e489"], ["Google Support, partager un Gem", "https://support.google.com/gemini/answer/16504957"], ["Microsoft, guide d'étude de l'examen AB-730", "https://learn.microsoft.com/credentials/certifications/resources/study-guides/ab-730"], ["Office Watch, erreurs fréquentes avec l'IA (août 2026)", "https://office-watch.com/2026/ai-mistakes-to-avoid/"]]]], "formes": ["structure", "processus"]}, {"id": "l6r", "title": "Exemple résolu : une fiche complète, avant et après les variables", "min": 11, "voie": "both", "formes": ["texte"], "blocks": [["p", "Cas fictif, différent des fiches de l'exercice. Usage récurrent : répondre à une autre équipe qui veut emprunter un appareil de mesure. Vous avez d'abord écrit et testé le prompt sur un cas fictif, puis remplacé chaque donnée par une variable."], ["code", "Prompt testé (cas fictif, avant variables) :\nRôle : tu es technicien de maintenance télécom. Cible : [AGENT_7], d'une équipe voisine, qui demande à emprunter notre réflectomètre. Objectif : qu'il sache s'il peut l'avoir, quand, et à quelles conditions. Contexte : l'appareil est libre du 23 au 27/11 ; il doit revenir étalonné et avec ses accessoires. Format : mail de 80 mots maximum, ton cordial, conditions en liste. Contraintes : n'invente aucune date ni condition. Si une information manque, écris « à compléter »."], ["code", "FICHE DE LA BIBLIOTHÈQUE\nNom : Prêt d'appareil – réponse\nUsage : répondre à une demande de prêt d'un appareil de mesure par une autre équipe\nFeu : orange (mail interne, noms de collègues)\nOutil : Microsoft 365 Copilot dans Outlook (prompt enregistré sous ce nom)\nPrompt :\nRôle : tu es technicien de maintenance télécom.\nCible : [DEMANDEUR], d'une autre équipe, qui demande à emprunter [APPAREIL].\nObjectif : qu'il sache s'il peut l'avoir, quand, et à quelles conditions.\nContexte : disponibilité de l'appareil : [DATES_LIBRES] ; conditions de retour : [CONDITIONS].\nFormat : mail de 80 mots maximum, ton cordial, conditions en liste.\nContraintes : n'invente aucune date ni condition ; ne propose aucune date de retour que je n'ai pas donnée.\nSi une information manque, écris « à compléter ».\nDate du dernier test : 05/11/2026, sur le cas fictif ci-dessus\nRemarques : au premier test, Copilot a proposé une date de retour non demandée ; la contrainte « ne propose aucune date de retour » a été ajoutée, puis retestée."], ["code", "FICHE DE LA BIBLIOTHÈQUE (voie Perso)\nNom : Relance cotisation asso\nUsage : relancer les adhérents d'une association qui n'ont pas payé\nFeu : vert si le prompt ne contient aucun nom (les noms sont ajoutés à la main dans la messagerie)\nOutil : Gemini (Gem « Mails asso ») ou un projet Claude\nPrompt : Rôle : tu es secrétaire d'une association. Cible : un adhérent qui n'a pas encore réglé sa cotisation [ANNÉE]. Objectif : qu'il paie avant [DATE_LIMITE] sans se sentir accusé. Contexte : montant [MONTANT], moyens de paiement [MOYENS]. Format : 60 mots, ton aimable, une seule demande. Contraintes : n'invente aucun montant ni aucune date. Si une information manque, écris « à compléter ».\nDate du dernier test : 05/11/2026\nRemarques : aucune"], ["tip", "Vérification d'une fiche avant de la ranger : 1) chaque donnée réelle est devenue une [VARIABLE] (cherchez les noms, dates, lieux, montants) ; 2) le feu correspond à l'outil (orange → Copilot ou SNCF Group GPT) ; 3) la date du test est écrite ; 4) la remarque garde ce que le test vous a appris."]], "justif_texte": "Fiches modèles à copier telles quelles : les blocs de code sont le visuel."}], "quiz": [{"lecon": "l1", "voie": "both", "q": "Prompt d'un collègue : « Tu es technicien télécom. Voici mes notes de cette nuit : […]. Rédige un compte rendu pour mon chef de pôle, en 5 puces, sans rien inventer. » Quelle rubrique manque ?", "o": ["La cible : le prompt ne dit pas qui va lire le texte", "L'objectif : ce que le chef de pôle doit pouvoir en faire", "Le contexte : l'IA ne sait rien de l'intervention"], "a": 1, "why": "Leçon « La structure d'un prompt : Rôle, Cible, Objectif, Contexte, Format » : « rédige un compte rendu » est la tâche, pas l'objectif ; il manque la décision ou l'action attendue du lecteur. La cible est donnée (le chef de pôle). Le contexte aussi (les notes de la nuit)."}, {"lecon": "l2", "voie": "both", "q": "Vous confiez trois notes de coupure (fictives) à Copilot. Selon le dialogue multi-documents de la leçon, quelle est votre première demande ?", "o": ["Lister les documents reçus, avec leur date et leur objet", "Résumer chaque document en trois lignes, un par un", "Signaler les points sur lesquels les documents divergent"], "a": 0, "why": "Leçon « Ancrer la réponse dans vos sources », dialogue en quatre temps : d'abord l'inventaire (la liste des documents, avec date et objet), pour vérifier que l'IA voit les bons ; puis la question ciblée, le croisement, la synthèse. Signaler les divergences, c'est le croisement, en troisième temps. Le résumé document par document ne fait pas partie de la méthode."}, {"lecon": "l3", "voie": "pro", "q": "Votre chef vous demande de comparer dans Copilot deux offres de prestataires reçues pour un appel d'offres. Que faites-vous ?", "o": ["Vous le faites : ce sont des documents internes, donc feu orange", "Vous le faites après avoir masqué le nom des deux prestataires", "Pas d'IA en ligne, sauf outil autorisé par la charte pour ce niveau"], "a": 2, "why": "Leçon « Les documents pro courants avec Copilot » : offres, prix et appels d'offres sont des données contractuelles et financières, donc feu rouge, même dans un outil professionnel. Ce ne sont pas de simples documents internes. Masquer les noms ne retire ni les prix ni les clauses."}, {"lecon": "l4", "voie": "both", "q": "Pour une affiche publiée par votre service, vous créez une image avec votre compte Canva gratuit. Ni personne, ni logo. Que faire ?", "o": ["Recréer l'image dans l'outil d'images payé par l'employeur", "La publier : Canva vous reconnaît propriétaire de l'image", "La publier avec la mention « généré par IA »"], "a": 0, "why": "Leçon « Créer un visuel et vérifier ses droits », première question de la vérification : compte perso gratuit et usage pro publié, c'est stop. Être propriétaire de la sortie ne vous protège pas : Canva laisse l'usage commercial à vos risques, sans indemnisation. La mention « généré par IA » vise les images réalistes de personnes, lieux ou événements ; elle ne règle pas la question de l'outil."}, {"lecon": "l5", "voie": "perso", "q": "Un ami a créé un clip en offre gratuite dans Google Vids, avec Gemini Omni. D'après les informations réunies dans la leçon, quelle marque ce clip porte-t-il ?", "o": ["Des métadonnées C2PA, que Google ajoute à chaque clip", "Un SynthID invisible, vérifiable avec l'app Gemini", "Un filigrane visible, imposé par l'offre gratuite"], "a": 1, "why": "Leçon « Culture audio et vidéo », tableau des générateurs : pour Gemini Omni, « SynthID invisible sur chaque clip ; filigrane visible non mentionné par Google », et C2PA « non mentionné par Google (SynthID seulement) ». Le filigrane visible imposé en gratuit, c'est le cas de Pika. SynthID se vérifie avec les outils de Google, notamment l'application Gemini. La carte « Vérifier une image ou une vidéo avec Gemini » affiche des Content Credentials seulement si le fichier en contient : la leçon ne l'indique pas pour les clips Gemini Omni."}, {"lecon": "l6", "voie": "both", "q": "Votre Kit compte vingt fiches de prompts, toutes testées sur un cas fictif. Selon le cycle d'une fiche décrit dans la leçon, quand faut-il en retester une ?", "o": ["Dès que l'outil annonce une nouvelle version de son modèle", "Quand elle n'a pas servi depuis six mois", "Une fois par an, en revoyant tout le Kit d'un coup"], "a": 1, "why": "Leçon « Votre bibliothèque de prompts », cycle d'une fiche, étape 5 : « Le retester s'il n'a pas servi depuis six mois : les outils changent. » Le conseil de la leçon le redit : un prompt non retesté depuis six mois est à revérifier. Ni l'annonce d'une version ni une revue annuelle ne sont le repère donné."}], "exercises": [{"id": "e1", "title": "Récap d'une réunion de chantier", "min": 20, "voie": "pro", "kind": "prompt", "context": "Extrait de transcription FICTIVE, pour l'entraînement uniquement (équipe et lieux inventés). Réunion Teams de préparation de la mise en service d'un nouveau répartiteur optique au [POSTE_B]. Le responsable de la mise en service, [AGENT_6], était absent.\n[AGENT_1] : La mise en service était prévue le 8, on la décale au mercredi 9 décembre, de 22 h à 2 h.\n[AGENT_2] : Je prépare les étiquettes des tiroirs, je les apporte lundi.\n[AGENT_3] : Je veux bien faire les mesures de recette, à condition d'avoir le réflectomètre.\n[AGENT_1] : Le réflectomètre, quelqu'un peut le réserver ?\n[AGENT_4] : Pas cette semaine, je suis en formation.\n[AGENT_1] : On verra avec [AGENT_6].\n[AGENT_2] : Et les jarretières ? Je ne sais pas s'il en reste.\n[AGENT_1] : Point dans quinze jours.", "task": "Écrivez le prompt que vous donneriez à Copilot dans Teams (ou à SNCF Group GPT avec la transcription collée) pour obtenir le récap de cette réunion avec la liste des actions, destiné aux participants et à [AGENT_6], absent, qui doit valider la nouvelle date. Indiquez ensuite, en 3 lignes, ce que le tableau des actions doit contenir pour le réflectomètre, les jarretières et le prochain point.", "grid": ["Les cinq rubriques officielles sont présentes : Rôle, Cible, Objectif, Contexte, Format", "L'objectif dit à quoi sert le récap pour [AGENT_6] (valider la nouvelle date, voir ce qui bloque), pas seulement « fais un récap »", "Le format impose un tableau Qui / Quoi / Échéance", "Le prompt interdit d'attribuer une action non acceptée, dont une action proposée à un absent, et demande de recopier une condition", "Il prévoit quoi faire quand le responsable ou l'échéance manque", "Les 3 lignes de contrôle sont justes : réflectomètre sans responsable (point ouvert, [AGENT_6] non engagé), jarretières en point ouvert, prochain point « dans quinze jours » à préciser", "Aucun nom réel : les marqueurs [AGENT_n] sont conservés"], "model": "Rôle : tu es secrétaire de réunion d'une équipe de maintenance télécom ferroviaire.\nCible : les participants, et [AGENT_6], responsable de la mise en service, absent, qui doit valider la nouvelle date.\nObjectif : que [AGENT_6] puisse valider ou refuser la nouvelle date en voyant ce qui bloque, et que chacun sache qui fait quoi et pour quand.\nContexte : la transcription de la réunion de préparation de la mise en service du répartiteur optique du [POSTE_B].\nFormat : 1) Décisions (3 puces maximum) ; 2) Actions en tableau Qui / Quoi / Échéance ; 3) Points ouverts et risques ; 4) Prochain point ; 150 mots maximum, horaires sur 24 h.\nContraintes : n'invente aucune date, aucun horaire ni aucun responsable ; n'attribue une action qu'à la personne qui l'a acceptée ; une action proposée à un absent va dans les points ouverts ; recopie toute condition avec l'action ; garde les échéances telles qu'énoncées ; garde les marqueurs [AGENT_n].\nSi le responsable ou l'échéance d'une action manque, écris « à préciser » et liste ces manques à la fin.\n\nContrôle attendu :\n- Réflectomètre : réservation sans responsable (« à préciser »), en point ouvert ; « on verra avec [AGENT_6] » n'engage pas [AGENT_6]. Les mesures de [AGENT_3] sont une action acceptée sous condition d'avoir le réflectomètre : c'est le risque principal pour la date.\n- Jarretières : stock inconnu, point ouvert sans responsable.\n- Prochain point : « dans quinze jours », date à préciser. Décision : mise en service décalée au mercredi 9 décembre, 22 h - 2 h (fin le 10 décembre). [AGENT_2] apporte les étiquettes lundi.", "notions": ["def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant", "def:transcription", "def:recap-intelligent", "def:variable", "def:pseudonymisation"], "type": "methode", "exemple_resolu": "m2.l3r"}, {"id": "e2", "title": "Synthèse multi-documents, sources exigées", "min": 25, "voie": "both", "kind": "free", "context": "Trois documents FICTIFS, à coller ou déposer dans Copilot Notebooks (pro) ou Gemini Notebook (perso, car entièrement fictifs) :\nDoc 1, note de chantier du 02/10 : « Remplacement des batteries du local technique Poste C prévu semaine 42. Durée de coupure de l'alimentation secourue : 2 h. Intervention de jour. »\nDoc 2, mail du prestataire du 06/10 : « Livraison des batteries décalée en semaine 43. Intervention possible uniquement de nuit pour raison d'accès. »\nDoc 3, extrait de consigne fictive : « Toute coupure de l'alimentation secourue de plus de 1 h impose un groupe électrogène de secours et l'information préalable du poste de supervision. »", "task": "1) Écrivez le prompt de synthèse pour votre chef de pôle, en exigeant une source après chaque phrase et le signalement des contradictions. 2) Lancez-le et vérifiez chaque citation dans les documents. 3) En 5 lignes, expliquez les principes de prompt engineering que vous avez appliqués (écrit de la compétence C2).", "grid": ["Le prompt suit Rôle / Cible / Objectif / Contexte / Format", "Il limite la réponse aux trois documents", "Il exige la source entre crochets après chaque phrase", "La synthèse signale le décalage de semaine 42 à 43 et le passage de jour à nuit", "La synthèse relève qu'une coupure de 2 h impose un groupe électrogène et l'information de la supervision", "Chaque citation a été vérifiée dans le document d'origine"], "model": "Prompt :\nRôle : tu es assistant documentaire d'une équipe de maintenance télécom.\nCible : mon chef de pôle, qui doit valider l'intervention.\nObjectif : qu'il voie en une lecture ce qui a changé et ce qu'il doit décider ou faire préparer.\nContexte : réponds UNIQUEMENT à partir des trois documents fournis (Doc 1 note de chantier, Doc 2 mail du prestataire, Doc 3 consigne).\nFormat : 3 rubriques, Ce qui change / Ce que la consigne impose / À décider ; 120 mots maximum ; après chaque phrase, la source entre crochets [Doc n].\nContraintes : aucune connaissance extérieure ; ne tranche aucune contradiction, signale-la.\nSi une information manque (date exacte, horaire de nuit, qui informe la supervision), écris « à préciser ».\n\nSynthèse attendue :\nCe qui change : la livraison est décalée de la semaine 42 à la semaine 43 [Doc 2]. L'intervention, prévue de jour [Doc 1], n'est possible que de nuit [Doc 2].\nCe que la consigne impose : la coupure prévue dure 2 h [Doc 1] ; au-delà de 1 h, un groupe électrogène de secours et l'information préalable du poste de supervision sont obligatoires [Doc 3].\nÀ décider : valider le créneau de nuit en semaine 43, date et horaire à préciser ; désigner qui prévoit le groupe électrogène et qui informe la supervision (à préciser).\n\nPrincipes appliqués : rubriques R/C/O/C/F pour ne rien laisser deviner ; objectif formulé comme une décision ; ancrage limité aux documents pour éviter l'invention ; citations pour permettre la vérification ; consigne explicite pour les manques et les contradictions ; relecture humaine de chaque citation avant envoi.", "notions": ["def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant", "def:ancrage", "def:reference-de-fichier", "def:copilot-notebooks", "def:gemini-notebook", "dialogue multi-documents en 4 temps", "principes C2"], "type": "methode", "exemple_resolu": "m2.l2r", "apercus": ["def:rs6776-apercu"]}, {"id": "e3", "title": "Visuel de briefing sécurité et vérification des droits", "min": 20, "voie": "both", "kind": "free", "context": "Situation FICTIVE : vous préparez un briefing de début de poste sur une consigne fictive « Port des gants isolants obligatoire avant toute ouverture d'armoire d'alimentation ». Il vous faut un pictogramme d'illustration pour la diapositive. Voie Pro : Copilot, module Create. Voie Perso (pour un support d'association ou d'entraînement) : Firefly, Canva, Gemini ou ChatGPT.", "task": "1) Écrivez le prompt d'image. 2) Générez le visuel et ajoutez vous-même le texte de la consigne dans la diapositive. 3) Répondez aux cinq questions de vérification des droits de la leçon « Créer un visuel et vérifier ses droits », par écrit.", "grid": ["Le prompt précise sujet, usage, style, cadrage, couleurs et éléments à éviter", "Aucune personne réelle, marque ni logo dans le prompt", "Le texte de la consigne est ajouté hors de l'image, sans faute", "L'outil et le type de compte sont identifiés (licence employeur ou compte perso)", "La conclusion sur l'usage autorisé est cohérente avec les conditions de l'outil", "L'usage est noté dans le journal (outil, date, prompt)"], "model": "Prompt (Copilot, module Create) :\nSujet : pictogramme d'une main portant un gant isolant épais, devant une porte d'armoire électrique grise entrouverte, sans aucune personne visible.\nUsage et cible : diapositive de briefing sécurité vue par 6 techniciens, sur écran et sur téléphone.\nStyle : pictogramme plat, contours épais, sans détail superflu.\nCadrage : gros plan, format carré 1024×1024.\nCouleurs : jaune et noir de signalisation, fond blanc, contraste élevé.\nÀ éviter : tout texte dans l'image, logos, marques, visage, uniforme identifiable.\n\nVérification des droits :\n1. Outil : Copilot, module Create, avec la licence Microsoft 365 Copilot de l'employeur.\n2. Usage : interne (briefing d'équipe). Couvert par le Customer Copyright Commitment sous conditions : filtres actifs, pas de recherche de contrefaçon, entrées dont j'ai les droits.\n3. Prompt : ni personne réelle, ni marque, ni style d'artiste nommé.\n4. Image non réaliste (pictogramme), ne représente ni personne ni lieu réel : pas d'hypertrucage, pas de mention article 50 obligatoire. Je peux tout de même indiquer « illustration générée par IA » en petit.\n5. Journal : Copilot Create, [date], prompt ci-dessus, texte ajouté à la main, consigne vérifiée dans le document de référence.\n\nVariante perso (Firefly gratuit) : usage limité à un projet perso ; aucune indemnisation hors contrat entreprise ; ne pas réutiliser l'image dans un support pro publié.", "notions": ["def:image-generee", "def:indemnisation", "def:customer-copyright-commitment", "prompt d'image", "vérification des droits en 5 questions", "def:journal-d-usage", "def:article-50-de-l-ai-act"], "type": "methode", "apercus": ["def:journal-usage-apercu", "def:article-50-apercu"], "exemple_resolu": "m2.l4"}, {"id": "e4", "title": "Cinq prompts pour le Kit", "min": 25, "voie": "both", "kind": "free", "context": "Reprenez les usages de votre carte des tâches (gare 1, exercice « Votre carte des tâches »). Chaque prompt doit être un gabarit : des [VARIABLES] à la place de toute donnée réelle.", "task": "Rédigez 5 fiches de prompts au format Nom · Usage · Feu · Outil · Prompt · Date de test, testez chacune sur un cas fictif, puis ajoutez-les à l'onglet Kit. Au moins 3 fiches en voie Pro et 1 en voie Perso.", "grid": ["Cinq fiches complètes (nom, usage, feu, outil, prompt, date de test)", "Chaque prompt suit Rôle / Cible / Objectif / Contexte / Format", "Chaque prompt contient une contrainte « ne rien inventer » et une consigne pour l'information manquante", "Aucune donnée réelle : uniquement des [VARIABLES]", "Le feu de chaque fiche est cohérent avec l'outil choisi", "Les cinq fiches sont enregistrées dans le Kit (et, en pro, au moins une dans les prompts enregistrés de Copilot)"], "model": "1. CR d'intervention · Pro · Orange · Copilot Word\nRôle : tu es rédacteur technique en maintenance télécom ferroviaire. Cible : [CHEF DE PÔLE]. Objectif : lui permettre de décider de [SUITE À DONNER]. Contexte : mes notes brutes [NOTES]. Format : Contexte / Constat / Actions / Résultat / Vigilance, 200 mots maximum, horaires en 24 h. Contraintes : n'invente aucune valeur ni cause. Si une information manque, écris « à compléter ».\n\n2. Synthèse de fil de mails · Pro · Orange · Copilot Outlook\nRôle : assistant d'un technicien. Cible : [DESTINATAIRE] qui n'a pas suivi le fil. Objectif : qu'il sache ce qui est décidé, ouvert et attendu de lui. Contexte : ce fil de mails. Format : Décidé / Ouvert / Attendu de vous, 120 mots. Contraintes : n'invente aucune date ; cite l'auteur de chaque décision. Si un point est ambigu, classe-le dans « Ouvert ».\n\n3. Récap de réunion · Pro · Orange · Copilot Teams\nRôle : secrétaire de réunion. Cible : participants et [ABSENT]. Objectif : savoir qui fait quoi et pour quand. Contexte : la transcription. Format : Décisions / tableau Qui-Quoi-Échéance / Points ouverts, 150 mots. Contraintes : n'attribue aucune action non acceptée. Si responsable ou échéance manque, écris « à préciser ».\n\n4. Checklist depuis une procédure · Pro · Orange · Copilot Word\nRôle : formateur technique. Cible : [COLLÈGUE DÉBUTANT]. Objectif : appliquer /[PROCÉDURE] sans erreur la première fois. Contexte : la procédure jointe uniquement. Format : 10 étapes maximum avec renvoi au paragraphe, puis 3 vigilances. Contraintes : aucune étape absente du document. Si une étape est ambiguë, écris « à vérifier dans la procédure ».\n\n5. Explication d'une notice publique · Perso · Vert · Gemini Notebook ou Claude\nRôle : formateur télécom. Cible : [NIVEAU DU LECTEUR]. Objectif : comprendre [FONCTION DE L'ÉQUIPEMENT] avant une première utilisation. Contexte : la notice constructeur publique jointe. Format : 5 points, un exemple concret, les références de page. Contraintes : réponds uniquement à partir de la notice. Si la notice ne traite pas un point, dis-le.\n\nDate de test : [JJ/MM/AAAA] pour chacune, sur un cas fictif.", "notions": ["def:bibliotheque-de-prompts", "def:variable", "feux", "def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant"], "type": "methode", "exemple_resolu": "m2.l6r"}]}, "m3": {"lessons": [{"id": "l1", "title": "Pourquoi l'IA se trompe avec aplomb", "min": 12, "voie": "both", "blocks": [["p", "En gare 1, vous avez vu qu'un modèle de langage produit du texte plausible, pas des faits vérifiés. Ici, on regarde comment ses erreurs se présentent, pour les reconnaître vite. Le piège n'est pas l'erreur. C'est le ton : une valeur fausse est écrite avec la même assurance qu'une valeur juste."], ["def", "Hallucination", "Information fausse ou inventée présentée par l'IA comme un fait : un chiffre, une référence, une citation, un événement. Elle n'est pas un bug rare ; c'est un effet normal de la façon dont le modèle produit ses réponses.", "", "def:hallucination", "rappel"], ["h", "Deux raisons, selon les chercheurs d'OpenAI"], ["trajet", "", ["Les faits isolés sont mal appris. Un fait qui n'a pas de logique interne (une date de naissance, un numéro de norme, un seuil) et qui apparaît rarement dans les données d'entraînement sera souvent restitué de travers. Testés sur l'anniversaire d'un des auteurs, un modèle a donné trois dates différentes, toutes fausses.", "L'entraînement récompense le bluff. Les tests de performance notent une réponse juste 1 et un « je ne sais pas » 0, comme un QCM (questionnaire à choix multiples) sans points négatifs. Deviner rapporte donc plus que s'abstenir. Les modèles apprennent à répondre plutôt qu'à avouer un doute."]], ["tip", "Conséquence directe pour votre métier : les numéros de normes, les seuils d'affaiblissement, les longueurs, les références de procédures et les dates sont exactement le genre de « faits isolés » que l'IA restitue mal."], ["h", "Les six familles d'erreurs à connaître"], ["table", ["Famille", "À quoi elle ressemble", "Exemple fictif"], [["Référence inventée", "Norme, article, décision, document cité avec un numéro précis qui n'existe pas", "« selon la norme EN 50126-7 » : la série EN 50126 ne compte que deux parties"], ["Chiffre faux", "Valeur technique, calcul ou ordre de grandeur erroné", "« 12 km × 0,35 dB/km = 3,2 dB » (le bon résultat est 4,2 dB)"], ["Date ou version périmée", "Information juste à la date d'entraînement, dépassée aujourd'hui", "« dernière version : 2017 » alors qu'un amendement de 2024 existe"], ["Confusion technique", "Unités, notions ou normes voisines mélangées", "« longueur d'onde de 1550 µm » au lieu de 1550 nm"], ["Omission", "Une étape, une réserve ou un risque important manque", "Une procédure de mesure sans l'étape de consignation"], ["Biais ou stéréotype", "Répartition ou formulation qui reproduit un cliché", "« une technicienne pour la saisie, deux techniciens pour les mesures »"]]], ["def", "Omission", "Absence, dans la réponse, d'une information nécessaire à l'objectif : étape de sécurité, exception, condition d'application. Elle est plus difficile à voir qu'une erreur, car rien ne la signale.", "", "def:omission"], ["def", "Biais et stéréotype", "Un biais est une tendance systématique de la réponse (vers un point de vue, un public, une région). Un stéréotype est un biais qui attribue un rôle ou une qualité à un groupe de personnes. En mars 2024, une étude de l'UNESCO (Organisation des Nations unies pour l'éducation, la science et la culture) sur GPT-2, GPT-3.5 et Llama 2 a relevé que les prénoms féminins étaient plus souvent associés à « maison », « famille », « enfants », et les prénoms masculins à « carrière », « salaire ».", "", "def:biais-et-stereotype"], ["h", "Des cas réels, en France"], ["p", "Les tribunaux français ont commencé à relever des écritures rédigées avec l'IA. Quelques décisions citées par le cabinet Morgan Lewis (mars 2026) :"], ["table", ["Date", "Juridiction", "Ce qui est relevé"], [["18/12/2025", "Tribunal judiciaire de Périgueux", "Références de jurisprudence inexactes ou inexistantes ; le juge invite à vérifier"], ["29/12/2025", "Tribunal administratif d'Orléans (n° 2506461)", "Jurisprudences citées introuvables"], ["30/01/2026", "Tribunal administratif de Rennes (n° 2600610)", "Requête rédigée par IA portée devant une juridiction incompétente"], ["26/02/2026", "Cour administrative d'appel de Bordeaux (n° 25BX02906)", "Mise en garde sur la vérification des références"], ["13/03/2026", "Conseil national des barreaux", "Guide éthique et IA ; aucune sanction d'avocat signalée, seulement des avertissements"]]], ["p", "Dans le monde, la base tenue par le chercheur Damien Charlotin recensait plus de 1 000 décisions de ce type en mars 2026 (chiffre relayé par un blog tiers, non vérifié directement : la base n'a pas pu être consultée)."], ["h", "La « frontière » de l'outil"], ["p", "Une étude Harvard / BCG (Boston Consulting Group) sur 758 consultants a montré deux effets. Sur les tâches que l'IA maîtrise, les consultants assistés vont plus vite et font mieux. Sur une tâche hors de sa « frontière », ils ont donné 19 points de solutions correctes en moins que ceux qui travaillaient sans IA. La frontière est irrégulière : l'IA peut réussir une synthèse difficile et rater une addition."], ["warn", "Un outil ancré dans vos fichiers (Copilot, SNCF Group GPT) se trompe moins sur le contenu de ces fichiers, mais il peut mal les lire, prendre une ancienne version ou compléter avec ses connaissances générales. Microsoft rappelle lui-même que Copilot peut produire un contenu « biaisé, offensant ou incorrect »."], ["tip", "Une étude Microsoft Research / Carnegie Mellon (319 travailleurs du savoir) observe que plus on fait confiance à l'IA, moins on exerce son esprit critique. Gardez l'habitude de vérifier même quand l'outil a eu raison dix fois."], ["src", [["Kalai et al. (OpenAI), Why Language Models Hallucinate, sept. 2025", "https://arxiv.org/html/2509.04664v1"], ["CB News, l'UNESCO alerte sur des préjugés sexistes dans l'IA générative (7 mars 2024)", "https://www.cbnews.fr/digital/unesco-alerte-prejuges-sexistes-intelligence-artificielle-generative"], ["Morgan Lewis, hallucinations de l'IA devant les juridictions françaises, mars 2026", "https://www.morganlewis.com/pubs/2026/03/the-risks-of-hallucinations-and-misuse-of-generative-artificial-intelligence-before-french-courts"], ["Le Monde Informatique, les hallucinations de l'IA arrivent dans les juridictions françaises", "https://www.lemondeinformatique.fr/actualites/lire-les-hallucinations-de-l-ia-arrivent-dans-les-juridictions-francaises-99126.html"], ["J. L. Ellis, How many lawyers have gotten in trouble because of AI hallucinations (chiffre de la base Charlotin)", "https://jlellis.net/blog/how-many-lawyers-have-gotten-in-trouble-because-of-ai-hallucinations-a-lot/"], ["Base de D. Charlotin (décisions mentionnant des hallucinations)", "https://www.damiencharlotin.com/hallucinations/"], ["Axios, étude HBS/BCG sur la « frontière » de l'IA", "https://www.axios.com/2023/09/29/ai-mistakes-consulting-bcg-study"], ["The Register, étude Microsoft Research / CMU sur l'esprit critique (CHI 2025)", "https://www.theregister.com/2025/02/11/microsoft_study_ai_critical_thinking/"], ["Microsoft, About Copilot Chat responses", "https://support.microsoft.com/en-us/microsoft-365-copilot/about-copilot-chat-responses"], ["EVS, EN 50126-1:2017+A1:2024 (version consolidée)", "https://www.evs.ee/en/evs-en-50126-1-2017-a1-2024-consolidated"]]]], "formes": ["classement", "quantites"]}, {"id": "l2", "title": "Analyser une réponse avec une grille", "min": 14, "voie": "both", "blocks": [["p", "Lire une réponse IA « en entier, attentivement » ne suffit pas : l'œil glisse sur un texte bien écrit. Il faut une méthode, comme pour une recette de liaison."], ["def", "Grille d'analyse", "Liste fixe de questions appliquées à chaque réponse avant usage. Elle rend le contrôle répétable et traçable.", "Grille FIABLE en 6 points : voir le tableau ci-dessous.", "def:grille-d-analyse"], ["table", ["Lettre", "Point", "Question à se poser"], [["F", "Faits", "chaque chiffre, date, nom et référence est-il vérifié ?"], ["I", "Intégralité", "manque-t-il une étape, une réserve, un risque ?"], ["A", "Adéquation", "la réponse sert-elle l'objectif, la cible et le format demandés ?"], ["B", "Biais", "formulation, exemples ou répartition des rôles stéréotypés ?"], ["L", "Logique", "calculs justes, pas de contradiction interne ?"], ["E", "Étayage", "chaque affirmation critique a-t-elle une source ouverte et lue ?"]]], ["h", "La méthode en quatre temps"], ["trajet", "", ["Repérer : surlignez (ou listez) toutes les affirmations vérifiables : valeurs, unités, dates, normes, noms, citations.", "Trier : marquez « critique » ce qui peut avoir un effet sur la sécurité, une décision, un engagement ou un document diffusé. Le reste est « secondaire ».", "Vérifier : pour chaque point critique, trouvez une source primaire et lisez le passage exact.", "Corriger et tracer : remplacez la valeur par la valeur vérifiée avec sa source, ou écrivez [À VÉRIFIER]. Notez ce que vous avez contrôlé."]], ["def", "Source primaire", "Le document d'origine qui fait autorité sur l'information : le texte de la norme, la fiche technique du constructeur, le référentiel ou la procédure interne à jour, Légifrance ou EUR-Lex pour le droit, le site officiel de l'éditeur pour une fonction d'outil. Un article qui en parle est une source secondaire ; une réponse d'IA n'est pas une source.", "", "def:source-primaire"], ["def", "Recoupement", "Confirmer une information par au moins deux sources indépendantes l'une de l'autre, dont une primaire si possible. Deux sites qui recopient la même dépêche ne comptent que pour une.", "", "def:recoupement"], ["h", "Ouvrir les sources, vraiment"], ["ul", ["Ouvrez chaque lien cité. Un lien peut exister et ne pas dire ce que l'IA lui prête.", "Cherchez le passage exact (Ctrl+F ou « Rechercher dans la page » sur le téléphone).", "Vérifiez la date et la version du document : une procédure de 2019 peut avoir été remplacée.", "Une référence introuvable est présumée inventée jusqu'à preuve du contraire.", "Dans Gemini, ouvrez les sources quand elles sont proposées et utilisez « Vérifier la réponse » (icône G) quand elle est disponible. Sans source affichée, traitez la réponse comme non sourcée."]], ["h", "Corriger une hallucination"], ["table", ["Situation", "Ce que vous faites"], [["Valeur trouvée dans une source primaire", "Vous la remplacez et vous citez la source (titre, version, page)"], ["Valeur introuvable", "Vous la supprimez ou vous écrivez [À VÉRIFIER : source à trouver]"], ["Référence (norme, décision) introuvable", "Vous la supprimez. Vous ne la « réparez » pas en cherchant une référence voisine"], ["Calcul", "Vous le refaites vous-même, à la calculatrice ou dans Excel"], ["Stéréotype", "Vous reformulez de façon neutre (« l'équipe », « un agent ») ou répartissez les rôles selon les compétences"]]], ["def", "Trace de revue", "Note courte qui garde la preuve du contrôle humain : date, outil, points vérifiés, sources, corrections faites. Elle rejoint votre carnet de bord.", "Modèle : [date] · [outil] · [document] · Vérifié : [points + sources] · Corrigé : [liste] · Reste à vérifier : [liste] · Relu par : [vous]", "def:trace-de-revue"], ["src", [["Microsoft Learn, guide d'étude AB-730", "https://learn.microsoft.com/credentials/certifications/resources/study-guides/ab-730"], ["France Compétences, fiche RS7232", "https://www.francecompetences.fr/recherche/rs/7232"], ["Aide Google, sources et vérification des réponses Gemini", "https://support.google.com/gemini/answer/14143489?hl=fr"], ["Anthropic, cadre AI Fluency 4D (Dakan et Feller)", "https://www-cdn.anthropic.com/334975cdec18f744b4fa511dc8518bd8d119d29d.pdf"], ["CB News, l'UNESCO alerte sur des préjugés sexistes dans l'IA générative (7 mars 2024)", "https://www.cbnews.fr/digital/unesco-alerte-prejuges-sexistes-intelligence-artificielle-generative"]]]], "formes": ["processus", "decision"]}, {"id": "l2r", "title": "Exemple résolu : la grille FIABLE sur un résumé de note de service", "min": 17, "voie": "both", "blocks": [["p", "Cas fictif, différent de l'exercice. Vous avez demandé à un assistant : « Résume en 5 puces, pour un nouvel arrivant qui lit sur téléphone, la note NS-07 et la fiche du local. » Deux documents font foi : les voici, puis la réponse."], ["code", "Document 1 : note de service fictive NS-07, version du 02/10/2026 (remplace la version du 15/03/2025) :\n- Badge personnel obligatoire pour entrer dans le local technique du [POSTE_B].\n- Clé de secours : à demander au chef de poste du [POSTE_A].\n- Registre à signer à l'entrée et à la sortie.\n- Entre 20 h et 6 h, toute intervention se fait à deux personnes au moins.\n- En cas de problème : [CONTACT_ASTREINTE].\n\nDocument 2 : fiche fictive du local technique du [POSTE_B], mise à jour le 05/10/2026 :\n- Température normale : de 18 à 27 °C. Au-delà, prévenir [CONTACT_ASTREINTE]."], ["code", "Réponse de l'IA (lignes numérotées pour la relecture) :\n1. Le badge personnel est obligatoire pour entrer dans le local technique du [POSTE_B].\n2. En cas d'oubli, demandez la clé de secours au chef de poste du [POSTE_B].\n3. Le registre se signe à l'entrée.\n4. De 20 h à 6 h, soit 8 heures, intervenez à deux.\n5. Ces règles viennent de la note NS-07 du 15/03/2025.\n6. Au-delà de 25 °C, quittez le local.\n7. Les nouveaux arrivants, souvent moins rigoureux, relisent la note chaque semaine, comme l'impose une directive européenne de 2019."], ["trajet", "Les quatre temps appliqués", ["Repérer : lieu de la clé (ligne 2), registre (3), horaires et calcul (4), version citée (5), seuil de température (6), directive (7), consigne de relecture (7).", "Trier : lignes 2 à 6 critiques (accès, sécurité, document de référence) ; ligne 7 critique aussi, car elle cite une règle et sera diffusée.", "Vérifier : comparez chaque ligne au passage exact des documents 1 et 2 ; refaites le calcul ; lisez l'en-tête du document 1 pour la version.", "Corriger et tracer : une ligne du tableau par problème, puis la version corrigée et la trace de revue."]], ["table", ["Ligne", "Lettre", "Comment repéré", "Correction", "Document"], [["2", "F", "Désaccord avec le document 1 ([POSTE_A], pas [POSTE_B])", "Clé au chef de poste du [POSTE_A]", "Doc 1"], ["3", "I", "Comparaison avec le document 1 : la sortie a disparu", "Signer à l'entrée et à la sortie", "Doc 1"], ["4", "L", "Calcul refait : de 20 h à 6 h, il y a 10 heures, pas 8", "Supprimer « soit 8 heures » (inutile) ou écrire 10 heures", "Doc 1"], ["5", "F (E accepté)", "En-tête du document 1 : la version du 15/03/2025 est remplacée", "NS-07, version du 02/10/2026", "Doc 1"], ["6", "F", "Désaccord avec le document 2 : 27 °C et « prévenir », pas 25 °C et « quitter »", "Au-delà de 27 °C, prévenez [CONTACT_ASTREINTE]", "Doc 2"], ["7", "B + E", "Stéréotype sur un groupe ET directive absente des deux documents, sans lien", "Supprimer la ligne entière ; ne pas chercher une directive « voisine »", "Doc 1 et 2"], ["manque", "I", "Lecture en sens inverse : le contact du document 1 n'apparaît nulle part", "Ajouter « Un problème ? Appelez [CONTACT_ASTREINTE] »", "Doc 1"], ["ensemble", "A", "7 lignes pour 5 puces demandées", "Revenir à 5 puces après corrections", "La demande"]]], ["p", "Ligne 7 : un seul problème, deux lettres. La règle de comptage de l'exercice le prévoit : une ligne fautive compte une fois, et vous citez les deux lettres. Ligne 1 : conforme au document 1, rien à faire."], ["code", "Version corrigée (5 puces) :\n- Badge personnel obligatoire pour entrer dans le local technique du [POSTE_B].\n- Clé de secours : demandez-la au chef de poste du [POSTE_A].\n- Signez le registre à l'entrée et à la sortie.\n- Entre 20 h et 6 h, intervenez à deux personnes au moins.\n- Plus de 27 °C ou un autre problème ? Appelez [CONTACT_ASTREINTE].\n\nTrace de revue : 12/11/2026 · assistant IA · résumé de NS-07 et de la fiche du local (fictifs) · Vérifié : 7 lignes comparées à NS-07 version du 02/10/2026 et à la fiche du 05/10/2026, calcul refait · Corrigé : lignes 2, 3, 4, 5, 6 ; ligne 7 supprimée ; contact ajouté · Reste à vérifier : rien · Relu par : moi."], ["tip", "Vérification : relisez la version corrigée en partant des sources, cette fois. Chaque ligne des documents 1 et 2 doit s'y retrouver une fois, et rien d'autre. Ce sens inverse attrape les oublis (point I), comme le contact ici."], ["tip", "Deux versions d'un même document ? Seule la plus récente fait foi, et c'est son en-tête qui le dit. Une IA cite souvent la version qu'elle a « vue » ailleurs : vérifiez toujours la date citée."], ["warn", "Erreur fréquente : vérifier les points faciles (orthographe, ton) et laisser passer le chiffre. Commencez toujours par les points critiques, et refaites chaque calcul vous-même."]], "formes": ["processus"]}, {"id": "l3", "title": "Itérer : viser juste en deux tours", "min": 13, "voie": "both", "blocks": [["def", "Langage clair (aperçu)", "Écriture qui permet au lecteur visé de trouver, comprendre et utiliser l'information du premier coup : phrases courtes, mots courants, une idée par phrase. Détail : gare 4.", "", "def:langage-clair-apercu"], ["def", "Situation de handicap (aperçu)", "Difficulté qui naît de la rencontre entre une limitation (visuelle, auditive, cognitive, motrice) et un contenu mal conçu. Détail : gare 4.", "", "def:situation-handicap-apercu"], ["p", "La première réponse est un brouillon. Les utilisateurs efficaces la retravaillent tout de suite, par petites corrections ciblées, au lieu de tout redemander."], ["def", "Itération", "Un aller-retour volontaire avec l'IA pour rapprocher la réponse de l'objectif : vous analysez la sortie, vous identifiez l'écart, vous donnez une consigne qui corrige cet écart précis.", "Constat (ce qui ne va pas) + Consigne (ce qu'il faut changer) + Ce qu'il faut garder", "def:iteration"], ["h", "Les cinq leviers"], ["table", ["Levier", "Quand l'utiliser", "Exemple de relance"], [["Enrichir le contexte", "La réponse est générique ou fausse faute d'informations", "« Précision : l'intervention a eu lieu de nuit, sous consignation, sur une liaison de 12 km. Reprends en tenant compte de ces éléments. »"], ["Affiner le prompt initial", "Le problème vient de la demande elle-même", "Modifier le premier message (quand l'outil le permet) plutôt qu'ajouter une correction au bout de la conversation"], ["Changer le format", "Le fond est bon, la forme ne sert pas", "« Mets la même chose en tableau : étape, responsable, délai. »"], ["Adapter au métier", "Vocabulaire ou niveau inadapté au destinataire", "« Le destinataire est le chef de pôle : garde les conclusions et la décision attendue, retire le détail des mesures. »"], ["Ajouter des contraintes", "Ton, style, longueur, accessibilité", "« 120 mots maximum, phrases de 15 mots au plus, une idée par phrase, sans sigle non expliqué. »"]]], ["h", "Le prompt d'optimisation"], ["p", "C'est l'épreuve C5 de la certification RS6776 (présentée en gare 1, leçon « Cartographier vos tâches ») : améliorer un contenu fourni selon des critères imposés. Les deux critères d'évaluation : le prompt tient compte de tous les critères de modification ; le contenu optimisé les respecte (ton, prise en compte du handicap)."], ["def", "Prompt d'optimisation", "Prompt qui demande de transformer un contenu existant selon une liste de critères, sans en changer les faits.", "1. Rôle\n2. Cible (et handicap éventuel)\n3. Objectif du contenu optimisé\n4. Contexte (d'où vient le contenu, où il sera lu)\n5. Critères imposés, numérotés, un par ligne\n6. Format de sortie\n7. Contraintes : ne rien ajouter de factuel, signaler toute information manquante par [À COMPLÉTER]\n8. Contrôle : un tableau critère par critère, respecté oui / non\n9. Le contenu à optimiser, entre deux repères", "def:prompt-d-optimisation"], ["code", "Rôle : tu es rédacteur technique dans une équipe de maintenance télécom ferroviaire.\nCible : les agents de l'équipe de nuit, dont un agent avec un trouble dys (lecture lente).\nObjectif : qu'ils sachent, en 30 secondes de lecture, ce qui change pour leur prochaine intervention.\nContexte : le texte ci-dessous est un compte rendu interne rédigé à chaud. Il sera affiché au local d'équipe.\nCritères imposés :\n1. Ton direct, vouvoiement.\n2. 120 mots maximum.\n3. Liste numérotée d'actions, une action par ligne.\n4. Phrases de 15 mots au plus, aucun sigle non expliqué.\nFormat : titre court, puis la liste.\nContraintes : ne change aucun fait, aucune valeur, aucune date. N'ajoute rien. Si une information nécessaire manque, écris [À COMPLÉTER].\nContrôle : termine par un tableau « critère / respecté oui-non / commentaire ».\n<<<TEXTE\n[collez ici le texte, sans donnée réelle]\nTEXTE>>>"], ["h", "La règle des deux tours"], ["trajet", "", ["Tour 1 : vous corrigez le plus gros écart (souvent le contexte ou la cible).", "Tour 2 : vous ajustez la forme (format, longueur, ton).", "Toujours pas bon après deux tours ? Ne vous acharnez pas. Réécrivez le prompt initial dans une nouvelle conversation, changez d'outil, ou faites-le vous-même : la tâche est peut-être hors de la frontière de l'outil."]], ["def", "Variante", "Deuxième version produite pour comparer deux partis pris (plus court / plus détaillé, liste / paragraphe). Demander deux variantes d'un coup, puis choisir et justifier, est souvent plus rapide que deux itérations.", "« Propose deux versions : A en liste numérotée, B en paragraphe de 5 lignes. Indique pour chacune ce qu'elle sacrifie. »", "def:variante"], ["tip", "Une relance = un changement. Si vous demandez en même temps « plus court, plus formel, en tableau et en anglais », vous ne saurez pas quelle consigne a dégradé le résultat. Le prompt d'optimisation ci-dessus est l'exception : il applique d'un coup des critères imposés, puis vous contrôlez le résultat critère par critère."], ["tip", "Une longue conversation finit par mélanger les consignes. Quand la réponse dérive, ouvrez une nouvelle conversation avec un prompt initial réécrit qui intègre tout ce que vous avez appris."], ["warn", "Itérer améliore la forme. Cela ne vérifie pas les faits. Après chaque tour, contrôlez que l'IA n'a pas modifié une valeur ou ajouté une information en reformulant."], ["def", "RS7232", "Certification de CCI (chambre de commerce et d'industrie) France « Utiliser l'IA générative pour améliorer son efficacité professionnelle par un usage responsable » (active jusqu'au 18/07/2028).", "", "def:rs7232"], ["p", "Tracez vos itérations : prompt initial, relances, raison de chaque relance. C'est demandé par RS7232 (« itérations tracées ») et c'est ce qui alimente votre bibliothèque de prompts."], ["src", [["France Compétences, fiche RS6776", "https://www.francecompetences.fr/recherche/rs/6776"], ["France Compétences, fiche RS7232", "https://www.francecompetences.fr/recherche/rs/7232"], ["Microsoft, Get better Copilot responses with great prompting", "https://support.microsoft.com/en-us/microsoft-365-copilot/get-better-copilot-responses-with-great-prompting"], ["Google Prompting Essentials (Task, Context, References, Evaluate, Iterate)", "https://www.coursera.org/learn/google-prompting-essentials/paidmedia"], ["Axios, étude HBS/BCG sur la « frontière » de l'IA", "https://www.axios.com/2023/09/29/ai-mistakes-consulting-bcg-study"]]]], "formes": ["processus", "comparaison"]}, {"id": "l4", "title": "Faire travailler l'IA contre ses propres erreurs", "min": 13, "voie": "both", "blocks": [["def", "Grille FIABLE (rappel)", "Six points pour contrôler une réponse d'IA, vus dans la leçon « Analyser une réponse avec une grille ».", "F Faits · I Intégralité · A Adéquation · B Biais · L Logique · E Étayage", "def:grille-fiable-rappel"], ["p", "Quatre techniques mettent l'IA en position de relecteur. Elles ne remplacent pas votre vérification ; elles vous disent où regarder d'abord."], ["def", "Demande d'incertitudes", "Consigne qui autorise explicitement l'IA à dire « je ne sais pas » et lui demande de signaler ce dont elle n'est pas sûre. La documentation de Claude indique que cette permission peut réduire nettement les informations fausses.", "", "def:demande-d-incertitudes"], ["code", "Si tu n'es pas sûr d'une information, dis-le au lieu de deviner. À la fin, liste les affirmations de ta réponse que je dois vérifier en priorité, avec pour chacune ton niveau de confiance (élevé / moyen / faible) et la source primaire où la vérifier."], ["def", "Auto-évaluation", "L'IA relit sa propre réponse selon une grille que vous lui donnez, signale les points faibles et propose une version corrigée. Variante utile : lui faire retirer toute affirmation qu'elle ne peut pas appuyer sur une citation du document fourni.", "Grille fournie + « Évalue critère par critère, cite le passage concerné, puis propose la version corrigée »", "def:auto-evaluation"], ["code", "Relis ta réponse précédente comme un contrôleur qualité. Pour chaque critère, note conforme / non conforme et cite le passage :\n1. Chaque chiffre et chaque référence vient-il du document fourni ?\n2. Manque-t-il une étape de sécurité ou une réserve ?\n3. La réponse sert-elle l'objectif et la cible demandés ?\n4. Y a-t-il une formulation stéréotypée ?\n5. Les calculs sont-ils justes ? Refais-les en détaillant.\nPuis retire toute affirmation que tu ne peux pas appuyer sur une citation du document."], ["warn", "Une auto-critique n'est pas une preuve. Le même modèle a les mêmes angles morts : il peut « confirmer » une valeur fausse. Utilisez-la pour trouver des pistes, puis contre-vérifiez vous-même dans la source primaire."], ["def", "Comparaison de deux outils", "Soumettre la même demande, mot pour mot, à deux assistants différents (ou deux fois au même) et comparer. Là où les réponses divergent, il y a probablement une erreur. Là où elles concordent, ce n'est pas une preuve : elles peuvent reproduire la même erreur.", "", "def:comparaison-de-deux-outils"], ["def", "Reverse prompting (prompt inversé)", "Donner à l'IA un texte que vous jugez réussi et lui demander le prompt qui permettrait de le produire. Vous obtenez une structure réutilisable, que vous corrigez et rangez dans votre Kit. Le terme est un usage de praticiens, pas une méthode normalisée.", "Texte modèle + « Rédige le prompt (rôle, cible, objectif, contexte, format, contraintes) qui permettrait d'obtenir ce texte. Remplace les éléments propres à ce cas par des [VARIABLES]. »", "def:reverse-prompting"], ["code", "Voici un message que je trouve réussi. Rédige le prompt qui permettrait à un assistant d'écrire ce type de message. Structure-le en Rôle, Cible, Objectif, Contexte, Format, Contraintes, et conduite à tenir si une information manque. Remplace tout ce qui est propre à ce cas par des [VARIABLES].\n<<<\n[message modèle, sans donnée réelle]\n>>>"], ["h", "Quand utiliser quoi"], ["table", ["Technique", "Utile pour", "Limite"], [["Demande d'incertitudes", "Savoir quoi vérifier en premier", "L'IA peut être sûre d'elle et fausse"], ["Auto-évaluation", "Repérer omissions, écarts au format, calculs", "Mêmes angles morts que la réponse"], ["Régénérer ou comparer deux outils", "Détecter les chiffres et références fragiles", "La concordance ne prouve rien"], ["Reverse prompting", "Comprendre et réutiliser ce qui marche", "Le prompt obtenu doit être testé et corrigé"]]], ["trajet", "Combiner les techniques", ["Obtenir la réponse.", "Demander les incertitudes : ce que l'IA vous invite à vérifier.", "Vérifier vous-même les points signalés.", "Vérifier aussi les points critiques non signalés : chiffres, références, consignes de sécurité."]], ["tip", "Les recommandations d'Anthropic pour Claude vont dans le même sens : autoriser le « je ne sais pas », demander des citations exactes du document, faire retirer ce qui n'est pas appuyé, comparer plusieurs générations. Elles réduisent les hallucinations sans les supprimer."], ["src", [["Anthropic, Reduce hallucinations (documentation Claude)", "https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations"], ["Anthropic, cadre AI Fluency 4D (Dakan et Feller)", "https://www-cdn.anthropic.com/334975cdec18f744b4fa511dc8518bd8d119d29d.pdf"], ["Google Prompting Essentials (Task, Context, References, Evaluate, Iterate)", "https://www.coursera.org/learn/google-prompting-essentia
