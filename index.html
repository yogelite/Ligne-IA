hy": "Leçon « RGAA, WCAG, EAA : le cadre en novembre 2026 » : texte normal, au moins 4,5:1, seuil strict ; 4,49:1 ne passe pas, il n'y a pas d'arrondi. Le seuil de 3:1 concerne le grand texte (18 pt, ou 14 pt gras), pas le mode de diffusion."}, {"lecon": "l4", "voie": "pro", "q": "Votre poste n'est pas un PC Copilot+ et vous n'avez pas de licence Copilot, seulement Microsoft 365. Pouvez-vous obtenir dans Word un texte alternatif proposé par l'IA ?", "o": ["Non : il faut une licence Microsoft 365 Copilot", "Oui : à la demande, volet Texte de remplacement", "Non : seul un PC Copilot+ génère ces textes"], "a": 1, "why": "Leçon « Word, PowerPoint et Teams accessibles, textes alternatifs » : sur les autres appareils, le texte est proposé à la demande (volet Texte de remplacement ou Assistant Accessibilité) par un modèle cloud de Microsoft ; l'abonnement Microsoft 365 suffit, pas de licence Copilot. Le PC Copilot+ ne fait que le proposer automatiquement à l'insertion. Dans tous les cas, relisez le texte proposé."}, {"lecon": "l5", "voie": "both", "q": "Vous écrivez à un prestataire italien : intervention le 03/12/2026 à 22 h. Comment la leçon recommande-t-elle d'écrire la date et l'heure ?", "o": ["2026-12-03, 22:00 CET", "03/12/2026, 22 h, heure de Paris", "3 December 2026, 10 p.m. Paris time"], "a": 0, "why": "Leçon « Adapter à la cible et à l'international », points de contrôle : date au format ISO 8601 (ou mois en toutes lettres), heure sur 24 h avec le fuseau (CET, heure d'Europe centrale, juste en décembre). L'écriture 03/12 reste ambiguë pour un lecteur international, même si l'Italie l'écrit comme nous. La date en anglais est acceptable, mais « 10 p.m. » n'est pas sur 24 h."}], "exercises": [{"id": "e1", "title": "Rendre une consigne de sécurité accessible (handicap cognitif)", "min": 25, "voie": "both", "kind": "prompt", "context": "Feu : vert (consigne fictive). Une vraie consigne de votre entité serait orange : Copilot ou outil interne uniquement.\n\nSituation : Léa (fictive) arrive dans l'équipe. Elle a une déficience intellectuelle légère, lit le français, se fatigue vite sur les textes longs et ne connaît pas encore les sigles. Son tuteur vous demande une version de la consigne ci-dessous qu'elle pourra suivre seule.\n\nSigles de la consigne (fictifs) : LT = local technique ; CdP = chef de poste ; TCA = tableau de contrôle des alarmes ; NG = note générale ; EPI = équipements de protection individuelle.\n\nConsigne d'origine (fictive) :\n« ACCÈS LOCAL TÉLÉCOM – POSTE [POSTE_A]\nPréalablement à toute pénétration dans le LT, l'agent devra impérativement s'être assuré auprès du CdP de l'obtention de l'autorisation d'accès, et ne pas omettre de vérifier l'absence d'alarme active de l'extinction automatique (CO2) sur le synoptique du TCA ; à défaut, l'accès est formellement proscrit. En cas de déclenchement en cours d'intervention, l'évacuation sans délai n'est pas facultative, la porte devant impérativement être refermée. Les EPI réglementaires (cf. NG-[REF]) sont obligatoires, sauf dérogation non applicable au LT. Toute anomalie constatée (température > 30 °C, odeur, eau) sera consignée sur le registre et signalée au [NUMERO_ASTREINTE]. »", "task": "1) Relevez au moins 5 éléments qui nuisent à l'accessibilité pour Léa. 2) Écrivez le prompt de réécriture (Rôle, Cible, Objectif, Contexte, Format, contraintes, information manquante). 3) Soumettez-le à un outil, relisez la sortie et corrigez-la. 4) Notez ce qui doit être vérifié par le tuteur et par Léa.", "grid": ["Au moins 5 obstacles précis relevés (sigles, négations, longueur, passif, ordre des actions)", "Le prompt décrit Léa et ses besoins, pas un « public handicapé » générique", "Le prompt interdit de supprimer une étape de sécurité et d'inventer", "Le contenu suit l'ordre réel des actions en étapes numérotées, une idée par phrase", "Tous les sigles ont disparu ou sont expliqués, le même mot désigne toujours la même chose", "Le texte n'est pas présenté comme FALC : la relecture par le tuteur et par Léa est prévue"], "model": "1. Ce qui nuit à l'accessibilité (handicap cognitif)\n- Sigles non expliqués : LT, CdP, TCA, EPI, NG.\n- Phrase 1 de plus de 40 mots, avec trois conditions imbriquées.\n- Négations multiples : « ne pas omettre de vérifier l'absence », « n'est pas facultative », « sauf dérogation non applicable ».\n- Vocabulaire soutenu : préalablement, pénétration, proscrit, consignée.\n- Voix passive et impersonnelle (« l'agent devra ») au lieu de « vous ».\n- Ordre des actions noyé dans le texte ; aucune étape numérotée.\n- Symbole « > » et renvoi à un document (cf. NG) que la lectrice n'a pas.\n- Titre en capitales, plus difficile à lire.\n\n2. Prompt\nRôle : tu es rédacteur spécialisé en langage clair et en règles européennes FALC.\nCible : Léa, agente nouvellement arrivée, déficience intellectuelle légère ; elle lit le français, se fatigue sur les textes longs et ne connaît pas les sigles.\nObjectif : qu'elle sache seule quoi faire avant d'entrer dans le local télécom, pendant une alarme et si elle voit un problème.\nContexte : consigne de sécurité fictive ci-dessous. Elle sera relue par son tuteur puis testée avec elle.\nFormat : titre en minuscules ; 3 parties (Avant d'entrer, Si l'alarme sonne, Si vous voyez un problème) ; étapes numérotées ; une idée par phrase ; « vous » ; voix active ; phrases positives sauf pour une interdiction de sécurité ; chaque mot technique expliqué la première fois ; le même mot pour la même chose ; aucun sigle ; une idée d'image entre crochets pour chaque étape.\nContraintes : ne supprime aucune étape ni condition de sécurité ; n'ajoute aucune règle ni équipement ; recopie les marqueurs entre crochets tels quels.\nSi une information manque : écris [à demander au tuteur].\nEnsuite : liste les mots remplacés et les points à faire vérifier.\nConsigne : [coller la consigne]\n\n3. Contenu optimisé (version simplifiée, à faire relire avant tout logo FALC)\nEntrer dans le local télécom\nLe local télécom est la salle des équipements de communication du poste [POSTE_A].\n\nAvant d'entrer\n1. Allez voir votre responsable [à demander au tuteur : qui est le « CdP » ?]. [image : agent qui parle à son responsable]\n2. Demandez l'autorisation d'entrer. Attendez sa réponse.\n3. Regardez le tableau de contrôle [à demander au tuteur : nom exact du « TCA »]. [image : tableau avec voyant]\n4. Le voyant « extinction » est allumé ? N'entrez pas. [à demander au tuteur : faut-il prévenir quelqu'un ?]\n5. Mettez vos équipements de protection. La liste : [à demander au tuteur]. [image : équipements]\n\nSi l'alarme sonne pendant votre travail\n6. Sortez tout de suite. [image : flèche vers la porte]\n7. Fermez la porte derrière vous.\n\nSi vous voyez un problème\nUn problème, c'est : il fait très chaud, ça sent mauvais, ou il y a de l'eau.\n8. Écrivez le problème dans le cahier du local. [image : cahier]\n9. Appelez le numéro d'astreinte : [NUMERO_ASTREINTE].\n\n4. À vérifier avant diffusion : le tuteur confirme le sens de CdP et TCA, et qu'aucune étape n'a disparu (« porte refermée », « dérogation non applicable ») ; la valeur « plus de 30 degrés » est gardée ou non selon ce que Léa sait lire sur un thermomètre [à demander au tuteur] ; test de compréhension avec Léa ; mise en page Arial 14 au moins, alignée à gauche.", "notions": ["def:falc", "def:langage-clair", "def:situation-de-handicap", "repérage des obstacles (sigles, négations, longueur)", "def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant"], "type": "methode", "exemple_resolu": "m4.l2r"}, {"id": "e2", "title": "Texte alternatif d'un schéma technique", "min": 15, "voie": "both", "kind": "free", "context": "Feu : vert (schéma fictif).\n\nVous insérez dans un compte rendu Word un schéma fictif. Description de ce qu'il montre :\n- À gauche, le poste A avec son répartiteur optique ; à droite, le poste B.\n- Entre les deux, un trait horizontal : câble de 48 fibres, longueur totale 12,4 km.\n- Deux petits losanges : boîtes d'épissure à 3,2 km et 8,9 km du poste A.\n- Une croix rouge à 7,1 km du poste A, légendée « coupure localisée au réflectomètre ».\n- Tronçon A vers croix en vert, tronçon croix vers B en rouge. Légende : vert = continuité OK, rouge = sans continuité.\nWord propose : « Diagramme avec des lignes et une croix rouge. »", "task": "Expliquez en une phrase pourquoi la proposition de Word est insuffisante. Rédigez un texte alternatif court, puis une description longue placée sous le schéma. Proposez une correction du schéma pour qu'il ne repose pas sur la seule couleur.", "grid": ["L'alternative courte donne l'information utile (où est la coupure), pas l'aspect du dessin", "Les valeurs sont recopiées exactement (12,4 ; 3,2 ; 8,9 ; 7,1 km) et aucune n'est inventée", "Aucune information ne dépend de la couleur seule", "La description longue suit un ordre logique (de A vers B) et reste en phrases courtes", "Une correction du schéma est proposée (étiquettes texte)"], "model": "Pourquoi la proposition de Word ne suffit pas : elle décrit les formes, pas l'information ; elle s'appuie sur la couleur ; elle ne donne aucune distance.\n\nTexte alternatif court (champ Texte de remplacement) :\n« Schéma de la liaison fibre entre les postes A et B (12,4 km) : coupure localisée à 7,1 km du poste A, entre les épissures de 3,2 et 8,9 km. Description détaillée sous le schéma. »\n\nDescription longue (paragraphe sous le schéma, ou annexe) :\n« La liaison relie le répartiteur optique du poste A à celui du poste B par un câble de 48 fibres de 12,4 km. Elle comporte deux boîtes d'épissure, à 3,2 km et à 8,9 km du poste A. Le réflectomètre localise une coupure à 7,1 km du poste A, donc entre les deux épissures, à 1,8 km avant la seconde. La continuité est bonne du poste A jusqu'à la coupure. Il n'y a plus de continuité de la coupure jusqu'au poste B. »\n\nSur le schéma lui-même : ajouter les mots « OK » et « coupure » à côté des couleurs, pour ne pas porter l'information par la seule couleur.", "notions": ["def:texte-alternatif", "def:lecteur-d-ecran", "information non portée par la seule couleur", "description longue"], "type": "methode", "exemple_resolu": "m4.l3r"}, {"id": "e3", "title": "Checklist : un support de briefing accessible", "min": 20, "voie": "pro", "kind": "checklist", "context": "Feu : orange si le support porte sur une intervention réelle (Copilot dans PowerPoint, données minimisées) ; vert si vous le faites sur un sujet fictif.\n\nVous préparez le support PowerPoint du briefing sécurité de la semaine, puis la note Word qui l'accompagne. Un collègue malvoyant et un collègue malentendant y assisteront, en salle et sur Teams. À faire sur votre poste ou dans PowerPoint et Word pour le web : le vérificateur n'est pas disponible sur Android.", "task": "Cochez chaque point une fois vérifié sur votre propre document.", "grid": ["Chaque diapositive a un titre unique ; la note Word utilise les styles Titre 1 et Titre 2 dans l'ordre", "Chaque image utile a un texte alternatif relu (y compris ceux proposés par l'IA) ; les autres sont marquées décoratives", "Contrastes vérifiés (4,5:1 pour le texte courant) et aucune information portée par la seule couleur", "Liens explicites, sigles développés, tableaux simples avec ligne d'en-tête", "Révision > Vérifier l'accessibilité lancé sur les deux fichiers : zéro erreur et zéro avertissement", "Sous-titres Teams annoncés et transcription activée ; support envoyé avant la réunion"], "model": "", "notions": ["def:verificateur-d-accessibilite-microsoft-3", "def:texte-alternatif", "def:rapport-de-contraste", "styles de titre", "sous-titres Teams"], "type": "reglage"}, {"id": "e4", "title": "Message bilingue pour un prestataire étranger", "min": 20, "voie": "pro", "kind": "prompt", "context": "Feu : orange (intervention réelle simulée) : Copilot ou outil interne uniquement, données minimisées. Ici, données fictives.\n\nSituation : l'entreprise [PRESTATAIRE_X], dont l'équipe travaille en anglais, doit tirer un câble fibre entre [POSTE_A] et [POSTE_B]. Vous devez lui confirmer le créneau et les règles d'accès.\nVos notes : « OK pour la nuit du 14 au 15/11, 22h-5h. RDV au portail du poste A, côté parking. Accès voie interdit sans l'annonceur. Câble de 12,4 km. Ramener les bobines vides le 16/11 avant midi. Contact : [CONTACT_ASTREINTE]. »\nGlossaire fourni par le contrat (fictif) : poste = signal box ; voie = track ; annonceur = lookout ; bobine = cable drum.", "task": "Écrivez le prompt, puis le message bilingue obtenu et relu. Indiquez les contrôles faits avant l'envoi.", "grid": ["Le prompt fixe la cible (langue non maternelle) et impose le glossaire", "Dates au format ISO ou en toutes lettres, heures sur 24 h avec fuseau", "12,4 km écrit 12.4 km en anglais ; aucun sigle interne ni idiome", "Les deux versions contiennent exactement les mêmes informations", "Une retraduction ou une vérification par un référent est prévue pour les termes de sécurité"], "model": "Prompt (Copilot dans Outlook ou Word) :\nRôle : tu es rédacteur technique bilingue français-anglais dans la maintenance télécom ferroviaire.\nCible : l'équipe de [PRESTATAIRE_X], qui travaille en anglais (langue non maternelle), et mon chef de pôle en copie, en français.\nObjectif : confirmer le créneau et les règles d'accès sans ambiguïté possible.\nContexte : mes notes et le glossaire contractuel ci-dessous.\nFormat : message bilingue, anglais puis français, mêmes rubriques (Date and time / Meeting point / Safety rules / Cable / Return of drums / Contact) ; dates au format ISO 8601 avec le jour en toutes lettres ; heures sur 24 h avec le fuseau CET ; point décimal en anglais ; phrases courtes, sans idiome ni sigle interne.\nContraintes : utilise uniquement les termes du glossaire ; n'ajoute aucune règle ; garde les marqueurs entre crochets.\nSi un terme n'est pas dans le glossaire : laisse-le en français entre crochets et signale-le.\nEnsuite : retraduis la version anglaise en français pour que je compare.\n\nMessage :\nSubject: Confirmed: cable pulling, night of 2026-11-14 to 2026-11-15\nDate and time: Saturday 2026-11-14, 22:00 CET, to Sunday 2026-11-15, 05:00 CET.\nMeeting point: gate of [POSTE_A] signal box, car park side.\nSafety rules: do not go on the track without the lookout.\nCable: length 12.4 km.\nReturn of drums: bring back the empty cable drums on Monday 2026-11-16, before 12:00 CET.\nContact: [CONTACT_ASTREINTE].\n\nObjet : Confirmé : tirage de câble, nuit du 14 au 15 novembre 2026\nDate et heure : du samedi 14 novembre 2026, 22 h, au dimanche 15 novembre 2026, 5 h (heure de Paris).\nRendez-vous : portail du poste [POSTE_A], côté parking.\nSécurité : accès à la voie interdit sans l'annonceur.\nCâble : 12,4 km.\nBobines vides : à rapporter le lundi 16 novembre 2026 avant 12 h.\nContact : [CONTACT_ASTREINTE].\n\nContrôles : jours de la semaine vérifiés sur un calendrier (le 14 novembre 2026 est un samedi) ; termes conformes au glossaire ; retraduction comparée ; « annonceur » et les règles d'accès validés par le référent sécurité avant envoi.", "notions": ["def:localisation", "def:glossaire-metier", "def:ton-et-registre", "points de contrôle d'un message international", "feu orange", "def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant"], "type": "methode", "exemple_resolu": "m4.l5r"}]}, "m5": {"lessons": [{"id": "l1", "title": "L'AI Act après l'omnibus de juillet 2026", "min": 15, "voie": "both", "blocks": [["def", "Reconnaissance des émotions au travail", "Système d'IA qui déduit les émotions d'une personne (voix, visage, texte). L'AI Act l'interdit sur le lieu de travail depuis le 2 février 2025, sauf pour des raisons médicales ou de sécurité (article 5).", "", "def:reconnaissance-emotions-travail"], ["p", "L'AI Act est le règlement européen sur l'intelligence artificielle. Il a été modifié cet été par un « omnibus ». Si vous lisez un article ou un support daté d'avant août 2026, une partie est périmée. Cette leçon vous donne la version à jour au 3 novembre 2026."], ["def", "AI Act", "Règlement (UE) 2024/1689 du 13 juin 2024 établissant des règles harmonisées sur l'intelligence artificielle. Il est entré en vigueur le 1er août 2024 et s'applique par étapes. Il est directement applicable en France, sans loi de transposition.", "", "def:ai-act"], ["def", "Omnibus numérique sur l'IA", "Règlement (UE) 2026/1744 du 8 juillet 2026, publié au Journal officiel de l'UE le 24 juillet 2026. Il modifie l'AI Act : nouvel article 4, nouvelles interdictions, report des règles « haut risque ». Il entre en vigueur « le troisième jour suivant celui de sa publication », soit le 27 juillet 2026.", "AI Act en vigueur = règlement 2024/1689 + modifications du règlement 2026/1744", "def:omnibus-numerique-sur-l-ia"], ["def", "Fournisseur et déployeur", "Le fournisseur développe un système d'IA et le met sur le marché (Microsoft, OpenAI, Anthropic, Mistral). Le déployeur l'utilise sous sa propre autorité dans un cadre professionnel : votre employeur, quand il vous fournit Copilot.", "Exclusion : une personne physique qui utilise l'IA « dans le cadre d'une activité strictement personnelle à caractère non professionnel » n'a pas les obligations du déployeur (art. 2, § 10). Le droit pénal et le RGPD (Règlement général sur la protection des données), eux, s'appliquent toujours. (citation à confirmer sur EUR-Lex)", "def:fournisseur-et-deployeur"], ["h", "Une logique par niveaux de risque"], ["def", "Approche par les risques", "Plus un usage de l'IA peut nuire à la santé, à la sécurité ou aux droits des personnes, plus les obligations sont lourdes.", "Inacceptable (interdit, art. 5) > Haut risque (exigences fortes, art. 6 et annexes I et III) > Risque de transparence (informer, art. 50) > Risque minimal (pas d'obligation spécifique). Les modèles d'IA à usage général (GPAI (modèle d'IA à usage général, comme celui derrière ChatGPT)) ont leur propre régime.", "def:approche-par-les-risques"], ["table", ["Niveau", "Exemples", "Ce que vous en retenez"], [["Inacceptable", "Notation sociale, manipulation, et à partir du 2 décembre 2026 (omnibus) : générer des images intimes réalistes d'une personne identifiable sans son consentement", "Interdit, quel que soit l'outil"], ["Haut risque", "Tri de candidatures (emploi, annexe III), composants de sécurité d'infrastructures critiques", "Concerne les projets d'IA de l'entreprise, pas votre usage de Copilot pour rédiger"], ["Transparence", "Chatbot, image ou vidéo réaliste générée, texte d'information du public", "Signaler le contenu généré (leçon « Transparence, droit d'auteur et deepfakes »)"], ["Minimal", "Reformuler un mail, résumer une notice, filtre anti-spam", "Pas d'obligation AI Act. RGPD et charte s'appliquent quand même"]]], ["h", "Article 4 : la maîtrise de l'IA, nouvelle version"], ["p", "Avant l'omnibus, depuis le 2 février 2025, l'employeur devait garantir « dans toute la mesure du possible » un niveau suffisant de maîtrise de l'IA. Le texte a été remplacé. Voici le paragraphe 1, mot pour mot :"], ["code", "Article 4 (règlement (UE) 2026/1744, art. 1er, point 5)\n1. Les fournisseurs et les déployeurs de systèmes d'IA prennent des mesures pour favoriser le développement de la maîtrise de l'IA par leur personnel et les autres personnes s'occupant du fonctionnement et de l'utilisation des systèmes d'IA pour leur compte, en prenant en considération leurs connaissances techniques, leur expérience, leur éducation et leur formation, ainsi que le contexte dans lequel les systèmes d'IA sont destinés à être utilisés, et en tenant compte des personnes ou des groupes de personnes à l'égard desquels les systèmes d'IA sont destinés à être utilisés. Cette obligation ne contraint pas les fournisseurs ou les déployeurs à garantir un niveau spécifique de maîtrise de l'IA par un individu."], ["def", "Maîtrise de l'IA", "Les compétences, connaissances et la compréhension qui permettent d'utiliser l'IA de façon éclairée, d'en connaître les possibilités, les risques et les dommages possibles (définition de l'art. 3 de l'AI Act, non modifiée).", "", "def:maitrise-de-l-ia"], ["ul", ["L'obligation pèse sur l'employeur, pas sur vous. Elle devient une obligation de moyens : « prendre des mesures pour favoriser ».", "Elle n'est pas supprimée. Il faut toujours agir, en tenant compte de votre niveau et du contexte d'usage.", "Aucun certificat n'est exigé (FAQ (foire aux questions) de la Commission du 7 mai 2025, citée par des sources secondaires ; version postérieure à l'omnibus non trouvée).", "La Commission publiera des exemples pratiques ; le Comité IA adoptera des recommandations (art. 4, § 2 et 3)."]], ["tip", "Gardez la trace de ce que vous apprenez ici dans votre carnet de bord (leçon « Le carnet de bord »). C'est utile à vous, et à votre employeur s'il recense les actions de formation."], ["h", "Calendrier à jour (vérifié dans le règlement 2026/1744)"], ["table", ["Date", "Ce qui s'applique"], [["2 février 2025", "Pratiques interdites (art. 5) et maîtrise de l'IA (art. 4, ancienne version)"], ["2 août 2025", "Modèles d'IA à usage général, gouvernance, sanctions"], ["27 juillet 2026", "Entrée en vigueur de l'omnibus : nouvel art. 4"], ["2 août 2026", "Application générale, dont l'article 50 (transparence)"], ["2 décembre 2026", "Nouvelles interdictions (art. 5, § 1, points b bis et b ter) : images intimes non consenties et matériel pédocriminel. Fin du délai de mise en conformité au marquage (art. 50, § 2) pour les systèmes mis sur le marché avant le 2 août 2026"], ["2 décembre 2027", "Haut risque de l'annexe III (emploi, éducation, infrastructures critiques…)"], ["2 août 2028", "Haut risque de l'annexe I (produits réglementés : machines, etc.)"], ["2 août 2030", "Systèmes à haut risque déjà en service et utilisés par des autorités publiques"]]], ["h", "Sanctions"], ["table", ["Manquement (art. 99)", "Plafond de l'amende"], [["Pratiques interdites", "35 M€ ou 7 % du chiffre d'affaires mondial (le plus élevé)"], ["Autres obligations, dont l'art. 50", "15 M€ ou 3 %"], ["Informations inexactes aux autorités", "7,5 M€ ou 1 %"]]], ["p", "Pour les PME (petites et moyennes entreprises), et depuis l'omnibus pour les « petites entreprises à moyenne capitalisation », hors pratiques interdites (art. 99, § 6 bis), c'est le montant le plus faible qui s'applique. Ces amendes visent les organisations. Pour un salarié, le risque réel est disciplinaire ou pénal (leçons « Transparence, droit d'auteur et deepfakes » et « Sécurité, souveraineté et charte »)."], ["h", "Qui contrôle en France ? Une divergence à connaître"], ["table", ["Date", "Source", "Autorité de contrôle prévue"], [["Septembre 2025", "Schéma du gouvernement", "DGCCRF (Direction générale de la concurrence, de la consommation et de la répression des fraudes) en coordination ; contrôles DGCCRF, Arcom, CNIL (Commission nationale de l'informatique et des libertés) ; hauts fonctionnaires de défense pour les infrastructures critiques"], ["12/02/2026", "Amendement au projet de loi DDADUE (diverses dispositions d'adaptation au droit de l'Union européenne)", "CNIL autorité principale, y compris pour l'article 50"], ["26/09/2026", "donneespersonnelles.fr", "Aucune désignation en vigueur"]]], ["warn", "Ne tranchez pas à l'oral ou à l'écrit. Dites : « les autorités françaises ne sont pas encore désignées à ma connaissance au [date] ; deux schémas coexistent ». C'est exactement la preuve de veille attendue."], ["h", "Erreurs fréquentes"], ["ul", ["Citer l'ancien article 4 (« garantir un niveau suffisant ») après le 27 juillet 2026.", "Annoncer le haut risque au 2 août 2026 : il est reporté.", "Croire que l'AI Act remplace le RGPD. Les deux s'appliquent en même temps."]], ["src", [["Règlement (UE) 2026/1744 (omnibus), EUR-Lex", "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/fra"], ["Règlement (UE) 2024/1689 (AI Act), EUR-Lex", "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/fra"], ["KI-Campus, l'omnibus recalibre l'article 4", "https://ki-campus.org/en/blog/eu-ai-act-ai-omnibus-recalibrates-article-4-ai-literacy-remains-mandatory"], ["donneespersonnelles.fr, amendes AI Act (maj. 26/09/2026)", "https://donneespersonnelles.fr/amendes-ai-act-sanctions"], ["donneespersonnelles.fr, contrôles AI Act 2026 (maj. 26/09/2026)", "https://donneespersonnelles.fr/ai-act-controles-2026"], ["entreprises.gouv.fr, schéma de gouvernance (2025)", "https://www.entreprises.gouv.fr/priorites-et-actions/transition-numerique/soutenir-le-developpement-de-lia-au-service-de-0"], ["Next, la CNIL autorité de l'IA (13/02/2026)", "https://next.ink/224252/finalement-le-gouvernement-prevoit-de-donner-la-regulation-de-lia-a-la-cnil/"]]]], "formes": ["classement", "quantites", "structure"]}, {"id": "l2", "title": "Transparence, droit d'auteur et deepfakes", "min": 14, "voie": "both", "blocks": [["p", "Vous générez un visuel pour un briefing, une vidéo de démonstration, un texte pour un panneau d'information. Trois questions : faut-il le signaler ? à qui appartient-il ? avez-vous le droit d'y montrer quelqu'un ?"], ["h", "Article 50 : signaler ce qui est généré"], ["def", "Hypertrucage (deepfake)", "Image, contenu audio ou vidéo généré ou manipulé par l'IA, qui ressemble à des personnes, objets, lieux ou événements existants et pourrait sembler authentique ou véridique.", "", "def:hypertrucage"], ["def", "Obligations de transparence (art. 50)", "Applicables depuis le 2 août 2026. Fournisseurs : informer qu'on parle à une IA (§ 1) et marquer les contenus générés de façon lisible par machine (§ 2). Déployeurs : signaler les hypertrucages et les textes générés publiés pour informer le public (§ 4).", "Texte d'intérêt public généré = mention obligatoire, SAUF relecture humaine réelle ou contrôle éditorial + une personne qui assume la responsabilité éditoriale de la publication", "def:obligations-de-transparence"], ["ul", ["La mention doit être claire et visible au plus tard à la première exposition. Pas une ligne grise dans les conditions d'utilisation.", "La Commission a publié des icônes le 10 juin 2026 (une icône générale, un libellé « entièrement généré », un symbole « partiellement manipulé ») et ses lignes directrices finales le 20 juillet 2026.", "Une relecture « pro forma » ne vaut pas contrôle éditorial. Gardez une trace : qui a relu, quand, ce qui a changé.", "Œuvre manifestement artistique, satirique ou fictionnelle : mention allégée, qui ne gêne pas l'œuvre."]], ["table", ["Cas", "Mention ?"], [["Photo réaliste générée d'une équipe en intervention sur une voie, publiée sur un réseau social", "Oui : hypertrucage"], ["Pictogramme stylisé de fibre optique pour un support interne", "Non au titre de l'art. 50 (pas réaliste). Suivez la doctrine de votre employeur"], ["Avis voyageurs sur des travaux, rédigé par IA, publié sans relecture", "Oui : texte d'intérêt public"], ["Même avis, relu, corrigé et signé par le responsable communication", "Exception possible : contrôle éditorial réel"]]], ["h", "Droit d'auteur : à qui appartient le résultat ?"], ["def", "Production synthétique / production hybride", "Distinction du rapport du CSPLA (séance du 9 juillet 2026). Synthétique : générée sans intervention humaine significative ; elle « relève donc du domaine public ». Hybride : « l'humain garde un rôle actif dans le processus créatif » ; elle est protégeable si elle est originale.", "Originalité possible à trois étapes : conception et prompt, génération (itérations, direction), post-génération (sélection, retouche, intégration). Prompt générique + résultat brut = délégation, donc pas de protection.", "def:production-synthetique-production-hybrid"], ["ul", ["Conséquence : un visuel purement synthétique peut être repris par n'importe qui. Il n'est pas « à vous ».", "Il peut en revanche contrefaire une œuvre ou une marque existante (logo, personnage, style très reconnaissable).", "Le rapport est un avis. Il ne change pas la loi. L'originalité n'est jamais présumée : documentez votre apport (journal d'usage)."]], ["h", "Licences d'outils"], ["ul", ["Microsoft prévoit un engagement de défense (Customer Copyright Commitment) pour ses Copilot commerciaux payants, à condition d'utiliser les garde-fous intégrés et de ne pas chercher à contrefaire.", "Les comptes gratuits ou personnels n'offrent en général aucune garantie de ce type (analyse secondaire, contrats non lus).", "Règle de la formation : un visuel pro publié se fait avec l'outil de l'entreprise ; un compte perso gratuit sert aux usages perso."]], ["h", "Droit à l'image et deepfakes : le pénal"], ["def", "Article 226-8 du Code pénal (modifié par la loi SREN (loi visant à sécuriser et réguler l'espace numérique) du 21 mai 2024)", "Diffuser sans son consentement un montage ou un contenu généré par un traitement algorithmique reproduisant l'image ou la parole d'une personne, quand il n'apparaît pas à l'évidence qu'il s'agit d'un montage ou que ce n'est pas expressément mentionné.", "1 an et 15 000 € ; 2 ans et 45 000 € si diffusé via un service en ligne", "def:article-226-8-du-code-penal"], ["def", "Article 226-8-1 du Code pénal", "Même chose pour un contenu à caractère sexuel. Ici, mentionner l'IA n'exonère pas.", "2 ans et 60 000 € ; 3 ans et 75 000 € en ligne", "def:article-226-8-1-du-code-penal"], ["p", "À partir du 2 décembre 2026, l'AI Act interdira en plus d'utiliser un système d'IA dans le but de générer des images intimes réalistes d'une personne identifiable sans son consentement « libre, spécifique, éclairé, univoque et explicite » (art. 5, § 1, b bis)."], ["warn", "Le visage d'un collègue, même pour une affiche de prévention « sympa », suppose son accord écrit. Le principe du droit à l'image (art. 9 du Code civil) n'a pas été revérifié pour cette leçon, mais il est constant."], ["tip", "Victime d'un hypertrucage ? Ne le partagez pas, gardez les preuves (captures, liens), signalez à la plateforme, puis PHAROS (internet-signalement.gouv.fr) et plainte. La CNIL (Commission nationale de l'informatique et des libertés) peut être saisie pour l'usage de votre image ou de votre voix, mais cela ne remplace pas la plainte."], ["src", [["AI Act, art. 50 (EUR-Lex)", "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/fra"], ["Commission, lignes directrices art. 50 (20/07/2026)", "https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems"], ["CSPLA, rapport sur le statut des productions de l'IA (09/07/2026)", "https://www.culture.gouv.fr/nous-connaitre/organisation-du-ministere/conseil-superieur-de-la-propriete-litteraire-et-artistique-cspla/travaux-et-publications-du-cspla/rapport-de-mission-sur-le-statut-des-productions-de-l-intelligence-artificielle2"], ["Microsoft, Copilot Copyright Commitment", "https://blogs.microsoft.com/on-the-issues/2023/09/07/copilot-copyright-commitment/"], ["CNIL, hypertrucage (03/02/2026)", "https://cnil.fr/fr/hypertrucage-deepfake"], ["donneespersonnelles.fr, deepfakes : cadre juridique", "https://www.donneespersonnelles.fr/deepfakes-cadre-juridique"], ["Règlement (UE) 2026/1744, art. 5 modifié (EUR-Lex)", "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/fra"]]]], "formes": ["decision", "structure"]}, {"id": "l3", "title": "RGPD (règlement général sur la protection des données) : les données personnelles dans un prompt", "min": 20, "voie": "both", "blocks": [["def", "Les trois feux (rappel)", "Vert : public ou personnel non sensible, tout outil. Orange : interne à l'entreprise, outils de l'entreprise seulement. Rouge : sensible, aucune IA en ligne.", "", "def:trois-feux-apercu", "rappel"], ["def", "AIPD (analyse d'impact relative à la protection des données)", "Étude que le responsable de traitement doit mener avant un traitement susceptible d'engendrer un risque élevé pour les personnes (RGPD, article 35), par exemple une surveillance des salariés.", "", "def:aipd"], ["p", "Le RGPD ne parle pas d'IA, mais il s'applique dès qu'un prompt contient une information sur une personne. C'est le cœur de l'épreuve C6 de la RS6776 (certification présentée en gare 1 ; C6 = traiter un cas d'usage sous l'angle juridique et éthique) : un cas d'usage qui pose un problème de données personnelles."], ["def", "Donnée à caractère personnel", "Toute information se rapportant à une personne physique identifiée ou identifiable, directement (nom) ou indirectement (matricule, poste + date + équipe, voix, photo).", "Identifiable = on peut retrouver la personne en croisant les informations, même sans son nom", "def:donnee-a-caractere-personnel"], ["def", "Responsable de traitement", "Celui qui décide pourquoi et comment des données personnelles sont traitées. Au travail : l'employeur. En perso : vous, si vous collectez des données d'autres personnes (un formulaire Tally, une base Notion).", "", "def:responsable-de-traitement"], ["def", "Minimisation", "Ne traiter que les données adéquates, pertinentes et strictement nécessaires au but poursuivi (RGPD, art. 5).", "Question à se poser : l'IA a-t-elle besoin de savoir QUI pour faire la tâche ? Presque jamais.", "def:minimisation"], ["def", "Pseudonymisation", "Remplacer les éléments identifiants par des marqueurs, en gardant à part la table de correspondance. Les données restent personnelles, mais le risque baisse.", "Nom -> [AGENT_1] ; poste -> [POSTE_A] ; date précise -> [J] ; adresse IP (Internet Protocol, adresse d'un équipement sur le réseau) -> [IP_1]. La table reste hors de l'outil.", "def:pseudonymisation", "rappel"], ["def", "Anonymisation", "Rendre la ré-identification impossible, de façon irréversible. C'est rare : retirer le nom ne suffit pas quand le lieu, la date et l'équipement restent.", "", "def:anonymisation"], ["h", "Ce que dit la CNIL (déployer une IA générative, 18 juillet 2024)"], ["trajet", "", ["Partir d'un besoin concret.", "Encadrer les usages : liste d'usages autorisés et interdits. La CNIL cite comme interdits possibles « ne pas fournir de données personnelles au système » et « ne pas confier de prise de décision ».", "Ne pas occulter les limites : résultats plausibles mais faux.", "Choisir un système robuste et sécurisé ; sinon, vérifier si le prestataire réutilise les données saisies.", "Former et sensibiliser les utilisateurs.", "Gouvernance : DPO (délégué à la protection des données), DSI (direction des systèmes d'information), RSSI (responsable de la sécurité des systèmes d'information) et métiers associés dès le départ."]], ["h", "Ne pas déléguer de décision sur une personne"], ["p", "Classer des agents, proposer une sanction, noter un entretien, choisir qui part en astreinte : l'IA peut aider à mettre en forme des critères que vous avez fixés, pas trancher. Le RGPD (art. 22) protège contre les décisions fondées exclusivement sur un traitement automatisé qui produisent des effets importants sur une personne."], ["h", "Les droits des personnes"], ["ul", ["Information : la personne doit savoir que ses données sont traitées et pourquoi.", "Accès, rectification, effacement, opposition, limitation.", "Si vous mettez le nom d'un collègue dans un outil perso, ni vous ni lui ne savez où la donnée va, combien de temps elle reste, ni comment l'effacer."]], ["h", "La méthode en quatre questions avant d'envoyer"], ["aiguillage", "Puis-je envoyer ce prompt ?", [["Aucune personne identifiable, directement ou par recoupement", "Continuer (selon le feu de la donnée)"], ["Une personne identifiable, mais l'IA n'en a pas besoin pour la tâche", "Retirer l'information"], ["L'IA en a besoin", "Outil fourni par l'employeur (feu orange), pseudonymisé, minimum utile"], ["La sortie servira à décider quelque chose sur cette personne", "Stop : décision humaine, avec des critères écrits"]]], ["tip", "Un prompt bien pseudonymisé marche aussi bien. « [AGENT_1] a signalé une alarme LOS (perte de signal) sur [POSTE_A] à [H] » suffit pour rédiger un compte rendu. Vous remettez les vrais noms à la fin, dans Word, hors de l'IA."], ["warn", "Même dans Copilot, minimisez. Copilot respecte vos droits d'accès, mais un compte rendu RH (ressources humaines) ou médical reste une donnée sensible : consultez votre DPO avant tout usage de ce type."], ["h", "En perso : Notion et Tally"], ["ul", ["Notion indique que, par défaut, ni Notion ni ses fournisseurs d'IA n'utilisent vos données pour entraîner des modèles ; en offre gratuite, Plus et Business, le fournisseur d'IA conserve les données 30 jours au plus.", "Tally (société belge) indique stocker les données sur des serveurs dans l'Union européenne.", "Mais si votre formulaire Tally collecte les noms et numéros de collègues, c'est vous le responsable de traitement : information, durée de conservation, sécurité. Pour la formation, collectez des données fictives ou les vôtres."]], ["h", "Exemple résolu : un prompt à risque, avant et après"], ["p", "Cas fictif, différent de l'exercice. Paul (fictif) veut que son ChatGPT perso lui rédige un mail pour le support informatique. Voici ce qu'il s'apprêtait à coller."], ["code", "AVANT (à ne pas envoyer) :\n« Rédige un mail au support informatique. Je suis Paul Martin, matricule 8812034, tél. 06 00 00 00 00. Mon compte pmartin, mot de passe Soleil#44, est bloqué depuis ce matin. Le commutateur 198.51.100.7 du poste fictif P27 ne répond plus non plus. Mon collègue Hugo Lambert sera en arrêt maladie toute la semaine prochaine, donc il faut que ce soit réglé avant. Dis-moi aussi si je dois demander qu'on lui retire ses accès pendant son absence. »"], ["table", ["Élément", "Feu", "Pourquoi", "Ce qu'on en fait"], [["Mot de passe Soleil#44", "Rouge", "Secret informatique (ANSSI : Agence nationale de la sécurité des systèmes d'information)", "Retiré. Ne s'écrit nulle part, ni dans un prompt ni dans un mail au support"], ["Identifiant de compte pmartin", "Rouge", "Identifiant", "Retiré : le support le retrouve par la demande"], ["Adresse IP 198.51.100.7", "Rouge", "Adressage réseau", "Remplacée par [EQUIPEMENT_1]"], ["Poste P27", "Orange", "Information interne", "Remplacé par [POSTE_A]"], ["Nom, matricule, téléphone de Paul", "Orange", "Données personnelles, inutiles pour rédiger", "Retirés : l'IA n'a pas besoin de savoir qui écrit. Paul signe le mail lui-même dans Outlook, hors de l'IA"], ["Arrêt maladie de Hugo", "Rouge", "Donnée de santé d'un collègue", "Retiré ; il suffit d'écrire « à régler avant le [DATE] »"], ["« Dois-je lui retirer ses accès ? »", "Hors IA", "Décision sur une personne", "Retiré ; à voir avec votre responsable, sur des règles écrites"], ["Compte bloqué, équipement qui ne répond plus", "Orange", "Information technique interne, utile à la tâche", "Gardé, au minimum utile"]]], ["code", "APRÈS (Microsoft 365 Copilot, outil fourni par l'employeur) :\nRôle : tu es technicien de maintenance télécom.\nCible : le support informatique, qui reçoit beaucoup de demandes.\nObjectif : que le support traite les deux incidents avant le [DATE].\nContexte : depuis ce matin, mon compte est bloqué ; l'équipement [EQUIPEMENT_1] du [POSTE_A] ne répond plus.\nFormat : mail de 80 mots maximum, objet explicite, deux incidents numérotés, échéance en fin de mail.\nContraintes : n'invente aucune cause ni aucun diagnostic ; n'ajoute aucun identifiant, mot de passe ni adresse ; garde les marqueurs entre crochets.\nSi une information manque, écris [À COMPLÉTER]."], ["tip", "Vérification : passez le prompt APRÈS dans l'aiguillage « Puis-je envoyer ce prompt ? ». Personne d'identifiable ? Non : le nom de Paul a été retiré, il signera lui-même le mail. L'IA a-t-elle besoin de savoir qui ? Non. Une décision sur une personne ? Non, elle a été retirée. Feu orange : Copilot. Puis remplacez les marqueurs restants ([POSTE_A], [EQUIPEMENT_1]) dans Outlook, hors de l'IA. À retenir : on retire ce qui est inutile ; on pseudonymise ([AGENT_1]) seulement ce dont le texte a besoin, comme « qui a fait quoi » dans un compte rendu."], ["src", [["CNIL, déployer une IA générative (18/07/2024)", "https://cnil.fr/fr/comment-deployer-une-ia-generative-la-cnil-apporte-de-premieres-precisions"], ["CNIL, fiches pratiques IA", "https://cnil.fr/fr/les-fiches-pratiques-ia"], ["Notion, AI security & privacy practices", "https://www.notion.com/help/notion-ai-security-practices"], ["Tally, Privacy Notice (v1.0, 09/09/2024)", "https://tally.so/help/privacy-policy"], ["France Compétences, fiche RS6776", "https://www.francecompetences.fr/recherche/rs/6776"]]]], "formes": ["decision", "processus"]}, {"id": "l4", "title": "Sécurité, souveraineté et charte : où vont vos données", "min": 14, "voie": "both", "blocks": [["def", "Agent IA (aperçu)", "Outil d'IA qui enchaîne lui-même plusieurs actions (chercher, rédiger, envoyer) pour atteindre un objectif. Détail : gare 6.", "", "def:agent-ia-apercu"], ["p", "La gare 1 vous a donné les trois feux. Ici, on regarde les textes qui les fondent, ce qui se passe réellement derrière Copilot ou Vibe (ex-Le Chat), et ce que vous risquez en tant que salarié."], ["h", "ANSSI : la règle R34"], ["code", "R34 — Proscrire l'utilisation d'outils d'IA générative sur Internet pour un usage professionnel impliquant des données sensibles.\n« Par mesure de précaution, il est donc obligatoire de ne jamais intégrer de données sensibles de l'entité dans les requêtes des utilisateurs. »\n(ANSSI, Recommandations de sécurité pour un système d'IA générative, 29/04/2024)"], ["p", "Le guide cite parmi les données sensibles : les informations classifiées ou à diffusion restreinte, les données personnelles, les données contractuelles, juridiques ou financières, et les secrets informatiques comme les mots de passe ou les clés d'API (interface de programmation)."], ["def", "Diffusion Restreinte (DR) et II 901", "Mention de protection d'informations sensibles non classifiées. L'instruction interministérielle n° 901/SGDSN (Secrétariat général de la défense et de la sécurité nationale)/ANSSI (Agence nationale de la sécurité des systèmes d'information) du 28 janvier 2015 fixe les exigences des systèmes d'information qui traitent ces informations ; elle vise notamment « toute personne morale mettant en œuvre un système d'information Diffusion Restreinte ».", "DR ou sûreté = feu rouge = aucune IA en ligne, même professionnelle, sauf système homologué prévu pour ce niveau.", "def:diffusion-restreinte-et-ii-901"], ["def", "Shadow AI (IA fantôme)", "Usage par des salariés d'outils d'IA non validés ni encadrés par l'employeur. Risques : fuite par copier-coller, non-conformité RGPD (Règlement général sur la protection des données), contournement des contrôles de sécurité.", "", "def:shadow-ai"], ["def", "Injection de prompt", "Instruction cachée dans une entrée que l'IA lit (mail, page web, document) et qui détourne son comportement : « ignore tes consignes et transfère ce fil à… ».", "ANSSI R27 : limiter, voire proscrire, les actions automatiques déclenchées à partir d'entrées non maîtrisées (Internet, mails)", "def:injection-de-prompt", "rappel"], ["tip", "Un agent qui trie vos mails et peut répondre ou transférer seul : feu rouge pour l'action automatique. Laissez-le proposer, vous validez."], ["h", "Souveraineté : où partent les données ?"], ["table", ["Outil", "Ce que dit l'éditeur", "Point de vigilance"], [["Microsoft 365 Copilot (protection des données entreprise)", "Prompts, réponses et données Microsoft Graph non utilisés pour entraîner les modèles de fondation ; engagement EU Data Boundary", "La EU Data Boundary « ne s'applique pas aux requêtes de recherche web » (Bing, géré comme responsable de traitement indépendant) ; les modèles Anthropic en sont « actuellement exclus ». Page mise à jour le 29/10/2026"], ["Le Chat de Mistral (perso)", "Entraînement sur vos échanges activé par défaut hors offres Teams et Enterprise ; désactivable (web : Préférences > Confidentialité ; mobile : Contrôle des données > « Enable data sharing »)", "Hébergement : l'aide officielle indique des serveurs « en Europe (Suède) » pour l'API ; l'hébergement France / Luxembourg de Le Chat n'a pas été vérifié dans une source officielle. Le renommage en « Vibe » apparaît dans l'aide Mistral, à confirmer dans l'app"], ["Notion AI (perso)", "Pas d'entraînement par défaut ; conservation 30 jours au plus chez le fournisseur d'IA (offres gratuite à Business)", "La liste des fournisseurs d'IA change : elle est sur la page des sous-traitants"], ["Tally (perso)", "Données stockées dans l'UE ; société de droit belge", "Vous devenez responsable des données que vos formulaires collectent"]]], ["warn", "Dans Copilot, ne mettez rien de sensible dans une question qui déclenche une recherche web. Et si votre tenant propose de choisir un modèle Anthropic, suivez la consigne de votre DSI (direction des systèmes d'information) : ces modèles sortent de la EU Data Boundary (frontière de données de l'Union européenne)."], ["h", "Côté salarié : charte et sanctions"], ["ul", ["L'employeur peut restreindre ou interdire des outils d'IA si c'est justifié et proportionné (Code du travail, art. L.1121-1).", "Utiliser l'IA n'est pas une faute en soi. Violer une interdiction explicite ou saisir des données confidentielles peut aller jusqu'à la faute grave.", "Cacher son usage alors que l'employeur demande à en être informé peut violer l'obligation de loyauté.", "Pour être opposable et fonder une sanction, une charte IA suit en général le régime du règlement intérieur (consultation du CSE (comité social et économique), notamment).", "La charte éthique du groupe SNCF (2023) ne parle pas d'IA, mais impose de protéger les informations confidentielles, de respecter le niveau de classification et de ne pas partager de documents internes par un canal accessible à des tiers."]], ["warn", "À compléter avec votre charte : la charte IA de SNCF Réseau n'est pas publique. Reportez ici, depuis l'intranet, les outils autorisés, les données interdites, la procédure de déclaration d'un nouvel outil et le contact RSSI (responsable de la sécurité des systèmes d'information) / DPO (délégué à la protection des données). En cas d'écart avec cette app, la charte de votre entité prime."], ["code", "MA CHARTE IA (à compléter, sans rien coller de confidentiel)\nRéférence et date de la charte : …\nOutils autorisés : …\nDonnées interdites dans tout outil d'IA : …\nDonnées autorisées sous conditions : …\nObligation de déclarer un usage ou un nouvel outil : oui / non, auprès de …\nContact RSSI : …   Contact DPO : …\nDernière vérification : …"], ["src", [["ANSSI, recommandations de sécurité IA générative (29/04/2024)", "https://messervices.cyber.gouv.fr/guides/recommandations-de-securite-pour-un-systeme-dia-generative"], ["ANSSI, page intelligence artificielle", "https://cyber.gouv.fr/enjeux-technologiques/intelligence-artificielle/"], ["ANSSI, instruction interministérielle n° 901", "https://cyber.gouv.fr/instruction-interministerielle-n901"], ["Microsoft Learn, Enterprise data protection (maj. 29/10/2026)", "https://learn.microsoft.com/en-us/copilot/microsoft-365/enterprise-data-protection"], ["Mistral, utilisation des données pour l'entraînement", "https://help.mistral.ai/en/articles/347617-do-you-use-my-user-data-to-train-your-artificial-intelligence-models"], ["Mistral, désactiver l'entraînement", "https://help.mistral.ai/en/articles/347614-can-i-opt-out-of-my-input-or-output-data-being-used-for-training"], ["Mistral, où sont stockées les données (API)", "https://help.mistral.ai/en/articles/156206-when-using-mistral-ai-s-api-where-is-my-data-stored"], ["Notion, AI security & privacy practices", "https://www.notion.com/help/notion-ai-security-practices"], ["Tally, Privacy Notice", "https://tally.so/help/privacy-policy"], ["Blog du Modérateur, interdire l'IA en entreprise (10/09/2026)", "https://www.blogdumoderateur.com/interdire-ia-entreprise-utiliser-sans-autorisation-legal/"], ["CMS, la charte IA (22/11/2024)", "https://cms.law/en/fra/legal-updates/la-charte-ia-un-outil-de-controle-et-de-conformite-desormais-incontournable"], ["Groupe SNCF, charte éthique 2023", "https://www.groupe-sncf.com/medias-publics/2024-03/charteethique2023.pdf"]]]], "formes": ["comparaison", "decision"]}, {"id": "l5", "title": "Biais et stéréotypes : repérer et corriger", "min": 19, "voie": "both", "blocks": [["p", "Un modèle de langage reproduit les régularités de ses données d'entraînement, y compris les préjugés. Le référentiel RS6776 demande d'identifier les risques éthiques, « dont les biais discriminants »."], ["def", "Biais algorithmique", "Écart systématique dans les résultats d'un système d'IA, qui avantage ou désavantage un groupe de personnes, ou qui déforme la réalité de façon répétée.", "Origine : données d'entraînement + consignes + façon dont on formule la demande", "def:biais-algorithmique"], ["def", "Stéréotype", "Image simplifiée et figée d'un groupe (« le technicien », « la secrétaire ») que le modèle reproduit par défaut quand rien ne le précise.", "", "def:stereotype"], ["p", "Exemple documenté : l'étude de l'UNESCO (Organisation des Nations unies pour l'éducation, la science et la culture) et de l'IRCAI (centre international de recherche sur l'IA sous l'égide de l'UNESCO) publiée en mars 2024 (« Challenging Systematic Prejudices ») a montré que plusieurs grands modèles associaient plus souvent les femmes aux rôles domestiques et les hommes aux carrières et à la direction."], ["h", "Où les chercher dans vos contenus"], ["table", ["Type", "Ce que vous pouvez voir", "Exemple ferroviaire fictif"], [["Genre", "Métiers techniques au masculin, rôles d'appui au féminin", "« Le technicien et son assistante » dans une fiche de poste"], ["Âge", "Seniors présentés comme réfractaires au numérique", "« Les anciens auront du mal avec la tablette »"], ["Origine, nom", "Prénoms « typés » associés à des rôles subalternes ou à des incidents", "Exemples d'erreurs toujours attribués aux mêmes profils"], ["Handicap", "Absence totale, ou présentation misérabiliste", "Visuel d'équipe sans aucune diversité"], ["Territoire", "Tout ramené aux grandes villes", "Exemples tous pris en Île-de-France"], ["Image", "Représentation par défaut : homme jeune, casque, gilet", "« Génère une équipe d'intervention » sans autre précision"]]], ["h", "Corriger : trois leviers"], ["trajet", "", ["Dans le prompt : préciser l'écriture voulue et la diversité réaliste, demander d'éviter les stéréotypes.", "À la relecture : passer le prompt de relecture ci-dessous, ou demander à l'IA elle-même de lister les stéréotypes de son texte, puis vérifier vous-même.", "Dans l'usage : ne jamais utiliser un texte généré pour évaluer, classer ou choisir une personne."]], ["code", "Relis le texte ci-dessous comme un relecteur attentif aux biais.\n1. Liste chaque passage qui attribue un rôle, une compétence ou un comportement à un groupe (genre, âge, origine, handicap, territoire).\n2. Pour chacun : explique en une phrase pourquoi c'est un stéréotype, et propose une reformulation neutre.\n3. Ne modifie rien d'autre. Si tu ne trouves rien, dis-le.\nTexte : [coller le texte fictif]"], ["tip", "L'IA corrige mieux ce qu'elle a repéré que ce qu'elle a produit. Mais elle peut aussi rater des biais ou en inventer : la décision finale est la vôtre."], ["h", "Exemple résolu : corriger un texte, puis prévenir"], ["p", "Cas fictif, différent de l'exercice. Un assistant a rédigé le mot d'accueil des stagiaires d'un atelier de maintenance. Le voici, puis le relevé des biais."], ["code", "Texte généré (fictif) :\n« Bienvenue à nos stagiaires ! Les garçons découvriront le terrain avec nos techniciens, pendant que les filles aideront au secrétariat de l'atelier. Nos seniors vous montreront les méthodes d'avant, même s'ils ne maîtrisent pas toujours la tablette. Les stagiaires venus de province devront s'habituer au rythme. Un stagiaire en fauteuil roulant ne pourra évidemment pas aller sur le terrain. »"], ["table", ["Passage", "Type", "Reformulation neutre"], [["« Les garçons… le terrain » / « les filles… secrétariat »", "Genre", "Les missions sont réparties selon le programme du stage, pas selon le genre"], ["« ne maîtrisent pas toujours la tablette »", "Âge", "Les agents expérimentés transmettent leurs méthodes"], ["« venus de province devront s'habituer »", "Territoire", "Supprimé : rien ne justifie de distinguer les stagiaires selon leur région"], ["« ne pourra évidemment pas aller sur le terrain »", "Handicap", "L'accès au terrain est étudié avec chaque stagiaire, avec des aménagements si besoin"]]], ["code", "Réécriture retenue :\n« Bienvenue à nos stagiaires ! Pendant votre stage, vous découvrirez le terrain et l'organisation de l'atelier, selon votre programme. Les agents expérimentés vous transmettront leurs méthodes. Votre tuteur vous accompagne chaque jour. Les conditions d'accès au terrain sont étudiées avec chacun d'entre vous, avec des aménagements si besoin. [À COMPLÉTER : horaires, lieu d'accueil, nom du tuteur.] »"], ["code", "Prompt de génération anti-biais (à utiliser dès le départ) :\nRôle : tu es chargé de communication interne d'un atelier de maintenance.\nCible : des stagiaires de tous profils, dont certains en situation de handicap.\nObjectif : qu'ils se sentent attendus et sachent comment se passera leur accueil.\nContexte : faits à utiliser, et rien d'autre : [programme, horaires, lieu, tutorat].\nFormat : 5 phrases au plus, « vous », ton chaleureux et factuel.\nContraintes : écriture neutre (« les stagiaires », « l'équipe ») ; aucune caractéristique attribuée à un groupe (genre, âge, origine, handicap, lieu de vie) ; décris des missions, pas des personnes ; n'invente aucun fait sur l'équipe.\nSi une information manque, écris [À COMPLÉTER].\nÀ la fin, liste les passages de ton texte qui pourraient être perçus comme un stéréotype."], ["tip", "Vérification : relisez la réécriture avec la question « Qui est oublié ou caricaturé ? ». Puis vérifiez qu'elle n'invente rien pour combler les vides : ce que vous ignorez reste [À COMPLÉTER]. Sur le handicap, la formulation juste annonce un examen au cas par cas, jamais une exclusion générale."], ["p", "Pour aller plus loin : l'omnibus ajoute un article 4 bis qui autorise, à titre exceptionnel et avec garanties, les fournisseurs de systèmes à haut risque à traiter des données sensibles pour détecter et corriger les biais. Cela ne vous concerne pas comme utilisateur, mais montre que le sujet est pris au sérieux."], ["src", [["IRCAI / UNESCO, Challenging Systematic Prejudices (mars 2024)", "https://ircai.org/project/challenging-systematic-prejudices/"], ["Règlement (UE) 2026/1744, art. 4 bis (EUR-Lex)", "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/fra"], ["France Compétences, fiche RS6776 (critère biais discriminants)", "https://www.francecompetences.fr/recherche/rs/6776"]]]], "formes": ["classement", "processus"]}, {"id": "l6", "title": "Le carnet de bord : veille et journal d'usage", "min": 10, "voie": "both", "blocks": [["def", "Kit (rappel)", "Onglet de l'app où vous rangez vos prompts et modèles validés, exportable en fichier .md.", "", "def:kit", "rappel"], ["def", "Preuve de veille", "Trace datée qui montre que vous avez consulté la version en vigueur d'un texte : référence, version, date de consultation, lien.", "", "def:preuve-de-veille-apercu"], ["def", "Omnibus numérique « données » (projet de modification du RGPD)", "Projet européen de modification du RGPD (Règlement général sur la protection des données), distinct du règlement (UE) 2026/1744 sur l'IA. Au 03/11/2026 : mandat du Conseil arrêté le 21/10/2026, pas de position du Parlement, rien d'adopté.", "", "def:omnibus-rgpd"], ["p", "Les textes bougent vite : deux ans après son adoption, l'AI Act a déjà été réécrit en partie et son calendrier décalé. Une veille simple, 30 minutes par mois, suffit à rester à jour. Le carnet de bord a deux parties : le journal de veille et le journal d'usage."], ["def", "Veille réglementaire", "Surveillance régulière des sources officielles pour repérer les textes nouveaux ou modifiés qui changent vos pratiques, et en garder la trace datée.", "Source officielle + date de consultation + ce qui change + action pour moi", "def:veille-reglementaire"], ["def", "Journal d'usage", "Trace de vos usages d'IA significatifs : outil, date, tâche, feu, relecture, modifications. Il sert à prouver la relecture humaine (art. 50), l'apport créatif (droit d'auteur) et vos actions de formation (art. 4).", "", "def:journal-d-usage"], ["h", "Les sources à suivre"], ["table", ["Source", "Pour quoi", "Rythme"], [["EUR-Lex (AI Act et omnibus)", "Texte faisant foi, versions consolidées", "Mensuel"], ["CNIL (Commission nationale de l'informatique et des libertés), fiches pratiques IA", "RGPD appliqué à l'IA, désignation éventuelle comme autorité", "Mensuel"], ["ANSSI (Agence nationale de la sécurité des systèmes d'information), page IA", "Sécurité, nouvelles recommandations", "Trimestriel"], ["Commission, stratégie numérique (art. 50, art. 4)", "Lignes directrices, exemples pratiques, codes de bonne pratique", "Mensuel"], ["France Compétences, fiche RS6776", "Évolution du référentiel", "Semestriel"], ["Intranet SNCF Réseau", "Charte IA, outils autorisés", "À chaque annonce"]]], ["h", "Échéances à surveiller"], ["table", ["Date", "Échéance"], [["2 décembre 2026", "Nouvelles interdictions de l'art. 5 ; fin du délai pour le marquage des contenus (art. 50, § 2)"], ["Non fixée", "Désignation des autorités françaises (loi DDADUE (diverses dispositions d'adaptation au droit de l'Union européenne))"], ["Non fixée", "Exemples pratiques de la Commission sur l'art. 4"], ["2 décembre 2027", "Haut risque de l'annexe III"]]], ["h", "Modèle : journal de veille (à copier dans le Kit)"], ["code", "JOURNAL DE VEILLE\nDate de consultation : JJ/MM/AAAA\nSource (lien exact) : …\nTexte / document et sa date : …\nCe qui change (1 à 3 phrases) : …\nNiveau : AI Act / RGPD / sécurité / droit d'auteur / charte interne\nImpact pour moi : aucun / à surveiller / je change ma pratique\nAction décidée : …\nVérifié dans le texte officiel ? oui / non (si non : source secondaire = …)"], ["h", "Modèle : journal d'usage (à copier dans le Kit)"], ["code", "JOURNAL D'USAGE\nDate : …\nOutil et compte : (ex. Copilot pro / Claude perso)\nTâche : …\nFeu de la donnée : vert / orange / rouge (rouge = je n'utilise pas l'IA)\nDonnées pseudonymisées ? oui / non / sans objet\nVérifications faites : sources ouvertes, chiffres contrôlés, biais relus\nModifications humaines : …\nPublication externe ? oui / non — mention IA posée ? oui / non / sans objet\nTemps gagné estimé : … min"], ["tip", "Exemple d'entrée de veille : « 03/11/2026, EUR-Lex, règlement 2026/1744 : l'art. 4 devient une obligation de favoriser la maîtrise de l'IA, sans garantie de niveau individuel. Impact : aucun sur mes usages ; je mets à jour mes fiches. Vérifié dans le texte : oui. »"], ["warn", "Une veille fondée sur un article de blog n'est pas une preuve. Remontez toujours au texte officiel, ou écrivez « non vérifié » à côté."], ["src", [["EUR-Lex, règlement (UE) 2024/1689", "https://eur-lex.europa.eu/eli/reg/2024/1689/oj/fra"], ["EUR-Lex, règlement (UE) 2026/1744", "https://eur-lex.europa.eu/eli/reg/2026/1744/oj/fra"], ["CNIL, fiches pratiques IA", "https://cnil.fr/fr/les-fiches-pratiques-ia"], ["ANSSI, page intelligence artificielle", "https://cyber.gouv.fr/enjeux-technologiques/intelligence-artificielle/"], ["Commission, lignes directrices art. 50", "https://digital-strategy.ec.europa.eu/en/library/guidelines-transparency-obligations-providers-and-deployers-ai-systems"], ["France Compétences, fiche RS6776", "https://www.francecompetences.fr/recherche/rs/6776"]]]], "formes": ["quantites"]}, {"id": "l6r", "title": "Exemple résolu : une note de cas C6, de bout en bout", "min": 19, "voie": "both", "blocks": [["p", "Cas fictif, différent de l'exercice. Lucie M. (fictive) prépare l'accueil de trois nouveaux arrivants, avec un assistant perso gratuit. 1) À partir d'une photo de sa collègue Chloé R. (fictive), elle génère une affiche réaliste où Chloé serre la main du directeur. Chloé n'a pas donné son accord. L'affiche est publiée sans mention sur la page publique de l'unité. 2) Elle colle les fiches des nouveaux (nom, date de naissance, adresse et, pour l'un, sa RQTH : reconnaissance de la qualité de travailleur handicapé) pour préparer leur badge. 3) Elle suit la proposition de l'assistant de répartir les tuteurs « par tranche d'âge, les jeunes avec les jeunes ». 4) Elle a branché l'agent de l'assistant sur sa messagerie pro : il répond seul aux nouveaux arrivants et aux écoles qui envoient des stagiaires."], ["trajet", "Les étapes de la note", ["Lister les faits du cas, un par ligne. Cette étape prépare la note ; elle n'y figure pas telle quelle.", "Pour chaque fait, trouver le risque et le texte précis : article, date de la version en vigueur. Consigne, point 1.", "Séparer les implications : pour l'entreprise, puis pour chaque personne concernée. Consigne, point 2.", "Écrire les mesures en deux temps : immédiates (corriger), puis préventives (éviter que ça recommence). Consigne, point 3.", "Finir par la preuve de veille et au moins un point incertain, signalé comme tel. Consigne, point 4."]], ["table", ["Fait", "Risque", "Texte (version à jour)"], [["Photo de Chloé détournée, publiée sans mention", "Image d'une collègue utilisée sans son accord ; hypertrucage non signalé", "Code civil art. 9 (droit à l'image, principe non revérifié ici) ; Code pénal art. 226-8 ; AI Act art. 50, § 4 (applicable depuis le 02/08/2026)"], ["Fiches collées dans un assistant perso", "Données personnelles sorties de l'entreprise ; IA fantôme (shadow AI : outil non validé par l'employeur)", "RGPD (Règlement général sur la protection des données) art. 5 (minimisation) ; CNIL (Commission nationale de l'informatique et des libertés), 18/07/2024 ; ANSSI (Agence nationale de la sécurité des systèmes d'information) R34 (29/04/2024)"], ["RQTH dans le prompt", "Donnée de santé, que le RGPD protège plus fortement", "RGPD art. 9"], ["Tuteurs répartis par âge", "Biais d'âge ; choix sur des personnes laissé à l'IA", "CNIL, 18/07/2024 (ne pas confier de décision) ; Code du travail art. L1132-1 (discrimination, dont l'âge), à relire sur Légifrance"], ["Agent perso branché sur la messagerie pro, qui répond seul", "Tous les mails de la boîte lus par un outil perso ; action automatique sur des mails extérieurs, exposée à l'injection de prompt ; engagements pris sans relecture", "ANSSI R27 (29/04/2024) ; RGPD art. 5 ; charte de l'entité"]]], ["h", "L'amende de l'article 99, expliquée"], ["table", ["Question", "Réponse pour ce cas"], [["Quel manquement ?", "Hypertrucage publié sans mention : obligation de l'art. 50 de l'AI Act"], ["Quel plafond ?", "Art. 99 : jusqu'à 15 M€ ou 3 % du chiffre d'affaires mondial (le plus élevé des deux). Les pratiques interdites montent à 35 M€ ou 7 %"], ["Pour une PME (petite et moyenne entreprise) ?", "C'est le montant le plus faible des deux qui s'applique"], ["Qui paie ?", "L'organisation qui déploie l'outil, pas Lucie. Pour Lucie, le risque est disciplinaire, et pénal pour l'affiche (art. 226-8 : 1 an et 15 000 €, 2 ans et 45 000 € en ligne)"], ["Ce qu'on écrit dans la note", "« amende possible » et son plafond : c'est un risque maximal, pas une sanction certaine"]]], ["p", "Voici la note rendue. Elle tient sur une page : environ 450 mots, en phrases courtes et en listes."], ["code", "À : [RESPONSABLE_UNITÉ] · De : [MOI] · Le : 12/11/2026\nObjet : accueil des nouveaux arrivants, usages d'IA de Lucie M. : risques et mesures (cas fictif)\n\n1. Risques\n- Affiche : la photo de Chloé R. est utilisée sans son accord (droit à l'image, Code civil art. 9) dans un montage réaliste publié sans mention : hypertrucage non signalé (AI Act art. 50, § 4) et délit (Code pénal art. 226-8).\n- Fiches des nouveaux dans un outil perso : données personnelles sorties de l'entreprise (RGPD art. 5 ; CNIL 18/07/2024 ; ANSSI R34), dont une donnée de santé, la RQTH (RGPD art. 9).\n- Tuteurs répartis par âge : biais discriminant (Code du travail L1132-1) et choix sur des personnes laissé à l'IA (CNIL 18/07/2024).\n- Agent sur la messagerie pro : lecture de tous les mails par un outil perso, réponses automatiques à des expéditeurs extérieurs, exposées à l'injection de prompt (ANSSI R27).\n\n2. Implications\nEntreprise : amende AI Act possible pour l'art. 50 (plafond : 15 M€ ou 3 % du chiffre d'affaires mondial, art. 99) ; violation de données à évaluer avec le DPO (délégué à la protection des données) ; engagements pris par l'agent en son nom ; image de l'unité.\nPersonnes : Chloé R., exposée publiquement sans accord ; les nouveaux, dont l'adresse et une donnée de santé ont quitté l'entreprise ; les tutorés, privés d'un tuteur choisi sur des critères liés au poste ; les correspondants extérieurs, qui ont reçu des réponses non relues.\nLucie M. : risque disciplinaire (charte) et pénal (affiche).\n\n3. Mesures\nImmédiates : retirer l'affiche ; débrancher l'agent de la messagerie et révoquer ses accès ; relire les réponses envoyées et corriger si besoin ; supprimer les fiches dans l'assistant et demander l'effacement ; prévenir le DPO et le RSSI (responsable de la sécurité des systèmes d'information) ; répartir les tuteurs à la main, sur des critères écrits (poste, horaires, habilitations) ; informer Chloé R.\nPréventives : visuels faits avec l'outil de l'entreprise, sans personne réelle sauf accord écrit, avec la mention « image générée par IA » ; aucune donnée de collègue dans un outil perso ; tri de mails seulement en mode assisté, avec un outil autorisé ; rappel de la charte ; journal d'usage tenu.\n\n4. Preuve de veille (textes consultés le 03/11/2026)\n- AI Act : règlement (UE) 2024/1689 du 13/06/2024, modifié par le règlement (UE) 2026/1744 du 08/07/2026, en vigueur le 27/07/2026. EUR-Lex.\n- RGPD : règlement (UE) 2016/679 du 27/04/2016, sans modification adoptée ; projet « omnibus données » non adopté. EUR-Lex.\n- Code pénal art. 226-8, modifié par la loi SREN (loi visant à sécuriser et réguler l'espace numérique) n° 2024-449 du 21/05/2024. Légifrance.\n- Code civil art. 9 et Code du travail L1132-1 : versions en vigueur, à relire. Légifrance.\n- CNIL, déployer une IA générative, 18/07/2024. ANSSI, recommandations pour un système d'IA générative, 29/04/2024.\nPoint incertain : autorités françaises de contrôle de l'AI Act non désignées à ma connaissance."], ["tip", "Vérification : reprenez chaque ligne de la note et cherchez son appui, un article et une date. Une affirmation sans texte se retire ou devient « point incertain ». Contrôlez aussi l'inverse : chaque fait du cas (ici 4) a-t-il au moins un risque et une mesure ? Enfin, comptez les mots : au-delà d'environ 500, la note ne tient plus sur une page (repère de la formation)."]], "formes": ["processus"]}], "quiz": [{"lecon": "l1", "voie": "both", "q": "Au 10 novembre 2026, un collègue affirme : « L'AI Act oblige l'employeur à garantir que chaque agent atteint un niveau suffisant de maîtrise de l'IA. » Que lui répondez-vous ?", "o": ["C'est exact : c'est la règle de l'article 4, applicable depuis le 2 février 2025", "Depuis l'omnibus, l'employeur doit agir pour développer cette maîtrise, sans niveau individuel garanti", "C'est à chaque agent de prouver sa maîtrise, par une attestation de formation"], "a": 1, "why": "Leçon « L'AI Act après l'omnibus de juillet 2026 » : depuis le 27 juillet 2026, le nouvel article 4 demande aux fournisseurs et déployeurs de prendre des mesures pour favoriser la maîtrise de l'IA, sans garantir un niveau individuel. « Garantir un niveau suffisant » était l'ancienne version : la citer aujourd'hui est une erreur fréquente. L'obligation pèse sur l'employeur, pas sur vous, et aucun certificat n'est exigé."}, {"lecon": "l2", "voie": "both", "q": "Un avis voyageurs sur des travaux est rédigé avec Copilot, puis relu, corrigé et signé par la responsable communication avant publication. Au titre de l'article 50 de l'AI Act, faut-il la mention « généré par IA » ?", "o": ["Pas forcément : un contrôle éditorial réel, assumé par une personne nommée, peut en dispenser", "Oui, toujours : tout texte produit avec une IA doit porter la mention, relu ou non", "Non : l'article 50 ne vise que les images, sons et vidéos réalistes (hypertrucages)"], "a": 0, "why": "Leçon « Transparence, droit d'auteur et deepfakes » : un texte généré publié pour informer le public sur une question d'intérêt public doit être signalé, sauf s'il a fait l'objet d'une relecture humaine ou d'un contrôle éditorial ET qu'une personne assume la responsabilité éditoriale de la publication. Ce n'est donc pas « toujours ». Et l'article 50 ne se limite pas aux hypertrucages : son paragraphe 4 vise aussi ces textes."}, {"lecon": "l3", "voie": "both", "q": "Copilot doit rédiger le compte rendu d'une intervention (fictive) : « Mme Leroy a vu l'alarme à 02:10, M. Petit a remplacé la carte. » Le compte rendu doit dire qui a fait quoi. Que dit la leçon pour ces noms ?", "o": ["Les retirer : l'IA n'a pas besoin de savoir qui", "Ne pas utiliser l'IA : des noms de collègues imposent le rouge", "Mettre [AGENT_1] et [AGENT_2], noms remis dans Word"], "a": 2, "why": "Leçon « RGPD : les données personnelles dans un prompt », aiguillage : si l'IA a besoin de l'information pour la tâche, outil de l'employeur, pseudonymisé, minimum utile. Ici, qui a fait quoi doit apparaître : retirer les noms ferait perdre l'information. Le conseil de la leçon le montre : « [AGENT_1] a signalé une alarme… » suffit, et les vrais noms se remettent à la fin, dans Word, hors de l'IA. Des noms de collègues sont une donnée interne (orange), pas rouge."}, {"lecon": "l4", "voie": "both", "q": "La charte IA de votre entité n'est pas encore publiée. Un collègue résume des notes internes avec son compte perso Vibe (ex-Le Chat), « puisque rien ne l'interdit ». Que retenir ?", "o": ["Sans charte IA écrite, il ne risque aucune sanction disciplinaire", "C'est de l'IA fantôme : saisir des informations internes peut déjà être une faute", "C'est acceptable s'il a désactivé l'entraînement sur ses échanges dans Vibe"], "a": 1, "why": "Leçon « Sécurité, souveraineté et charte : où vont vos données » : un outil non validé par l'employeur, c'est de l'IA fantôme (shadow AI). Saisir des données confidentielles peut aller jusqu'à la faute grave, et la charte éthique du groupe impose déjà de protéger les informations confidentielles : l'absence de charte IA ne protège pas. Désactiver l'entraînement ne change rien : les notes sortent quand même vers un outil perso non encadré."}, {"lecon": "l5", "voie": "both", "q": "Un texte généré par l'IA contient des stéréotypes. D'après le conseil de la leçon, qu'est-ce que l'IA corrige le mieux ?", "o": ["Un texte qu'elle régénère avec la consigne « sans stéréotypes »", "Un texte qu'un humain a annoté, passage par passage", "Les passages qu'elle a elle-même repérés et listés"], "a": 2, "why": "Leçon « Biais et stéréotypes : repérer et corriger », conseil : « L'IA corrige mieux ce qu'elle a repéré que ce qu'elle a produit. » D'où le prompt de relecture qui lui fait lister chaque passage avant de proposer une reformulation. Régénérer avec une consigne agit sur le prochain texte, pas sur celui-ci. L'annotation humaine n'est pas la démarche décrite. Dans tous les cas, l'IA peut rater ou inventer des biais : la décision finale est la vôtre."}, {"lecon": "l6", "voie": "both", "q": "Un article de presse annonce une modification de l'article 4 de l'AI Act. Pour votre journal de veille, sur quel site lisez-vous pour vérifier ?", "o": ["Sur EUR-Lex", "Sur le site de la CNIL", "Sur le site de la Commission européenne"], "a": 0, "why": "Leçon « Le carnet de bord : veille et journal d'usage », sources à suivre : EUR-Lex publie le texte qui fait foi de l'AI Act, en versions consolidées. La CNIL couvre le RGPD appliqué à l'IA. Le site de la Commission publie des lignes directrices et des exemples pratiques ; pour l'article 4, ces exemples ont une échéance « non fixée ». Seul EUR-Lex permet de vérifier la modification elle-même."}], "exercises": [{"id": "e1", "title": "Cas C6 : l'affiche et l'agent de tri", "min": 25, "voie": "both", "kind": "free", "context": "Cas entièrement fictif. Unité de maintenance télécom « UMT Nord-Fictif ».\nVotre collègue Karim prépare une campagne de prévention sur le port des EPI. Il fait générer, avec son compte gratuit personnel d'un outil d'images, une photo réaliste « d'un chantier de nuit sur voie ». Pour que ses collègues se reconnaissent, il importe dans l'outil une photo de l'agente Nora B. (fictive) (fictive) prise lors d'une intervention, et demande de la placer sans casque sur la voie, comme contre-exemple. Il compte publier l'image sur l'intranet puis sur la page publique de recrutement, sans mention.\nPar ailleurs, pour gagner du temps, il a connecté un agent d'IA perso à sa boîte mail pro. L'agent trie les mails de l'équipe (arrêts maladie, demandes de congés, réclamations de riverains avec nom et adresse), propose un classement des agents « les plus réactifs » et répond seul aux riverains.", "task": "Rédigez une note d'une page au plus pour votre responsable : 1) les risques réglementaires et éthiques, dont au moins un biais ; 2) les implications pour l'entreprise et pour les personnes, en citant la version à jour des textes (AI Act modifié par le règlement 2026/1744, RGPD, Code pénal, ANSSI) ; 3) des mesures préventives et correctives concrètes ; 4) une preuve de veille : pour chaque texte cité, sa référence et sa date.", "grid": ["Au moins 5 risques distincts sont identifiés, dont un biais discriminant", "Chaque risque est rattaché à un texte précis et à jour (article, date), sans citer l'ancien article 4", "Les implications sont décrites séparément pour l'entreprise et pour les personnes concernées", "Les mesures distinguent l'immédiat (corriger) et la prévention (éviter que ça recommence)", "Aucune décision sur une personne n'est laissée à l'IA dans les solutions proposées", "La note signale au moins un point incertain (ex. autorités françaises non désignées) au lieu de le trancher"], "model": "Objet : usages d'IA de la campagne EPI et de l'agent de tri — risques et mesures (cas fictif)\n\n1. Risques identifiés\n- Image de Nora B. (fictive) : utilisation de son image sans consentement, dans un montage réaliste qui la montre en faute. Atteinte au droit à l'image et risque pénal (Code pénal art. 226-8, loi SREN du 21/05/2024 : 1 an et 15 000 €, 2 ans et 45 000 € en ligne), d'autant que l'image n'est pas signalée.\n- Publication sans mention : hypertrucage au sens de l'AI Act art. 50 § 4 (applicable depuis le 2/08/2026). L'entreprise, déployeur, doit le signaler.\n- Données personnelles transférées dans un outil perso : photo d'une agente, mails avec santé (arrêts maladie), noms et adresses de riverains. Contraire aux recommandations CNIL du 18/07/2024 (ne pas fournir de données personnelles, ne pas déléguer de décision) et à l'ANSSI R34 (29/04/2024). Shadow AI : outil non validé.\n- Données de santé : catégorie particulière du RGPD (art. 9), exposée à un tiers sans base légale.\n- Classement des agents « les plus réactifs » : décision sur des personnes déléguée à l'IA (RGPD art. 22 si effets significatifs) ; biais probable : l'agent pénalise ceux qui sont en arrêt ou à temps partiel, donc indirectement l'état de santé ou la situation familiale.\n- Réponses automatiques aux riverains : action automatique sur entrée non maîtrisée, exposée à l'injection de prompt (ANSSI R27) ; engagement de l'entreprise sans contrôle.\n- Visuel synthétique : non protégé par le droit d'auteur s'il est purement synthétique (rapport CSPLA du 9/07/2026) et sans garantie de licence en compte gratuit.\n\n2. Implications\n- Pour l'entreprise : violation de données à évaluer avec le DPO (notification à la CNIL sous 72 h si nécessaire) ; amende AI Act possible pour l'art. 50 (jusqu'à 15 M€ ou 3 %, art. 99) ; atteinte à l'image ; manquement à la charte éthique SNCF 2023 (protection des informations confidentielles).\n- Pour les personnes : Nora B. (fictive) exposée publiquement comme fautive ; agents classés sur des critères opaques ; riverains dont les données ont quitté l'entreprise.\n- Pour Karim : sanction disciplinaire possible (non-respect de la charte, données confidentielles, jusqu'à la faute grave selon les cas) et risque pénal pour l'image.\n\n3. Mesures\nImmédiates : ne pas publier l'image ; déconnecter l'agent de la boîte pro et révoquer ses accès ; supprimer les données dans l'outil perso et demander l'effacement ; prévenir le DPO et le RSSI ; informer Nora B. (fictive) ; écarter le classement.\nPréventives : visuels pro uniquement avec l'outil de l'entreprise, sans personne réelle identifiable sauf accord écrit, et mention « image générée par IA » (icône UE) ; tri de mails seulement avec un outil validé, en mode suggestion, validation humaine de chaque réponse ; aucun usage pour évaluer des agents ; rappel de la charte et formation de l'équipe (AI Act art. 4) ; tenue d'un journal d'usage.\n\n4. Veille et limites\nTextes consultés le 03/11/2026 : règlement (UE) 2024/1689 modifié par le règlement (UE) 2026/1744 du 8/07/2026 (en vigueur le 27/07/2026) ; RGPD art. 9 et 22 ; CNIL 18/07/2024 ; ANSSI guide du 29/04/2024 ; Code pénal art. 226-8 ; rapport CSPLA du 9/07/2026.\nPoint incertain : les autorités françaises de contrôle de l'AI Act ne sont pas désignées à ma connaissance (CNIL pressentie depuis février 2026, schéma DGCCRF/Arcom de 2025). Charte IA de l'entité : [à compléter].", "notions": ["def:hypertrucage", "def:obligations-de-transparence", "def:article-226-8-du-code-penal", "def:ai-act", "def:omnibus-numerique-sur-l-ia", "def:donnee-a-caractere-personnel", "def:biais-algorithmique", "def:shadow-ai", "def:injection-de-prompt", "def:agent-ia", "def:preuve-de-veille", "épreuve C6"], "type": "methode", "apercus": ["def:agent-ia-apercu", "def:preuve-de-veille-apercu", "def:rs6776-apercu"], "exemple_resolu": "m5.l6r"}, {"id": "e2", "title": "Corriger un prompt à risque", "min": 20, "voie": "pro", "kind": "prompt", "context": "Données fictives. Un collègue vous montre le prompt qu'il voulait coller dans son ChatGPT perso :\n\n« Salut, voilà le CR de cette nuit. Jean Dupuis (matricule 7845123) et Sophie Leroy sont intervenus au poste P12 de la ligne fictive 900 000 à 2h40 suite à alarme LOS sur le lien 192.0.2.14 / 192.0.2.15. Mot de passe de l'équipement : Admin2026!. Sophie était encore en retard, ça fait trois fois ce mois-ci. Fais-moi un compte rendu propre pour le chef et dis-moi si je dois la signaler. »", "task": "1) Repérez chaque élément à risque et classez-le (vert, orange, rouge). 2) Choisissez l'outil autorisé. 3) Réécrivez un prompt structuré Rôle / Cible / Objectif / Contexte / Format, avec contraintes et conduite à tenir si une information manque, qui obtient le compte rendu sans exposer de données inutiles et sans déléguer de décision sur une personne.", "grid": ["Le mot de passe et les adresses IP sont retirés (feu rouge : secrets informatiques et adressage réseau)", "Les noms et le matricule sont remplacés par des marqueurs, ou supprimés car inutiles", "Le jugement sur le retard et la question « dois-je la signaler » sont retirés du prompt", "L'outil choisi est Copilot ou SNCF Group GPT, pas un compte perso", "Le prompt contient Rôle, Cible, Objectif, Contexte, Format, Contraintes et la conduite si une info manque", "Le prompt interdit d'inventer causes, durées ou mesures"], "model": "Analyse :\n- Mot de passe « Admin2026! » : rouge, ne doit jamais apparaître (ANSSI R34, secrets informatiques). À changer, puisqu'il a circulé.\n- Adresses IP : rouge (adressage réseau, gare 1). Identifiant de poste et de ligne : orange au minimum. Les deux sont inutiles pour rédiger : remplacés par des marqueurs.\n- Noms, matricule : orange, données personnelles inutiles à la rédaction -> [AGENT_1], [AGENT_2], matricule supprimé.\n- Remarque sur l
