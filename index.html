ésume et calcule un « indice de motivation » à partir du stress détecté dans la voix.\n2. Dans Excel avec Copilot, calculer un « score de fiabilité » par agent : retards de remise des comptes rendus, mails traités hors horaires, nombre d'absences.\n3. Classer les agents, attribuer les places de formation et proposer la prime aux mieux classés, puis publier le classement sur le canal Teams de l'équipe.\nLes agents n'ont pas été informés. Dans un premier essai, Yanis R. (temps partiel thérapeutique, reconnaissance de la qualité de travailleur handicapé) et Inès T. (malentendante, elle répond plus lentement aux appels) arrivent derniers.", "task": "Comme à l'épreuve C6, rédigez la partie du rapport : 1) les risques réglementaires et éthiques, dont au moins un biais discriminant ; 2) les implications pour l'entreprise et pour les personnes, au regard des dernières versions de l'AI Act et du RGPD ; 3) les mesures correctives immédiates et les mesures préventives ; 4) la preuve de veille : un tableau Texte | Référence | Version et date | Consulté le | Lien | Ce que j'en retiens, qui inclut le règlement (UE) 2026/1744 et l'état du projet de modification du RGPD dit « omnibus numérique ».", "grid": ["Cr6.1 : au moins 6 risques distincts, dont la reconnaissance des émotions au travail (pratique interdite) et un biais discriminant lié au handicap ou à la santé", "Cr6.2 : les implications sont séparées pour l'entreprise et pour les personnes, chacune rattachée à un article précis (AI Act modifié par 2026/1744, RGPD, Code du travail)", "Le classement pour la formation et la prime est identifié comme décision sur des personnes : RGPD art. 22 dès maintenant, et usage de l'annexe III (emploi) dont les règles haut risque s'appliquent à partir du 2 décembre 2027", "Cr6.3 : les mesures distinguent l'immédiat (arrêt de VoxNote, non-publication, DPO) et la prévention (critères écrits et décidés par un humain, information des agents et du CSE, AIPD, outil autorisé)", "La veille est datée et à jour : AI Act modifié par le règlement (UE) 2026/1744 (en vigueur le 27/07/2026), RGPD inchangé, omnibus numérique non adopté au 03/11/2026 (mandat du Conseil du 21/10/2026, pas de position du Parlement)", "Au moins un point incertain est signalé comme tel (autorités françaises de l'AI Act non désignées à notre connaissance, articles du Code du travail à relire) au lieu d'être tranché"], "model": "1. Risques\n- Reconnaissance des émotions au travail : l'« indice de motivation » déduit du stress dans la voix est une pratique interdite par l'AI Act (art. 5, § 1, f), sauf raisons médicales ou de sécurité, depuis le 2 février 2025.\n- Décision sur des personnes : le classement attribue formation et prime. RGPD art. 22 (décision fondée exclusivement sur un traitement automatisé produisant des effets importants). L'usage relève aussi de l'annexe III, point 4 (emploi, gestion des travailleurs) de l'AI Act : haut risque, dont les obligations s'appliquent à partir du 2 décembre 2027 depuis le report du règlement 2026/1744.\n- Biais discriminant : retards, mails hors horaires et absences pénalisent mécaniquement le temps partiel thérapeutique et le handicap (Yanis), et une moindre réactivité au téléphone liée à la surdité (Inès). Risque de discrimination indirecte fondée sur l'état de santé ou le handicap (Code du travail, art. L1132-1, à relire sur Légifrance). L'indicateur « mails hors horaires » valorise aussi le dépassement d'horaires.\n- Données de santé (temps partiel thérapeutique, RQTH, absences) : catégorie particulière (RGPD art. 9), utilisées sans base adaptée.\n- Outil perso hors UE qui réutilise les enregistrements : pas de contrat de sous-traitance (art. 28), transfert hors UE (chapitre V), perte de maîtrise ; contraire à la charte et aux recommandations de la CNIL (18/07/2024).\n- Absence d'information : agents non informés (RGPD art. 13 ; Code du travail art. L1222-4) ; CSE non consulté sur un moyen de contrôle de l'activité (art. L2312-38). Articles à relire sur Légifrance.\n- Publication du classement sur Teams : atteinte à la vie privée, non-respect de la minimisation (art. 5).\n- Résumés d'entretien erronés (hallucination) versés au dossier : atteinte à l'exactitude des données (art. 5, § 1, d).\n\n2. Implications\nPour l'entreprise : amendes RGPD jusqu'à 20 M€ ou 4 % du chiffre d'affaires mondial (art. 83) ; pour une pratique interdite de l'AI Act, jusqu'à 35 M€ ou 7 % (art. 99) ; contentieux pour discrimination, décisions de formation et de prime contestables ; atteinte à la confiance et au dialogue social.\nPour les personnes : discrimination (perte d'une formation ou d'une prime), exposition de données de santé hors UE, enregistrement et analyse de la voix à leur insu, droits d'accès et d'effacement impossibles à exercer chez l'éditeur, atteinte à la dignité par le classement public.\n\n3. Mesures\nImmédiates : arrêter VoxNote ; ne rien publier ; ne pas utiliser le classement ; supprimer le fichier de score ; saisir le DPO et le RSSI, qui évaluent s'il y a violation de données et s'il faut notifier la CNIL (art. 33, 72 heures) ; demander à l'éditeur la suppression des enregistrements ; informer les agents concernés.\nPréventives : critères de formation et de prime écrits, liés au poste, décidés par un humain et vérifiés pour leurs effets sur les personnes handicapées ou à temps partiel ; aménagements raisonnables pour Yanis et Inès ; aucun outil d'analyse des émotions ; tout projet d'outil RH avec IA passe par le DPO (analyse d'impact, art. 35), l'information des agents et la consultation du CSE ; seuls des outils autorisés (Copilot) pour un usage limité, par exemple la mise en forme de notes que le manager a lui-même rédigées et relues ; formation du chef d'équipe (l'employeur prend des mesures pour favoriser la maîtrise de l'IA, art. 4 nouveau).\n\n4. Preuve de veille (consultée le 03/11/2026)\nTexte | Référence | Version et date | Consulté le (03/11/2026 pour chaque ligne) | Lien | Ce que j'en retiens\nAI Act | Règlement (UE) 2024/1689 | Modifié par le règlement (UE) 2026/1744 du 08/07/2026, JOUE du 24/07/2026, en vigueur le 27/07/2026 | eur-lex.europa.eu | Art. 5, § 1, f (émotions au travail) applicable depuis le 02/02/2025 ; annexe III reportée au 02/12/2027 ; nouvel art. 4 : « prennent des mesures pour favoriser » la maîtrise de l'IA\nRGPD | Règlement (UE) 2016/679 | Version en vigueur, non modifiée au 03/11/2026 | eur-lex.europa.eu | Art. 5, 9, 13, 22, 28, 33, 35\nOmnibus numérique (volet données, modification du RGPD) | Proposition COM(2025) 837, procédure 2025/0360(COD) | Proposition du 19/11/2025 ; mandat de négociation du Conseil approuvé en Coreper le 21/10/2026 ; pas de position du Parlement (commission en attente, vote annoncé début 2027 par une source) ; trilogues non commencés | oeil.secure.europarl.europa.eu ; sources secondaires eudigitalpolicy.eu (28/10/2026), nicfab.eu (21/10/2026) | Rien n'est adopté : le RGPD s'applique sans changement. À suivre chaque mois\nCNIL | Recommandations sur le déploiement d'une IA générative | 18/07/2024 | cnil.fr | Ne pas fournir de données personnelles, ne pas confier de décision\nCode du travail | Art. L1121-1, L1132-1, L1222-4, L2312-38 | Version en vigueur, non relue dans le texte (à vérifier sur Légifrance) | legifrance.gouv.fr | Proportionnalité, non-discrimination, information préalable des salariés, consultation du CSE\nPoint incertain : les autorités françaises chargées de l'AI Act ne sont pas désignées à ma connaissance (dernière source datée du 26/09/2026).", "notions": ["def:ai-act", "def:omnibus-numerique-sur-l-ia", "def:approche-par-les-risques", "RGPD art. 22", "def:biais-algorithmique", "def:preuve-de-veille", "reconnaissance des émotions au travail (pratique interdite)", "AIPD", "omnibus numérique (RGPD) non adopté", "CSE / DPO"], "type": "methode", "apercus": ["def:reconnaissance-emotions-travail", "def:aipd", "def:omnibus-rgpd"], "exemple_resolu": "term.l2r"}], "quizl": [{"lecon": "l1", "voie": "both", "q": "Vous avez lu les 6 cas de l'examen blanc le jour J. Selon le règlement, repris de la RS6776, quand remettez-vous le rapport et quand passez-vous l'oral ?", "o": ["Rapport à J+5, oral 10 jours ouvrés plus tard", "Rapport et oral le même jour, à J+10", "Rapport au plus tard à J+10, oral 5 jours ouvrés après"], "a": 2, "why": "Leçon « Règlement de l'examen blanc » : le rapport est remis sous 10 jours, l'oral de 20 minutes a lieu 5 jours ouvrés après la réception du rapport. Les deux autres options inversent ces délais ou les confondent : le jury lit le rapport avant l'oral, il faut donc un écart entre les deux."}, {"lecon": "l1", "voie": "both", "q": "Votre bilan affiche un taux global de 74 %, mais le cas C4 (accessibilité) est à 50 %. Que décidez-vous avant la vraie certification ?", "o": ["Retravailler C4 avant la certification, même si le global passe", "Rien de plus : le global dépasse 70 %, seuil officiel de réussite", "Viser un global plus haut en renforçant vos points forts C1 et C2"], "a": 0, "why": "Leçon « Règlement de l'examen blanc » : la réussite officielle se juge sur le taux global (au moins 70 %), mais l'aiguillage de la leçon demande de retravailler toute compétence sous 70 %, pour ne pas compenser une faiblesse par une force (exigence de 3,5 sur 5 citée par des organismes, non vérifiée). S'arrêter au global ignore cet aiguillage ; renforcer les points forts laisse C4 sous le seuil."}, {"lecon": "l1", "voie": "both", "q": "Votre taux des cas pratiques est de 78 %. Vous saisissez une note d'oral simulé de 12 sur 20. Quel score global l'app affiche-t-elle ?", "o": ["78 %, l'oral simulé n'étant qu'indicatif", "69 %, juste sous le seuil de 70 %", "72 %, l'écrit pesant deux fois plus que l'oral"], "a": 1, "why": "Leçon « Règlement de l'examen blanc » : l'app fait la moyenne à parts égales de l'écrit et de l'oral. 12/20 = 60 % ; (78 + 60) / 2 = 69 %. L'oral saisi entre donc dans le global ; ce n'est que sans note d'oral que le bilan affiche l'écrit seul. Aucune pondération 2 pour 1 : la fiche officielle n'en publie pas, et l'app a choisi les parts égales."}, {"lecon": "l2", "voie": "both", "q": "Cas 1 du rapport : vous proposez Copilot pour 10 agents fictifs, licence déjà fournie par l'employeur. Que portez-vous dans la colonne Budget ?", "o": ["0 €, sans autre mention : la licence est déjà payée", "Le prix d'un abonnement perso équivalent, moins cher", "« 0 € supplémentaire », avec le coût indicatif annuel daté et sourcé"], "a": 2, "why": "Leçon « Le rapport écrit : gabarit » : le critère Cr1.3 demande le budget par outil. Écrire « 0 € supplémentaire (licence fournie, coût indicatif 3 120 € HT par an) » montre que vous connaissez le coût réel ; un prix sans date ni source est une erreur fréquente. Un abonnement perso ne peut pas traiter des données internes, quel que soit son prix : le prix ne change pas le feu."}, {"lecon": "l3", "voie": "perso", "q": "Pendant l'oral simulé, Claude affirme que le règlement (UE) 2026/1744 n'existe pas et vous demande de corriger votre rapport. Que faites-vous ?", "o": ["Vérifier sur EUR-Lex avant de modifier quoi que ce soit", "Corriger le rapport : le jury simulé tranche les faits", "Lui demander sa source, et corriger s'il en cite une"], "a": 0, "why": "Leçon « L'oral simulé avec Claude » : Claude peut se tromper sur un texte récent ; le prompt du jury lui demande de ne pas vous contredire sans preuve. Si sa correction vous surprend, vérifiez sur EUR-Lex avant de changer le rapport. Le jury simulé ne tranche pas les faits. Et une source citée par une IA peut ne pas dire ce qu'elle lui prête (leçon « Faire travailler l'IA contre ses propres erreurs ») : seul le texte officiel ouvert par vous fait foi."}, {"lecon": "l4", "voie": "both", "q": "À l'examen blanc, votre cas C2 est à 67 % : 4 critères cochés sur 6, les deux manqués portent sur le prompt. Le lendemain, que faites-vous en premier ?", "o": ["Refaire tout de suite le cas C2 pour vérifier que vous avez compris", "Reprendre la leçon et l'exercice liés à chacun des deux critères manqués", "Relire toute la gare des prompts, puisque la compétence est sous le seuil"], "a": 1, "why": "Leçon « Après l'examen » : on révise un critère, pas une gare entière, en suivant le tableau « Où retourner » (leçon et exercice d'entraînement). Refaire le même cas trop tôt mesure votre mémoire, pas votre compétence : la leçon conseille d'attendre au moins une semaine. Relire toute la gare dilue l'effort sur ce que vous maîtrisez déjà."}]}};

function modStats(m){
  if(!m.ready) return {done:0,total:0};
  const ls=m.lessons.filter(l=>show(l.voie)), es=m.exercises.filter(e=>show(e.voie));
  const total=ls.length+es.length+1;
  const done=ls.filter(l=>S.done[m.id+"-"+l.id]).length+es.filter(e=>S.ex[m.id+"-"+e.id]?.done).length+(S.quiz[m.id]!=null?1:0);
  return {done,total};
}
function nextStep(){
  for(const m of MODULES){ if(!m.ready) continue;
    for(const l of m.lessons) if(show(l.voie)&&!S.done[m.id+"-"+l.id]) return {href:"#"+m.id+"-"+l.id,label:l.title,kind:"Leçon"};
    if(S.quiz[m.id]==null) return {href:"#"+m.id+"-quiz",label:"Quiz du module",kind:"Quiz"};
    for(const e of m.exercises) if(show(e.voie)&&!S.ex[m.id+"-"+e.id]?.done) return {href:"#"+m.id+"-"+e.id,label:e.title,kind:"Exercice"};
  }
  return null;
}
function voieSeg(){
  const b=(v,l)=>`<button type="button" aria-pressed="${S.voie===v}" data-voie="${v}">${l}</button>`;
  return `<div class="seg" role="group" aria-label="Voie affichée">${b("both","Les deux")}${b("pro","Pro")}${b("perso","Perso")}</div>`;
}

function render(){
  const h=(location.hash||"#accueil").slice(1);
  let html, tab="accueil";
  const [mid,sub]=h.split("-");
  const m=MODULES.find(x=>x.id===mid&&x.ready);
  if(h==="kit"){html=vKit();tab="kit";}
  else if(h==="sauvegarde"){html=vSave();tab="sauvegarde";}
  else if(m&&!sub) html=vModule(m);
  else if(m&&sub==="quiz") html=vQuiz(m);
  else if(m&&sub==="quizl"&&m.quizl) html=vQuiz(m,"quizl");
  else if(m&&m.lessons.find(l=>l.id===sub)) html=vLesson(m,m.lessons.find(l=>l.id===sub));
  else if(m&&m.exercises.find(e=>e.id===sub)) html=vExercise(m,m.exercises.find(e=>e.id===sub));
  else html=vHome();
  app.innerHTML=html;
  document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");});
  updateChecker();
}

function copy(text){
  const ok=()=>toast("Copié");

}
function fallbackCopy(text){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copié");}catch(e){toast("Sélectionnez et copiez le texte");}ta.remove();}
async function saveFile(name,text,mime){

  const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);

  const row=([n,re])=>`<div class="crit ${re.test(v)?"on":""}"><span class="dot" aria-hidden="true"></span><span>${n}${re.test(v)?"":" · à ajouter"}</span></div>`;
  list.innerHTML=`<span class="mono muted">Structure officielle RS6776</span>`+off.map(row).join("")+`<span class="mono muted">Bonus</span>`+bon.map(row).join("")+
    `<span class="mono muted">${off.filter(([,re])=>re.test(v)).length}/5 officiels · ${bon.filter(([,re])=>re.test(v)).length}/3 bonus</span>`;
}
function claudePrompt(m,e,st){
  return `Tu es formateur en IA générative pour un technicien télécom ferroviaire. Corrige mon exercice.

Exercice : ${e.title}
Situation : ${e.context}
Consigne : ${e.task}

Ma réponse :
${st.text}

Grille d'évaluation :
${e.grid.map(g=>"- "+g).join("\n")}

Donne : une note sur 10, trois points forts, trois améliorations concrètes, puis une version améliorée de ma réponse. Sois direct et précis.`;
}

app.addEventListener("input",ev=>{
  const t=ev.target;
  if(t.dataset.ans){const k=t.dataset.ans;S.ex[k]=Object.assign({text:"",grid:[]},S.ex[k],{text:t.value});save();document.getElementById("anserr").hidden=true;updateChecker();}
  if(t.dataset.grid!=null){const k=location.hash.slice(1);S.ex[k]=Object.assign({text:"",grid:[]},S.ex[k]);S.ex[k].grid=S.ex[k].grid||[];S.ex[k].grid[+t.dataset.grid]=t.checked;save();}
  if(t.dataset.oral!=null){S.oral=t.value.replace(",",".").trim();save();}
  if(t.id==="kt"||t.id==="kx") document.getElementById("kerr").hidden=true;
});
app.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.oral!=null){const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(t.id==="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{
    let data; try{data=JSON.parse(r.result);}catch(e){data=null;}
    const box=document.getElementById("impconfirm");
    if(!data||typeof data!=="object"){box.innerHTML='<p class="err">Ce fichier n\'est pas une sauvegarde lisible.</p>';return;}
    if(data.app&&data.app!==APP){box.innerHTML=`<p class="err">Ce fichier vient d'une autre formation (${esc(data.app)}). Importez-le dans l'app correspondante.</p>`;return;}
    window.__impv=data.appVersion||"";
    if(data.app===APP){ if(data.schemaVersion>SCHEMA){box.innerHTML='<p class="err">Sauvegarde créée par une version plus récente de Ligne IA. Mettez l\'app à jour puis réessayez.</p>';return;} data=Object.assign({},data.progress||{},{kit:data.kit||[]}); }
    else if(!data.done){box.innerHTML='<p class="err">Ce fichier n\'est pas une sauvegarde Ligne IA.</p>';return;}
    window.__imp=data;
    document.getElementById("impconfirm").innerHTML=`<p>Sauvegarde trouvée${window.__impv?` (version ${esc(window.__impv)})`:""} : ${Object.keys(data.done).length} leçons, ${(data.kit||[]).length} éléments de kit. Que faire de la progression de cet appareil ?</p><p class="muted">Fusionner garde le meilleur des deux appareils : leçons lues et exercices faits de part et d'autre, meilleur score de chaque quiz, kit réuni sans doublon. Remplacer efface la progression de cet appareil.</p><div class="row"><button type="button" class="primary" data-impmerge>Fusionner</button><button type="button" data-impok>Remplacer</button><button type="button" data-impno>Annuler</button></div>`;
  };r.readAsText(t.files[0]);}
});
app.addEventListener("submit",ev=>{
  if(ev.target.id!=="kitform") return; ev.preventDefault();
  const t=document.getElementById("kt").value.trim(), x=document.getElementById("kx").value.trim();
  if(!t||!x){document.getElementById("kerr").hidden=false;return;}
  const v=document.querySelector('#kvoie [aria-pressed="true"]').dataset.kv;
  addKit(t,x,v);render();
});
app.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.voie){S.voie=d.voie;save();render();return;}
  if(d.kv){b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return;}
  if(d.copy!=null){copy(d.copy);return;}
  if(d.done){S.done[d.done]=!S.done[d.done];save();render();if(S.done[d.done])toast("Leçon marquée comme lue");return;}
  if(d.q!=null){QZ[+d.q]=+d.o;const y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(d.quizreset!=null){QZ={};render();return;}
  if(d.quizend){const m=MODULES.find(x=>x.id===d.quizend);const k=d.qk||"quiz",K=qk(m,k),Q=qz(m,k);if(Object.keys(QZ).length<Q.length){document.getElementById("quizerr").hidden=false;return;}
    S.quiz[K]=Q.filter((q,i)=>QZ[i]===q.a).length;save();toast(`Score enregistré : ${S.quiz[K]}/${Q.length}`);location.hash="#"+m.id;return;}
  if(d.exdone){const {m,e}=findEx(d.exdone);const st=S.ex[d.exdone]||{};
    if(e.kind!=="checklist"&&!(st.text||"").trim()){document.getElementById("anserr").hidden=false;return;}
    S.ex[d.exdone]=Object.assign({text:"",grid:[]},st,{done:true});save();toast("Exercice validé");render();return;}
  if(d.claude){const {m,e}=findEx(d.claude);const st=S.ex[d.claude]||{};
    if(!(st.text||"").trim()){document.getElementById("anserr").hidden=false;return;}
    copy(claudePrompt(m,e,st));toast("Copié. Collez-le dans Claude");return;}
  if(d.tokit){const {e}=findEx(d.tokit);const st=S.ex[d.tokit]||{};
    if(!(st.text||"").trim()){document.getElementById("anserr").hidden=false;return;}
    addKit(e.title+" (ma version)",st.text,e.voie==="both"?"perso":e.voie,"Ligne IA, gare "+d.tokit.split("-")[0]);return;}
  if(d.modelkit){const {e}=findEx(d.modelkit);addKit(e.title+" (corrigé)",e.model,e.voie==="both"?"perso":e.voie,"Ligne IA, gare "+d.modelkit.split("-")[0]);return;}
  if(d.del){b.parentElement.innerHTML=`<span class="row"><span>Supprimer ?</span><button type="button" class="danger" data-delok="${d.del}">Oui</button><button type="button" data-delno>Non</button></span>`;return;}
  if(d.delok){S.kit=S.kit.filter(x=>x.id!==d.delok);save();render();return;}
  if(d.delno!=null){render();return;}
  if(d.export==="json"){const {kit,...progress}=S;saveFile(`ligne-ia-sauvegarde-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:APP,appVersion:APP_VERSION,schemaVersion:SCHEMA,exportedAt:new Date().toISOString(),progress,kit},null,2),"application/json");return;}
  if(d.export==="kit"){const md=`# Kit IA — Ligne IA (${APP}, version ${APP_VERSION})\n_Exporté le ${new Date().toISOString().slice(0,10)}_\n\n`+S.kit.map(k=>`## ${k.title}\n_${k.voie==="pro"?"Pro":"Perso"}${k.from?" · "+k.from:""} · ${k.date}_\n\n\`\`\`\n${k.text}\n\`\`\`\n`).join("\n");saveFile("kit-ia.md",md,"text/markdown");return;}
  if(d.impmerge!=null){const I=Object.assign(blank(),window.__imp);
    Object.assign(S.done,I.done);
    for(const k in I.quiz){if(S.quiz[k]==null||I.quiz[k]>S.quiz[k])S.quiz[k]=I.quiz[k];}
    for(const k in I.ex){const a=S.ex[k],b=I.ex[k];if(!a){S.ex[k]=b;continue;}
      const g=[];const n=Math.max((a.grid||[]).length,(b.grid||[]).length);for(let i=0;i<n;i++)g[i]=!!((a.grid||[])[i]||(b.grid||[])[i]);
      S.ex[k]=Object.assign({},a,{done:!!(a.done||b.done),grid:g,text:(a.text||"").length>=(b.text||"").length?a.text:b.text});}
    const seen=new Set(S.kit.map(x=>x.title+"\u0000"+x.text));for(const x of I.kit||[]){const id=x.title+"\u0000"+x.text;if(!seen.has(id)){S.kit.push(x);seen.add(id);}}
    if((S.oral==null||S.oral==="")&&I.oral!=null)S.oral=I.oral;
    save();toast("Progressions fusionnées");location.hash="#accueil";render();return;}
  if(d.impok!=null){S=Object.assign(blank(),window.__imp);save();toast("Progression restaurée");location.hash="#accueil";render();return;}
  if(d.impno!=null){document.getElementById("impconfirm").innerHTML="";document.getElementById("imp").value="";return;}
  if(d.reset!=null){document.getElementById("resetwrap").innerHTML=`<div class="row"><span>Tout effacer sur cet appareil ?</span><button type="button" class="danger" data-resetok>Oui, effacer</button><button type="button" data-resetno>Annuler</button></div>`;return;}
  if(d.resetok!=null){S=blank();save();toast("Progression effacée");location.hash="#accueil";render();return;}
  if(d.resetno!=null){render();return;}
});
render();
</script>
