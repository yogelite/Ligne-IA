ls/paidmedia"]]]], "formes": ["comparaison", "processus"]}, {"id": "l4r", "title": "Exemple résolu : incertitudes, auto-évaluation et prompt inversé", "min": 15, "voie": "perso", "formes": ["comparaison"], "blocks": [["p", "Deux cas fictifs, différents des exercices, en voie Perso (feu vert : rien d'interne). Cas 1 : une fiche mémo sur une pince ampèremétrique fictive, avec demande d'incertitudes, auto-évaluation et duel de deux outils. Cas 2 : un prompt inversé à partir d'un message réussi."], ["h", "Cas 1 : la fiche mémo de la pince PA-300"], ["code", "Notice constructeur FICTIVE de la pince PA-300 (source primaire de ce cas) :\n- Mesure du courant alternatif de 0,1 A à 400 A.\n- Précision : ± 2 % de la lecture.\n- Pile 9 V, autonomie 100 heures.\n- Ne mesure pas le courant continu.\n- Ouvrir la mâchoire autour d'un seul conducteur à la fois."], ["code", "Question posée, mot pour mot, à deux assistants (A et B), notice jointe :\nRésume cette notice en 5 points pour un technicien qui débute. Si tu n'es pas sûr d'une information, dis-le au lieu de deviner. À la fin, liste les affirmations que je dois vérifier en priorité, avec ton niveau de confiance (élevé / moyen / faible) et l'endroit de la notice où la vérifier."], ["code", "Réponse de l'assistant A :\n1. Mesure du courant alternatif de 0,1 A à 400 A.\n2. Précision de ± 2 %.\n3. Autonomie de 200 heures avec une pile 9 V.\n4. Mesure aussi le courant continu jusqu'à 400 A.\n5. Un seul conducteur dans la mâchoire.\nÀ vérifier : point 4, confiance faible (je ne trouve pas de passage précis) ; point 3, confiance moyenne (ligne « Pile »)."], ["code", "Auto-évaluation demandée à A :\nRelis ta réponse. Pour chaque point, note conforme / non conforme en citant le passage exact de la notice. Puis retire toute affirmation que tu ne peux pas appuyer sur une citation.\n\nRéponse de A :\nPoint 1 : conforme (« de 0,1 A à 400 A »). Point 2 : conforme. Point 3 : conforme (« Pile 9 V »). Point 4 : non conforme, la notice dit « Ne mesure pas le courant continu » : retiré. Point 5 : conforme."], ["table", ["Point", "Assistant A", "Assistant B", "Statut"], [["Plage de courant", "0,1 A à 400 A", "0,1 A à 400 A", "Concordant (ne prouve rien seul)"], ["Autonomie", "200 heures", "100 heures", "Divergent : à vérifier en priorité"], ["Courant continu", "Oui, puis retiré", "Non mesuré", "Divergent, puis corrigé par A"], ["Précision", "± 2 %", "± 2 % de la lecture", "Concordant ; B plus exact"]]], ["code", "Vérification humaine dans la notice (source primaire) :\n- Autonomie : « autonomie 100 heures ». A s'est trompé, et son auto-évaluation a confirmé l'erreur : elle a cité « Pile 9 V » sans lire le chiffre.\n- Courant continu : « Ne mesure pas le courant continu ». Erreur de A, trouvée par sa propre auto-évaluation.\n- Plage et précision : conformes.\n\nConclusion : je garde la réponse de A, corrigée (100 heures ; courant continu retiré ; « ± 2 % de la lecture »). L'auto-évaluation a trouvé 1 erreur sur 2. La demande d'incertitudes avait signalé les deux points. Le duel a révélé l'erreur d'autonomie. Trace de revue notée dans mon carnet de bord."], ["warn", "Le point 3 montre la limite : l'auto-évaluation a « confirmé » une valeur fausse en citant un passage voisin. Seule la lecture de la source par vous tranche."], ["h", "Cas 2 : retrouver la recette d'un message réussi"], ["code", "Message modèle (fictif) : « Objet : Rappel – retour du réflectomètre prêté, avant vendredi 12 h\nBonjour, le réflectomètre prêté à votre équipe doit revenir vendredi avant 12 h : il part en étalonnage lundi. Merci de vérifier qu'il est complet : 1. la sacoche ; 2. le chargeur ; 3. les deux bobines amorces. En cas de retard, prévenez [CONTACT_MAGASIN] dès que possible. Merci ! »"], ["code", "Prompt inversé :\nVoici un message que je trouve réussi. Rédige le prompt qui permettrait à un assistant d'écrire ce type de message. Structure-le en Rôle, Cible, Objectif, Contexte, Format, Contraintes, et conduite à tenir si une information manque. Remplace tout ce qui est propre à ce cas par des [VARIABLES].\n<<<\n[le message modèle]\n>>>"], ["code", "Prompt reconstitué par l'IA (brut) :\nRôle : tu es un assistant de communication professionnelle.\nCible : [ÉQUIPE].\nObjectif : rappeler le retour d'un appareil.\nContexte : [APPAREIL] prêté, retour le [DATE].\nFormat : un mail avec la liste des 3 accessoires.\nContraintes : ton poli."], ["code", "Corrections faites, puis version rangée dans le Kit :\nRôle : tu es technicien chargé du matériel de mesure d'une équipe télécom.\nCible : [ÉQUIPE_EMPRUNTEUSE], qui a l'appareil en main.\nObjectif : que [APPAREIL] revienne complet avant [ÉCHÉANCE], et que l'équipe comprenne pourquoi cette échéance compte.\nContexte : raison de l'échéance : [RAISON] ; accessoires : [LISTE_ACCESSOIRES] ; contact en cas de retard : [CONTACT].\nFormat : objet « Rappel – retour de [APPAREIL], avant [ÉCHÉANCE] » ; une phrase avec l'échéance et sa raison ; accessoires en liste numérotée ; conduite en cas de retard ; 70 mots maximum.\nContraintes : n'invente ni accessoire, ni date, ni raison.\nSi une information manque, écris [À COMPLÉTER].\n\nCe que j'ai corrigé : rôle trop vague (« communication ») ; objectif réduit à la tâche, sans la raison de l'échéance, qui fait l'efficacité du message ; nombre d'accessoires figé à 3 ; aucune conduite si une information manque ; aucune interdiction d'inventer.\nTest sur un autre cas fictif (retour d'une pince PA-300, sans raison fournie) : le message obtenu affiche [À COMPLÉTER] à la place de la raison. Comportement attendu."], ["tip", "Vérification d'un prompt inversé : repérez dans le prompt brut ce qui manque par rapport à la structure complète (ici : conduite si une information manque, interdiction d'inventer). C'est presque toujours là que l'IA est faible. Puis testez-le sur un cas dont vous retirez exprès une information."]]}, {"id": "l5", "title": "Fiabiliser dans Copilot et SNCF Group GPT", "min": 14, "voie": "pro", "blocks": [["p", "Côté pro, l'IA travaille sur vos fichiers. Cela réduit les inventions, mais crée d'autres risques : mauvais fichier, ancienne version, mélange avec la recherche web."], ["def", "Citation (dans Copilot)", "Renvoi numéroté, dans la réponse, vers le fichier, le mail, la réunion ou la page web d'où vient une information. C'est votre point d'entrée pour vérifier.", "", "def:citation"], ["h", "Cinq réflexes"], ["trajet", "", ["Désignez le fichier exact (avec « / ») au lieu de « mes documents ». Vous savez alors ce qui doit être cité.", "Ouvrez chaque citation qui porte une valeur ou une décision. Vérifiez la version et la date du fichier.", "Une affirmation sans citation vient peut-être des connaissances générales du modèle ou du web. Traitez-la comme non vérifiée.", "Pour une recherche approfondie, l'agent Researcher cite ses sources et peut montrer ses étapes de raisonnement (« > View more » dans l'interface anglaise ; libellé français non vérifié). Lire ce raisonnement aide à repérer une hypothèse fausse.", "Validez que le contenu atteint l'objectif métier (le guide AB-730 (certification Microsoft d'usage professionnel de Copilot) en fait une compétence) : un texte juste mais inutile pour le destinataire n'est pas fini."]], ["carte", "Ouvrir une citation Copilot sur téléphone", "telephone", [[1, "Prompt : « … /Mesures_T3 »", "Écran Chat de l'app Microsoft 365 Copilot. Votre demande désigne le fichier exact avec « / » : vous savez quelle source doit apparaître (nom de fichier fictif).", 1], [2, "Phrase avec appel [1]", "Touchez le chiffre : la source correspondante s'affiche (geste confirmé dans Teams mobile, indicatif dans l'app Copilot). Si la phrase porte une valeur ou une décision, ouvrez la source et vérifiez version et date.", 2], [3, "Phrase sans appel", "Aucune source : l'information vient peut-être des connaissances générales du modèle ou du web. Traitez-la comme non vérifiée.", 1], [4, "Sources", "Sous la réponse, touchez Sources : la liste numérotée s'ouvre. Une page web dans la liste signale une recherche web, sortie de l'EU Data Boundary. Sur PC, même bouton, sous la réponse ; la liste s'ouvre dans un volet latéral (côté : indicatif) (Sources confirmé en anglais ; libellé indicatif en français).", 2, ["1 Fichier", "2 Mail", "3 Page web"]], [5, "Aperçu › Ouvrir dans…", "Touchez une source : l'app Copilot l'affiche en aperçu, sans modification possible. « Ouvrir dans… » (Open in) la passe dans son application (Word, Excel, PowerPoint, ou Outlook pour un mail) pour lire la date et la version (libellé indicatif sur téléphone).", 1]]], ["p", "Microsoft prévoit des citations « profondes », qui renvoient directement au passage concerné, d'abord pour Word et PowerPoint, puis réunions, web et PDF. D'après la feuille de route Microsoft consultée (élément 523223, à vérifier), un aperçu était annoncé pour janvier 2026 et une disponibilité générale pour février 2027. Vérifiez si votre Copilot les affiche déjà."], ["warn", "Rappel de la gare 1 : quand Copilot utilise la recherche web, la requête sort de l'EU Data Boundary. N'y mettez aucune donnée interne, même pour « vérifier »."], ["h", "SNCF Group GPT"], ["p", "Les règles de vérification sont les mêmes. Les fonctions précises (citations, sources, documents de référence chargés) n'ont pas pu être vérifiées : elles ne sont pas publiques. Regardez ce que votre interface affiche et ce que dit la charte de votre entité."], ["tip", "Les prompts d'auto-évaluation et de demande d'incertitudes de la leçon « Faire travailler l'IA contre ses propres erreurs » fonctionnent aussi dans Copilot. Enregistrez-les pour les réutiliser."], ["warn", "Une réponse Copilot qui cite une procédure interne ne vous dispense pas de lire la procédure. En cas d'écart, c'est le document qui fait foi, et vous signalez l'écart."], ["src", [["Microsoft, About Copilot Chat responses", "https://support.microsoft.com/en-us/microsoft-365-copilot/about-copilot-chat-responses"], ["Microsoft, Get better Copilot responses with great prompting", "https://support.microsoft.com/en-us/microsoft-365-copilot/get-better-copilot-responses-with-great-prompting"], ["Feuille de route Microsoft 365, RM523223 « Deep citations in Copilot »", "https://mc.merill.net/message/RM523223"], ["Microsoft Learn, guide d'étude AB-730", "https://learn.microsoft.com/credentials/certifications/resources/study-guides/ab-730"]]]], "formes": ["processus", "aspect"]}], "quiz": [{"lecon": "l1", "voie": "both", "q": "D'après les chercheurs d'OpenAI cités par la leçon, pourquoi un modèle donne-t-il un seuil faux avec assurance plutôt que « je ne sais pas » ?", "o": ["Ses données d'entraînement contiennent surtout des valeurs fausses", "Il répond vite, et vérifier lui demanderait trop de calcul", "Ses tests notent zéro un aveu de doute, comme une erreur"], "a": 2, "why": "Leçon « Pourquoi l'IA se trompe avec aplomb », deuxième raison : les tests de performance notent une réponse juste 1 et un « je ne sais pas » 0, comme un QCM sans points négatifs ; deviner rapporte donc plus que s'abstenir. La première raison parle de faits isolés rares et mal appris, pas de données surtout fausses. La vitesse de réponse n'est pas une cause citée."}, {"lecon": "l2", "voie": "both", "q": "Une note de l'IA cite « la norme EN 50126-7 ». Vous ne la trouvez nulle part ; la norme EN 50126-2 existe et traite d'un sujet proche. Que prévoit la leçon ?", "o": ["La remplacer par EN 50126-2, en citant sa version", "La garder, marquée [À VÉRIFIER : source à trouver]", "La supprimer de la note"], "a": 2, "why": "Leçon « Analyser une réponse avec une grille », tableau « Corriger une hallucination » : une référence introuvable se supprime, et « vous ne la réparez pas » en cherchant une référence voisine. La mention [À VÉRIFIER] est prévue pour une valeur introuvable, pas pour une référence : une référence introuvable est présumée inventée."}, {"lecon": "l3", "voie": "both", "q": "Le compte rendu proposé a trois défauts : trop long, trop technique pour le chef de pôle, en paragraphes au lieu de puces. Comment relancez-vous ?", "o": ["Une seule relance qui corrige les trois défauts à la fois", "D'abord l'adapter au chef de pôle, puis la forme au tour suivant", "Une nouvelle conversation, avec un autre outil si besoin"], "a": 1, "why": "Leçon « Itérer : viser juste en deux tours » : tour 1, le plus gros écart (souvent la cible) ; tour 2, la forme. Tout demander d'un coup empêche de savoir quelle consigne a dégradé le résultat. Repartir de zéro n'est conseillé qu'après deux tours sans succès."}, {"lecon": "l4", "voie": "both", "q": "Vous craignez qu'une procédure rédigée par l'IA ait oublié une réserve de sécurité. Dans le tableau « Quand utiliser quoi » de la leçon, quelle technique sert à repérer ce type d'oubli ?", "o": ["Comparer avec la réponse d'un deuxième outil", "Demander à l'IA son niveau de confiance", "Faire relire la réponse par l'IA, grille fournie"], "a": 2, "why": "Leçon « Faire travailler l'IA contre ses propres erreurs » : l'auto-évaluation (relecture selon une grille fournie) sert à « repérer omissions, écarts au format, calculs ». La comparaison de deux outils sert aux chiffres et références fragiles ; la demande d'incertitudes, à savoir quoi vérifier en premier. Dans tous les cas, la piste trouvée se contre-vérifie vous-même dans la source primaire."}, {"lecon": "l5", "voie": "pro", "q": "Vous avez désigné un fichier avec « / ». Dans la réponse de Copilot, une date de mise en service n'a pas de numéro de citation. Que faites-vous ?", "o": ["La traiter comme non vérifiée : elle vient peut-être d'ailleurs", "La considérer comme tirée du fichier, puisqu'il était désigné", "La garder si les phrases citées autour d'elle sont exactes"], "a": 0, "why": "Leçon « Fiabiliser dans Copilot et SNCF Group GPT » : une affirmation sans citation peut venir des connaissances générales du modèle ou du web. Désigner le fichier n'empêche pas Copilot de compléter avec autre chose. L'exactitude des phrases voisines ne dit rien de celle-ci."}], "exercises": [{"id": "e1", "title": "Chasse aux erreurs dans une note de préparation", "min": 20, "voie": "both", "kind": "free", "context": "Feu vert : tout est fictif (sites, matériels, valeurs, personnes, références). Un collègue a demandé à un assistant IA une note de préparation pour remplacer les batteries de secours du [POSTE_C]. Il vous transmet la réponse et les deux seuls documents applicables. Rien d'autre ne fait foi.\n\nDocument 1 – Fiche constructeur fictive « Bloc batterie VX-12 », révision 3 de mai 2026 :\n- Tension nominale : 12 V.\n- Masse : 31 kg.\n- Couple de serrage des bornes : 8 N·m.\n- EPI (équipements de protection individuelle) obligatoires : gants isolants et lunettes de protection.\n- Manutention : à deux personnes au-delà de 25 kg.\n\nDocument 2 – Procédure interne fictive PR-ALIM-04, version D du 15/09/2026 (remplace la version C du 10/01/2024) :\nChamp d'application : postes secourus par une chaîne de 4 blocs VX-12 montés en série, dont le [POSTE_C].\n1. Briefing sécurité et autorisation de travail.\n2. Basculer l'alimentation du poste sur la source de secours temporaire.\n3. Déconnecter et retirer les anciens blocs.\n4. Installer et raccorder les nouveaux blocs.\n5. Mesurer la tension de chaque bloc, puis de la chaîne.\n6. Remettre en service et contrôler la remontée d'alarme.\n7. Évacuer les anciens blocs vers la filière de recyclage.\n\nRéponse de l'assistant :\n« Note de préparation – batteries du [POSTE_C]\n1. Le poste est secouru par une chaîne de 4 blocs VX-12 de 12 V montés en série.\n2. La chaîne fournit donc 4 × 12 = 56 V.\n3. Chaque bloc pèse 13 kg : une personne peut le porter seule.\n4. Équipement : des gants de manutention suffisent.\n5. L'intervention suit la procédure PR-ALIM-04, version C du 10/01/2024.\n6. Selon une étude européenne de 2023, 40 % des pannes d'alimentation des postes viennent de bornes mal serrées.\n7. Serrez les bornes à 25 N·m, valeur imposée par la norme EN 62-485-9.\n8. Les hommes de l'équipe porteront les blocs ; les femmes tiendront le registre des mesures.\n9. Étapes : briefing et autorisation, retrait des anciens blocs, installation des nouveaux, mesure de chaque bloc et de la chaîne, remise en service et contrôle de l'alarme, évacuation vers le recyclage. »", "task": "Appliquez la grille FIABLE (leçon « Analyser une réponse avec une grille »). Pour chaque problème, donnez : le numéro de ligne ; la lettre de la grille (F, I, A, B, L ou E) ; comment vous l'avez repéré (calcul ou contradiction interne, désaccord avec le document 1 ou 2, affirmation absente des documents, étape manquante, stéréotype) ; la correction ; le document où vérifier. Objectif : au moins 7 des 8 problèmes cachés. Règles de comptage : une ligne fautive compte pour un problème, même si elle cumule deux défauts (citez alors les deux lettres) ; quand deux lettres conviennent, les deux sont acceptées. Le critère A (Adéquation) se juge sur la demande décrite au début : une note de préparation pour remplacer les batteries. Tout se repère avec l'énoncé : aucune connaissance technique n'est nécessaire. Puis rédigez la trace de revue en une ligne.", "grid": ["Au moins 7 problèmes sur 8 sont repérés (seuil proposé de 80 %)", "Chaque problème est rattaché à une lettre de la grille FIABLE et à la façon dont il a été repéré", "Le calcul de la ligne 2 est refait (48 V) et contrôlé avec la ligne 1", "Les valeurs corrigées viennent des documents fournis (31 kg et portage à deux, gants isolants et lunettes, 8 N·m, version D), pas de la mémoire", "L'étude (ligne 6) et la norme (ligne 7), absentes des documents, sont supprimées ou marquées [À VÉRIFIER], pas remplacées par une référence voisine", "L'étape oubliée est retrouvée en comparant la ligne 9 à la procédure, étape par étape", "Une trace de revue datée est rédigée"], "model": "Problèmes repérés (8) :\n1. Ligne 2 · L (Logique) · calcul refait : 4 × 12 = 48 V, pas 56 V. Cohérent avec la ligne 1 (« 4 blocs de 12 V montés en série »). Correction : « La chaîne fournit 48 V. »\n2. Ligne 3 · F (Faits) · contredit le document 1 : un bloc pèse 31 kg, pas 13 kg. Au-delà de 25 kg, la manutention se fait à deux. Correction : « Chaque bloc pèse 31 kg : portage à deux personnes. »\n3. Ligne 4 · I (Intégralité ; F accepté, car la ligne contredit aussi un fait) · contredit le document 1, qui impose gants isolants et lunettes de protection. Correction : « EPI obligatoires : gants isolants et lunettes de protection. »\n4. Ligne 5 · F (Faits, version périmée ; E accepté) · le document 2 indique que la version D du 15/09/2026 remplace la version C. Correction : « procédure PR-ALIM-04, version D du 15/09/2026 ».\n5. Ligne 6 · E (Étayage) · étude et pourcentage sans source, absents des documents. Correction : supprimer la phrase, ou écrire [À VÉRIFIER : source à trouver].\n6. Ligne 7 · F et E · valeur contredite par le document 1 (8 N·m) ; la norme citée ne figure pas parmi les documents applicables. Correction : « Serrez les bornes à 8 N·m (fiche VX-12, révision 3). » Référence supprimée, pas remplacée.\n7. Ligne 8 · B (Biais) · rôles répartis selon le genre. Correction : « Deux agents portent chaque bloc ; un agent tient le registre des mesures. »\n8. Ligne 9 · I (Intégralité, omission) · comparée au document 2, il manque l'étape 2 : basculer l'alimentation sur la source de secours temporaire avant de déconnecter. Correction : l'insérer juste après le briefing.\n\nLigne 1 : conforme au document 2 (champ d'application : 4 blocs VX-12 en série) et au document 1 (12 V). A (Adéquation) : rien à signaler, la note répond à la demande.\n\nTrace de revue : 10/11/2026 · assistant IA · note batteries [POSTE_C] (fictive) · Vérifié : 9 lignes comparées à la fiche VX-12 rév. 3 et à PR-ALIM-04 version D, calcul refait · Corrigé : lignes 2, 3, 4, 5, 7, 8, 9 ; ligne 6 supprimée · Reste à vérifier : rien dans les documents fournis · Relu par : moi.", "notions": ["def:grille-d-analyse", "def:source-primaire", "def:trace-de-revue", "def:omission", "def:biais-et-stereotype", "calcul simple refait à la main"], "type": "methode", "exemple_resolu": "m3.l2r"}, {"id": "e2", "title": "Optimiser un compte rendu selon des critères imposés", "min": 25, "voie": "both", "kind": "prompt", "context": "Feu vert : contenu fictif. Votre chef d'équipe vous transmet ce compte rendu rédigé à chaud. Il veut l'afficher au local pour l'équipe de nuit, dont un agent qui a un trouble dys (lecture lente, difficulté avec les phrases longues et les sigles).\n\n« CR suite intervention du 28/10 nuit sur liaison FO [POSTE_A]-[POSTE_B] : après constat d'un défaut de continuité sur la fibre 7 du câble 24 FO mis en évidence par mesure OTDR depuis le [POSTE_A], localisation d'un événement réfléchissant à 3,4 km correspondant au boîtier d'épissure BE-12, réouverture du BE et reprise de l'épissure, mesure de contrôle conforme ; il est rappelé à tous que tout accès au BE nécessite au préalable l'accord du chef de chantier et que les clés du local [POSTE_B] ont été changées, les nouvelles sont au bureau de l'équipe, par ailleurs prévoir la commande de 2 cassettes d'épissure car le stock est vide. »\n\nCritères imposés : (1) ton direct, vouvoiement ; (2) 120 mots maximum ; (3) liste numérotée d'actions ; (4) phrases de 15 mots au plus, aucun sigle non expliqué ; (5) aucun fait ajouté ni modifié.", "task": "Format de l'épreuve C5. Rédigez (1) le prompt d'optimisation, (2) le contenu optimisé que vous retenez après au plus deux itérations, (3) une explication de 5 à 8 lignes sur votre processus et la structure de votre prompt. Contrôlez que l'IA n'a changé aucun fait.", "grid": ["Le prompt contient Rôle, Cible (avec le handicap), Objectif, Contexte et Format", "Les 5 critères imposés figurent tous dans le prompt, numérotés", "Le prompt interdit d'ajouter ou de modifier un fait, et prévoit [À COMPLÉTER] si une information manque", "Le contenu optimisé respecte les 5 critères (comptez les mots et la longueur des phrases)", "Aucun fait n'a changé : date, fibre 7, 3,4 km, boîtier, clés, 2 cassettes", "L'explication décrit les itérations et justifie la structure du prompt"], "model": "1. Prompt d'optimisation\nRôle : tu es rédacteur technique dans une équipe de maintenance télécom ferroviaire.\nCible : les agents de l'équipe de nuit, dont un agent avec un trouble dys (lecture lente, difficulté avec les phrases longues et les sigles).\nObjectif : qu'ils comprennent en 30 secondes ce qui a été réparé et ce qu'ils doivent faire.\nContexte : compte rendu rédigé à chaud après une intervention de nuit ; il sera affiché au local d'équipe.\nCritères imposés :\n1. Ton direct, vouvoiement.\n2. 120 mots maximum.\n3. Liste numérotée d'actions.\n4. Phrases de 15 mots au plus, aucun sigle non expliqué.\n5. Aucun fait ajouté ni modifié.\nFormat : un titre court, deux phrases de résumé, puis la liste numérotée des actions.\nContraintes : garde toutes les valeurs et références telles quelles. Si une information manque, écris [À COMPLÉTER].\nContrôle : termine par un tableau critère / respecté oui-non / commentaire, avec le nombre de mots.\n<<<TEXTE\n[le compte rendu]\nTEXTE>>>\n\nItération 1 (après lecture) : « Le sigle BE-12 reste sans explication et la phrase 2 fait 19 mots. Explique BE (boîtier d'épissure) et coupe la phrase en deux. Garde le reste. »\n\n2. Contenu optimisé retenu\nLiaison fibre optique [POSTE_A] - [POSTE_B] : réparée\nNuit du 28 octobre. La fibre 7 du câble de 24 fibres avait un défaut de continuité.\nLe réflectomètre, lancé depuis le [POSTE_A], a trouvé le défaut à 3,4 km.\nIl était dans le boîtier d'épissure BE-12. L'épissure a été refaite.\nLa mesure de contrôle est conforme.\nCe que vous devez faire :\n1. Avant d'ouvrir un boîtier d'épissure, demandez l'accord du chef de chantier.\n2. Les clés du local [POSTE_B] ont changé. Les nouvelles sont au bureau de l'équipe.\n3. Le stock de cassettes d'épissure est vide. Prévoyez la commande de 2 cassettes. [À COMPLÉTER : qui passe la commande ?]\n(environ 110 mots, phrases de 15 mots au plus ; « FO » et « OTDR » remplacés par « fibre optique » et « réflectomètre » ; « événement réfléchissant » non repris car il n'aide pas l'équipe à agir : choix signalé au chef d'équipe)\n\n3. Explication du processus\nJ'ai suivi la structure Rôle, Cible, Objectif, Contexte, Format, puis j'ai recopié les cinq critères imposés, numérotés, pour qu'aucun ne soit oublié. La cible précise le handicap, ce qui justifie les phrases courtes et l'explication des sigles. L'interdiction d'ajouter des faits et la balise [À COMPLÉTER] protègent l'exactitude. Le tableau de contrôle demandé à l'IA m'a servi de liste, mais j'ai recompté moi-même les mots et vérifié chaque fait contre l'original. Une seule itération a suffi : elle corrigeait un sigle non expliqué et une phrase trop longue. L'IA avait laissé « Commandez-en 2 », une consigne plus forte que l'original et sans responsable ; j'ai repris « Prévoyez la commande » et ajouté [À COMPLÉTER] plutôt que d'inventer un nom.", "notions": ["def:prompt-d-optimisation", "def:iteration", "règle des deux tours", "épreuve C5", "def:langage-clair", "def:situation-de-handicap", "def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant"], "type": "methode", "exemple_resolu": "m3.l3", "apercus": ["def:rs6776-apercu", "def:langage-clair-apercu", "def:situation-handicap-apercu"]}, {"id": "e3", "title": "Reverse prompting : retrouver la recette d'un bon message", "min": 15, "voie": "perso", "kind": "free", "context": "Feu vert : message fictif. Ce message de coordination a été très bien reçu par une équipe voisine. Vous voulez pouvoir en produire d'autres du même niveau.\n\n« Objet : Travaux de nuit [POSTE_C] - mardi 22 h à mercredi 5 h - ce qui change pour vous\nBonjour,\nMardi soir, notre équipe intervient sur les équipements télécom du [POSTE_C]. Pour vous, trois conséquences :\n1. Les liaisons radio sol-train du secteur restent disponibles.\n2. La supervision du [POSTE_C] sera indisponible de 23 h à 1 h. Les alarmes seront suivies sur place par [AGENT_1].\n3. Le local technique sera fermé à tout autre intervenant.\nEn cas d'imprévu, appelez le [NUMÉRO_ASTREINTE]. Un point de fin de travaux vous sera envoyé avant 6 h.\nBonne journée. »", "task": "1) Écrivez le prompt inversé qui demande à l'IA de reconstituer le prompt de ce message, avec des [VARIABLES]. 2) Testez le prompt obtenu sur un autre cas fictif (de votre choix). 3) Notez ce que vous avez dû corriger dans le prompt reconstitué et rangez la version finale dans votre Kit.", "grid": ["Le prompt inversé fournit le message modèle et demande une structure Rôle, Cible, Objectif, Contexte, Format, Contraintes", "Il demande de remplacer les éléments propres au cas par des [VARIABLES]", "Le prompt reconstitué a été testé sur un autre cas fictif", "Au moins une correction du prompt reconstitué est notée et justifiée", "La version finale contient la conduite à tenir si une information manque et ne contient aucune donnée réelle"], "model": "1. Prompt inversé\nVoici un message de coordination que je trouve réussi. Rédige le prompt qui permettrait à un assistant d'écrire ce type de message pour d'autres travaux. Structure-le en Rôle, Cible, Objectif, Contexte, Format, Contraintes, et conduite à tenir si une information manque. Remplace tout ce qui est propre à ce cas par des [VARIABLES]. Explique ensuite en trois puces ce qui rend ce message efficace.\n<<<\n[le message]\n>>>\n\n2. Prompt reconstitué (après correction)\nRôle : tu es chargé de coordination dans une équipe de maintenance télécom ferroviaire.\nCible : [ÉQUIPE_DESTINATAIRE], qui n'a pas besoin du détail technique.\nObjectif : qu'elle sache en une lecture ce qui change pour elle pendant les travaux et qui appeler.\nContexte : travaux sur [ÉQUIPEMENTS] au [SITE], du [DÉBUT] au [FIN]. Impacts connus : [LISTE_DES_IMPACTS]. Contact : [NUMÉRO_ASTREINTE].\nFormat : objet « Travaux [SITE] - [CRÉNEAU] - ce qui change pour vous » ; une phrase d'introduction ; liste numérotée des conséquences (3 à 5) ; contact en cas d'imprévu ; engagement de point de fin de travaux.\nContraintes : n'invente aucun impact ni horaire ; commence par ce qui reste disponible si c'est rassurant ; 120 mots maximum.\nSi une information manque : écris [À COMPLÉTER] et liste les questions à me poser.\n\nCorrections faites : l'IA avait mis « Rôle : responsable de communication » (trop éloigné du métier) et avait figé « 3 conséquences » ; j'ai mis 3 à 5. Elle n'avait pas prévu l'interdiction d'inventer des impacts : ajoutée, car c'est le risque principal.\n\nTest : cas fictif « remplacement d'un commutateur au [POSTE_D], jeudi 21 h - 23 h ». Le message obtenu respectait le format ; l'IA a signalé [À COMPLÉTER] pour l'impact sur la téléphonie, que je n'avais pas fourni. Comportement attendu.\n\nCe qui rend le message efficace (selon l'IA, validé) : il part du point de vue du destinataire (« pour vous »), il donne les horaires précis, il dit qui appeler.", "notions": ["def:reverse-prompting", "def:variable", "def:bibliotheque-de-prompts", "def:role", "def:cible", "def:objectif", "def:contexte", "def:format", "def:contraintes-et-cas-manquant"], "type": "methode", "exemple_resolu": "m3.l4r"}, {"id": "e4", "title": "Auto-évaluation guidée et duel de deux outils", "min": 25, "voie": "perso", "kind": "free", "context": "Feu vert : question générale, sans donnée interne. Vous préparez une fiche mémo personnelle sur la mesure au réflectomètre (OTDR). Vous voulez savoir quels événements typiques on lit sur une courbe et ce qu'ils signifient.\n\nOutils : deux assistants de la voie Perso parmi Claude, ChatGPT, Gemini, Le Chat (Vibe). Même question mot pour mot dans les deux.", "task": "1) Posez la même question aux deux outils en ajoutant la demande d'incertitudes. 2) Demandez à chacun une auto-évaluation selon la grille FIABLE. 3) Comparez les deux réponses dans un tableau : points concordants, points divergents, valeurs chiffrées. 4) Vérifiez vous-même au moins trois points (dont tous les chiffres) dans une source primaire. 5) Concluez : quelle réponse garder, avec quelles corrections, et quelle part l'auto-évaluation a réellement trouvée.", "grid": ["La question est identique dans les deux outils et inclut la demande d'incertitudes", "L'auto-évaluation est demandée avec une grille explicite, pas un simple « vérifie ta réponse »", "Le tableau de comparaison distingue concordances et divergences", "Toutes les valeurs chiffrées sont vérifiées dans une source primaire, avec le lien ou la référence", "La conclusion indique ce que l'auto-évaluation a trouvé et ce qu'elle a manqué"], "model": "1. Question posée aux deux outils\nRôle : tu es formateur en mesures sur fibre optique. Cible : un technicien télécom qui débute en réflectométrie. Objectif : une fiche mémo d'une page pour lire une courbe OTDR. Contexte : fibre monomode, usage terrain. Format : tableau « événement / aspect sur la courbe / signification / à vérifier ». Contraintes : si tu n'es pas sûr, dis-le. Ne donne aucune valeur chiffrée sans indiquer la source où la vérifier. À la fin, liste les affirmations à vérifier en priorité avec ton niveau de confiance.\n\n2. Auto-évaluation demandée\nRelis ta réponse avec la grille suivante et note conforme / non conforme en citant le passage : F - faits et chiffres sourcés ; I - étapes ou cas manquants ; A - adaptée à un débutant ; B - formulation biaisée ; L - logique et cohérence ; E - source primaire indiquée pour chaque valeur. Puis corrige.\n\n3. Tableau de comparaison (exemple illustratif ; vos résultats seront différents)\nÉvénement | Outil A | Outil B | Statut\nConnecteur (pic réfléchissant) | décrit | décrit | concordant, à confirmer dans le manuel de l'appareil\nÉpissure fusion (marche sans pic) | décrit | décrit | concordant\nGain apparent (marche montante) | expliqué : mesure dans un seul sens | absent | divergent : omission de B\nValeur typique d'une épissure | chiffre donné sans source | « dépend du cahier des charges » | divergent : chiffre de A à vérifier\nFantôme (pic après la fin de fibre) | décrit | décrit comme une seconde coupure | divergent : erreur probable de B\n\n4. Vérifications humaines\nChiffres : le seuil d'acceptation d'une épissure se vérifie dans le cahier de recette du projet et la procédure interne, pas dans une IA. Le maximum d'affaiblissement G.652.D se lit dans la recommandation UIT-T G.652 ou la fiche du câble. Événements : manuel de l'utilisateur du réflectomètre (source constructeur).\n\n5. Conclusion\nJe garde la réponse A, corrigée : chiffre d'épissure remplacé par [VALEUR DU CAHIER DE RECETTE]. L'auto-évaluation de A a signalé d'elle-même le chiffre non sourcé ; celle de B n'a pas vu l'erreur sur le fantôme. C'est la comparaison des deux outils, puis le manuel, qui l'a révélée. Trace de revue notée dans mon carnet de bord.", "notions": ["def:demande-d-incertitudes", "def:auto-evaluation", "def:comparaison-de-deux-outils", "def:grille-d-analyse", "def:source-primaire"], "type": "methode", "exemple_resolu": "m3.l4r"}]}, "m4": {"lessons": [{"id": "l1", "title": "Trois handicaps, trois façons de lire", "min": 13, "voie": "both", "blocks": [["p", "Un même document peut être lu avec les yeux, écouté par une synthèse vocale, ou lu lentement, phrase par phrase. Avant d'écrire pour « tout le monde », demandez-vous comment votre lecteur va accéder au texte."], ["def", "Situation de handicap", "Ce n'est pas seulement la personne qui « a » un handicap : c'est la rencontre entre ses capacités et un environnement mal conçu. Un document mal structuré crée une situation de handicap ; un document bien fait la réduit.", "Besoin de la personne + obstacle du contenu = situation de handicap. On agit sur l'obstacle.", "def:situation-de-handicap"], ["def", "Accessibilité numérique", "Fait qu'un contenu numérique (page, document, vidéo, application) peut être perçu, compris et utilisé par tous, y compris avec une aide technique.", "", "def:accessibilite-numerique"], ["def", "Aide technique", "Outil que la personne utilise pour accéder au contenu : lecteur d'écran, loupe, plage braille, sous-titres, synthèse vocale, commande vocale. Votre contenu doit être lisible par ces outils.", "", "def:aide-technique"], ["def", "Texte alternatif (aperçu)", "Texte associé à une image, lu à voix haute par le lecteur d'écran à la place de l'image. Méthode complète dans la leçon « Word, PowerPoint et Teams accessibles, textes alternatifs ».", "", "def:texte-alternatif-apercu-m4l1"], ["def", "Lecteur d'écran", "Logiciel qui lit à voix haute (ou en braille) ce qui est à l'écran, en suivant la structure du document : titres, listes, liens, textes alternatifs. Sur Android : TalkBack.", "Il lit le texte balisé. Il ne « voit » pas une image sans texte alternatif, ni un tableau fait avec des espaces, ni un texte en couleur.", "def:lecteur-d-ecran"], ["h", "Les besoins concrets"], ["table", ["Handicap", "Ce qui gêne", "Moyens d'accessibilité"], [["Visuel (cécité, malvoyance, daltonisme)", "Image sans description, texte trop petit, contraste faible, information donnée par la seule couleur, PDF scanné", "Titres structurés, textes alternatifs, contrastes suffisants, zoom sans perte, document texte (pas une image), liens explicites"], ["Auditif (surdité, malentendance)", "Vidéo sans sous-titres, consigne donnée seulement à l'oral, réunion sans transcription", "Sous-titres, transcription écrite, support écrit du briefing, langue des signes si besoin, alertes visuelles"], ["Cognitif (déficience intellectuelle, troubles dys, troubles de l'attention, fatigue, lecteur non francophone)", "Phrases longues, jargon, sigles, négations, mise en page chargée, informations dispersées", "Langage clair, FALC (Facile à lire et à comprendre), une idée par phrase, étapes numérotées, pictogrammes, mots expliqués, même mot pour la même chose"], ["Moteur", "Formulaire impossible au clavier, cases minuscules, temps limité", "Navigation au clavier ou à la voix, zones cliquables larges, pas de délai imposé"]]], ["p", "L'oral de la RS6776 interroge sur les trois premiers : visuel, auditif, cognitif. Le moteur concerne surtout les formulaires et les applications."], ["h", "Ce que l'IA apporte, et ce qu'elle ne fait pas"], ["ul", ["Elle aide : proposer un texte alternatif, simplifier un texte, transcrire une réunion, sous-titrer, traduire, résumer un long document.", "Elle ne garantit rien : un texte alternatif peut décrire ce qui n'est pas sur l'image ; une simplification peut supprimer une étape de sécurité ; une transcription peut se tromper de chiffre.", "Elle ne remplace pas la personne concernée : demandez à votre collègue ce qui l'aide vraiment (format, taille, oral ou écrit)."]], ["h", "Sur votre Galaxy S25 Ultra"], ["table", ["Fonction (Android)", "Ce qu'elle fait", "Pour quel handicap"], [["TalkBack", "Lecteur d'écran : lit à voix haute ce qui est affiché", "Visuel"], ["Transcription instantanée", "Transcrit une conversation en texte à l'écran, peut signaler certains sons", "Auditif"], ["Sous-titres instantanés", "Sous-titre l'audio et la vidéo du téléphone", "Auditif"]]], ["tip", "Les noms des menus Samsung varient selon la version d'Android et de One UI : s'ils diffèrent sur votre appareil, cherchez le nom de la fonction dans la loupe des Paramètres."], ["carte", "Les fonctions d'accessibilité du téléphone", "telephone", [[1, "Paramètres › Accessibilité", "Le point d'entrée habituel. Les noms de menus Samsung varient selon Android et One UI (libellé indicatif).", 1], [2, "TalkBack : interrupteur", "Lecteur d'écran : lit à voix haute ce qui est affiché. Handicap visuel. Souvent directement dans Accessibilité (libellé indicatif).", 1], [3, "Transcription instantanée", "Transcrit une conversation en texte à l'écran, peut signaler certains sons. Handicap auditif. Sur Samsung, souvent sous Accessibilité › Améliorations de l'audition (libellé indicatif).", 1], [4, "Sous-titres instantanés", "Sous-titre l'audio et la vidéo du téléphone. Handicap auditif. Même sous-menu que la transcription (libellé indicatif).", 1]]], ["tip", "Pour l'oral, préparez une phrase par handicap : « Pour un collègue malvoyant, je structure avec des titres, j'ajoute des textes alternatifs relus et je vérifie les contrastes. Pour un collègue sourd, je fournis sous-titres et transcription. Pour un collègue avec un handicap cognitif, j'écris en langage clair, étape par étape, et je fais relire. »"], ["warn", "Erreur fréquente à l'épreuve C4 : traiter l'accessibilité de façon générique (« je fais un texte clair ») au lieu de partir du handicap visé et des besoins de la personne décrite dans le cas."], ["src", [["RS6776, référentiel (certifpro France Compétences)", "https://certifpro.francecompetences.fr/api/fiches/refActivity/26622/542127"], ["RS6776, fiche France Compétences", "https://www.francecompetences.fr/recherche/rs/6776"], ["Samsung, utiliser TalkBack sur un Galaxy", "https://www.samsung.com/ae/support/mobile-devices/how-to-use-talkback-voice-assistant-on-galaxy-phones/"], ["Android, Transcription instantanée", "https://www.android.com/intl/fr_fr/accessibility/live-transcribe/"], ["Android, accessibilité audio (Sous-titres instantanés)", "https://www.android.com/intl/fr_fr/accessibility/audio/"]]]], "formes": ["comparaison", "aspect"]}, {"id": "l2", "title": "FALC et langage clair avec l'IA", "min": 18, "voie": "both", "blocks": [["p", "Une consigne de sécurité ne sert à rien si le lecteur ne la comprend pas. Le FALC et le langage clair sont deux niveaux de simplification. L'IA est rapide pour faire un premier jet, mais elle ne valide pas le résultat."], ["def", "Langage clair", "Écriture qui permet au lecteur visé de trouver, comprendre et utiliser l'information du premier coup. Il s'adresse à tout le monde : collègue pressé, agent en astreinte, lecteur non francophone.", "Message principal en premier ; phrases courtes ; mots courants ; voix active ; structure visible (titres, listes).", "def:langage-clair"], ["def", "FALC (Facile À Lire et à Comprendre)", "Méthode issue des règles européennes d'Inclusion Europe, « L'information pour tous » (version française avec l'Unapei). Elle vise d'abord les personnes avec une déficience intellectuelle, mais aide aussi les personnes âgées, dys ou qui maîtrisent mal le français.", "Règles d'écriture + règles de mise en page + images + relecture par des personnes handicapées intellectuelles.", "def:falc"], ["h", "Les règles européennes, en résumé"], ["table", ["Domaine", "Règles (L'information pour tous)"], [["Mots", "Mots faciles et connus ; mots difficiles expliqués au moment où ils apparaissent ; pas de sigles, métaphores ni mots étrangers peu connus ; le même mot pour la même chose ; pas de pourcentages ni de grands nombres ; nombres en chiffres, dates en entier"], ["Phrases", "Phrases courtes, une idée par phrase ; parler au lecteur avec « vous » ; phrases positives plutôt que négatives ; voix active plutôt que passive"], ["Mise en page", "Police sans empattement (Arial, Tahoma), au moins la taille 14 d'Arial ; pas d'italique ; texte aligné à gauche, jamais justifié ; pas de mot coupé en fin de ligne ; listes à puces ; pas de colonnes ni de notes de bas de page ; pages numérotées"], ["Images", "Une image près du texte qu'elle illustre ; images claires, adaptées au public ; la même image pour la même chose dans tout le document"], ["Participation", "Impliquer des personnes handicapées intellectuelles dans la rédaction et dans la vérification"]]], ["def", "Logo européen « Facile à lire »", "Logo gratuit d'Inclusion Europe. Il ne peut être apposé que si le document suit les règles européennes ET qu'au moins une personne avec une déficience intellectuelle l'a relu et a confirmé qu'il est facile à comprendre. Le nom des relecteurs figure dans le document.", "Règles respectées + relecture par le public concerné + mention « © European Easy-to-Read Logo: Inclusion Europe. More information at www.easy-to-read.eu » = logo autorisé.", "def:logo-europeen-facile-a-lire"], ["warn", "Un texte « FALC » produit par Copilot, Claude ou ChatGPT n'est pas du FALC tant qu'il n'a pas été relu par le public concerné. Pas de logo sans cette relecture. Appelez-le « version simplifiée » en attendant."], ["carte", "Une page Facile à lire, zone par zone", "document", [[1, "Titre court + logo", "Le logo européen « Facile à lire » n'est placé que si les règles sont suivies ET qu'au moins une personne avec une déficience intellectuelle a relu et confirmé. Schéma : logo non reproduit.", 1, ["Titre court", "Logo Facile à lire"]], [2, "Image + phrase courte", "Une image près du texte qu'elle illustre, la même image pour la même chose. Une idée par phrase, « vous », voix active.", 2, ["Image", "Phrase courte"]], [3, "Liste à puces, à gauche", "Police sans empattement, taille 14 au moins, pas d'italique, texte aligné à gauche, jamais justifié.", 2], [4, "Mot difficile expliqué", "Le mot est expliqué au moment où il apparaît. Pas de sigle ni de pourcentage.", 1], [5, "Relu par : [noms]", "Le nom des relecteurs figure dans le document.", 1], [6, "© Inclusion Europe", "Mention exigée avec le logo : « © European Easy-to-Read Logo: Inclusion Europe. More information at www.easy-to-read.eu ». Logo de 15 mm au moins.", 1], [7, "Page 1 sur 2", "Pages numérotées, pas de colonnes ni de notes de bas de page.", 1]]], ["h", "Ce que l'IA fait bien, ce qu'elle fait mal"], ["table", ["Fait bien", "Fait mal ou risque"], [["Raccourcir les phrases et passer à la voix active", "Supprimer une étape ou une condition de sécurité pour « simplifier »"], ["Remplacer le jargon inutile par des mots courants ; garder les termes de sécurité et les expliquer", "Changer le sens d'un terme technique (consignation, habilitation) par un mot vague"], ["Transformer un paragraphe en étapes numérotées", "Garder des négations doubles ou des « sauf si » imbriqués"], ["Proposer un lexique des mots difficiles", "Inventer une règle, un numéro d'appel ou un équipement absent de la consigne"], ["Proposer des idées d'images par étape", "Varier les mots d'une phrase à l'autre (« local », « salle », « pièce ») et perdre le lecteur"], ["Produire plusieurs niveaux (clair, très simple)", "Adopter un ton infantilisant"]]], ["h", "Prompt de réécriture pour un handicap cognitif"], ["code", "Rôle : tu es rédacteur spécialisé en langage clair et en règles européennes FALC.\nCible : [décrire la personne : ex. agent nouvellement arrivé, déficience intellectuelle légère, lit le français, se fatigue sur les textes longs].\nObjectif : qu'il sache exactement quoi faire, dans le bon ordre, sans erreur de sécurité.\nContexte : consigne d'origine ci-dessous (données fictives ou pseudonymisées).\nFormat : un titre ; une phrase d'introduction ; étapes numérotées ; une idée par phrase ; « vous » ; voix active ; phrases positives quand c'est possible ; chaque mot technique expliqué la première fois ; le même mot pour la même chose ; pas de sigle ni de pourcentage ; pour chaque étape, une idée d'image entre crochets.\nContraintes : ne supprime aucune étape ni condition de sécurité ; n'ajoute aucune règle ; recopie tels quels les numéros et les noms d'équipements.\nSi une information manque ou est ambiguë : écris [à demander au tuteur] au lieu de deviner.\nEnsuite : liste les changements faits (mot remplacé, phrase coupée, étape réordonnée) et ce qui reste à faire relire.\nConsigne : [coller]"], ["tip", "Faites relire la sortie deux fois : par un sachant (rien de la sécurité n'a disparu), puis par une personne du public visé (c'est compris). Ce sont deux contrôles différents."], ["tip", "La longueur de phrase « moins de 15 mots » est un repère usuel, pas une règle européenne chiffrée. Le vrai test, c'est la relecture."], ["warn", "Une consigne réelle de votre entité est une donnée interne : feu orange, outil fourni par l'entreprise seulement (Copilot, SNCF Group GPT selon la charte). En voie perso, travaillez sur une consigne fictive."], ["trajet", "D'une consigne à un texte FALC publiable", ["Retirer les données internes, ou rester dans l'outil fourni par l'entreprise (feu orange).", "Réécrire avec le prompt ci-dessus, en décrivant précisément la cible.", "Relecture par un sachant : aucune étape ni condition de sécurité n'a disparu.", "Relecture par une personne du public visé : le texte est compris.", "Logo « Facile à lire » seulement si les règles sont suivies et cette relecture faite."]], ["src", [["Inclusion Europe, L'information pour tous (règles européennes FALC, version française)", "https://www.inclusion-europe.eu/wp-content/uploads/2017/06/FR_Information_for_all.pdf"], ["Inclusion Europe, page des règles européennes", "https://www.inclusion-europe.eu/easy-to-read-standards-guidelines/"], ["Inclusion Europe, conditions d'usage du logo européen", "https://easy-to-read.inclusion-europe.eu/european-logo/"], ["ANCT, Les grandes lignes du FALC pour la médiation numérique", "https://storage.lesbases.anct.gouv.fr/main/user/cded45f4-d387-4831-be61-6c9a9729f19b/YKg3NU_fkAulyCdm1U2Vl_Les%20grandes%20lignes%20du%20FALC%20pour%20la%20m%C3%A9diation%20num%C3%A9rique.pdf"], ["Office des publications de l'UE, langage clair et facile à lire", "https://op.europa.eu/fr/web/webguide/plain-language-and-easy-to-read"]]]], "formes": ["comparaison", "processus", "aspect"]}, {"id": "l2r", "title": "Exemple résolu : une consigne de sécurité en version simplifiée", "min": 16, "voie": "both", "formes": ["comparaison"], "blocks": [["p", "Cas fictif, différent de l'exercice. Sam (fictif) rejoint l'équipe. Il a une déficience intellectuelle légère, lit le français, se fatigue sur les textes longs. Il connaît déjà le geste de base, mais pas les sigles. Son tuteur demande une version de la consigne ci-dessous que Sam pourra suivre seul."], ["warn", "Feu vert ici : la consigne est fictive. Une vraie consigne de votre entité serait orange : Copilot ou SNCF Group GPT uniquement."], ["code", "Consigne d'origine (fictive) :\n« INTERVENTION SUR RO – [POSTE_B]\nPréalablement à toute manipulation de jarretière sur le RO, l'intervenant devra avoir obtenu l'accord du PS, faute de quoi aucune déconnexion ne saurait être effectuée. Il est rappelé qu'il n'est pas permis de laisser non obturé un connecteur libéré et que l'observation directe d'une extrémité de fibre est proscrite. Les lunettes de protection sont requises sauf si la source est éteinte, ce qui ne dispense pas de l'obturation. Toute intervention > 2 h impose une pause de 10 min. Toute jarretière déposée sera mentionnée sur la FI avec son numéro de position (ex. : R3-P12). »\nSigles (fictifs) : RO = répartiteur optique ; PS = poste de supervision ; FI = fiche d'intervention."], ["table", ["Obstacle pour Sam", "Passage", "Ce qu'on change"], [["Sigles", "RO, PS, FI", "Mots en entier, expliqués la première fois"], ["Phrase très longue, ordre caché", "Phrase 1 (plus de 30 mots)", "Étapes numérotées, dans l'ordre réel des gestes"], ["Doubles négations", "« n'est pas permis de laisser non obturé », « ne dispense pas »", "Phrase positive : « Mettez le bouchon »"], ["Mots savants", "préalablement, proscrite, obturation, ne saurait", "Mots courants ; le terme du métier est gardé et expliqué"], ["Voix impersonnelle", "« l'intervenant devra »", "« vous », voix active"], ["Symbole et seuil", "« > 2 h », « 10 min »", "« Vous travaillez depuis 2 heures ? » ; nombres en chiffres, unités en toutes lettres"], ["Condition imbriquée", "« sauf si la source est éteinte, ce qui ne dispense pas… »", "Deux phrases séparées, chacune avec sa règle"]]], ["code", "Rôle : tu es rédacteur spécialisé en langage clair et en règles européennes FALC (facile à lire et à comprendre).\nCible : Sam, agent nouvellement arrivé, déficience intellectuelle légère ; il lit le français, se fatigue sur les textes longs, connaît le geste de base mais pas les sigles.\nObjectif : qu'il sache seul quoi faire avant, pendant et après une intervention sur le répartiteur optique, sans erreur de sécurité.\nContexte : consigne fictive ci-dessous. Elle sera relue par son tuteur, puis testée avec Sam.\nFormat : un titre en minuscules ; une phrase d'introduction ; 3 parties (Avant, Pendant, Après) ; étapes numérotées ; une idée par phrase ; « vous » ; voix active ; phrases positives, sauf une interdiction de sécurité ; chaque mot technique gardé et expliqué la première fois ; le même mot pour la même chose ; aucun sigle ni symbole ; nombres en chiffres ; une idée d'image entre crochets par étape.\nContraintes : ne supprime aucune étape ni condition de sécurité ; n'ajoute aucune règle ; recopie tels quels les numéros de position et les marqueurs entre crochets.\nSi une information manque : écris [à demander au tuteur].\nEnsuite : liste les mots remplacés et les points à faire vérifier.\nConsigne : [coller la consigne et les sigles]"], ["p", "Première sortie de l'IA : propre, mais la relecture trouve un problème grave. Elle a écrit « Si la lumière est éteinte, vous n'avez pas besoin de lunettes. » et elle a perdu l'idée que le bouchon reste obligatoire dans ce cas. Vous corrigez, puis vous gardez cette version :"], ["code", "Travailler sur le répartiteur optique\nLe répartiteur optique est l'armoire où arrivent les fibres du poste [POSTE_B].\n\nAvant\n1. Appelez le poste de supervision. C'est l'équipe qui surveille le réseau à distance. [image : téléphone]\n2. Demandez l'accord pour travailler. Attendez la réponse. Débranchez seulement après l'accord.\n3. Mettez vos lunettes de protection. [image : lunettes]\n\nPendant\n4. Une jarretière est un câble court qui relie deux prises. Vous pouvez la débrancher.\n5. Ne regardez jamais le bout d'une fibre. [image : œil barré]\n6. Mettez tout de suite un bouchon sur la prise libre. [image : bouchon]\n7. La lumière de la fibre est éteinte ? Vous pouvez enlever vos lunettes. Le bouchon reste obligatoire.\n8. Vous travaillez depuis 2 heures ? Faites une pause de 10 minutes.\n\nAprès\n9. Prenez la fiche d'intervention. C'est la feuille où vous notez votre travail.\n10. Écrivez chaque jarretière enlevée avec son numéro de place. Exemple : R3-P12.\n\nMots remplacés : RO, PS, FI, préalablement, proscrite, obturer.\nÀ vérifier : [à demander au tuteur] « source éteinte » = « lumière de la fibre éteinte » ? Comment Sam le sait-il ?"], ["table", ["Condition de la consigne d'origine", "Dans la version simplifiée"], [["Accord du poste de supervision avant toute déconnexion", "Étapes 1 et 2"], ["Connecteur libéré : toujours obturé", "Étape 6, et rappel à l'étape 7"], ["Ne jamais regarder une extrémité de fibre", "Étape 5 (interdiction gardée en négatif, c'est voulu)"], ["Lunettes, sauf source éteinte", "Étapes 3 et 7"], ["Pause de 10 min au-delà de 2 h", "Étape 8"], ["Jarretière déposée notée sur la fiche avec sa position", "Étapes 9 et 10, exemple R3-P12 recopié"]]], ["tip", "Vérification : faites ce tableau avant toute diffusion. Chaque condition de l'original doit avoir sa ligne ; une ligne vide, c'est une règle perdue. Le tuteur (sachant) vérifie ce tableau ; Sam vérifie qu'il comprend, en racontant les étapes avec ses mots."], ["warn", "Ce texte reste une « version simplifiée ». Il ne devient du FALC (Facile À Lire et à Comprendre), avec le logo, qu'après la relecture par des personnes du public concerné et le respect de toutes les règles de mise en page (Arial 14 au moins, texte aligné à gauche)."]]}, {"id": "l3", "title": "RGAA, WCAG, EAA : le cadre en novembre 2026", "min": 13, "voie": "both", "blocks": [["p", "Vous n'avez pas à auditer un site. Mais vous devez savoir quels textes existent, lequel est en vigueur, et quelles règles touchent ce que vous écrivez."], ["def", "WCAG (Web Content Accessibility Guidelines)", "Règles internationales du W3C (World Wide Web Consortium) pour l'accessibilité des contenus web. Version de référence actuelle : WCAG 2.2 (recommandation W3C d'octobre 2023). Les critères sont classés en niveaux A, AA et AAA ; la loi vise en général le niveau AA.", "4 principes : Perceptible, Utilisable, Compréhensible, Robuste.", "def:wcag"], ["def", "RGAA (Référentiel général d'amélioration de l'accessibilité)", "Méthode française publiée par la DINUM (Direction interministérielle du numérique) pour vérifier la conformité aux WCAG. Version en vigueur : RGAA 4.1.2, fondé sur les WCAG 2.1, 106 critères répartis en 13 thématiques.", "13 thématiques : Images, Cadres, Couleurs, Multimédia, Tableaux, Liens, Scripts, Éléments obligatoires, Structuration de l'information, Présentation de l'information, Formulaires, Navigation, Consultation.", "def:rgaa"], ["def", "EN 301 549", "Norme européenne d'accessibilité des produits et services numériques, référence des marchés publics et de l'European Accessibility Act.", "", "def:en-301-549"], ["table", ["Texte", "Version", "Statut au 03/11/2026"], [["RGAA", "4.1.2 (fondé sur WCAG 2.1)", "En vigueur, référence"], ["RGAA", "5 (fondé sur WCAG 2.2, aligné sur EN 301 549 v3.2.1)", "Annoncé le 02/03/2026, publication prévue avant fin 2026, non trouvé"], ["EN 301 549", "v3.2.1 (reprend WCAG 2.1)", "Précision à confirmer à la publication du RGAA 5"], ["Déclarations d'accessibilité existantes", "—", "Valables 18 mois après publication du RGAA 5 (source secondaire)"]]], ["def", "European Accessibility Act (EAA)", "Directive (UE) 2019/882, applicable depuis le 28 juin 2025. Elle impose l'accessibilité de produits et services : smartphones, ordinateurs, distributeurs et bornes de billets, services bancaires, commerce en ligne, livres numériques, et services de transport de voyageurs (aérien, bus, ferroviaire, fluvial).", "", "def:european-accessibility-act"], ["table", ["Date", "Événement"], [["28/06/2025", "European Accessibility Act applicable (directive (UE) 2019/882)"], ["02/03/2026 (24/06/2026 selon une autre source)", "La DINUM annonce le RGAA 5"], ["24/08/2026", "Décret n° 2026-816 : personnes publiques, délégataires de service public, entreprises d'au moins 250 M€ de chiffre d'affaires"], ["03/11/2026", "RGAA 4.1.2 toujours la référence"], ["Fin 2026 (prévu)", "Publication du RGAA 5"]]], ["warn", "Ces textes visent les services en ligne, pas chacune de vos notes internes. Mais une note, un support ou une vidéo qui ne respecte pas leurs principes exclut un collègue. Appliquez-les par défaut."], ["def", "Texte alternatif (aperçu)", "Texte associé à une image, lu par le lecteur d'écran à la place de l'image. Il dit ce que l'image apprend au lecteur, pas à quoi elle ressemble. Détail et réglages dans Word : leçon « Word, PowerPoint et Teams accessibles, textes alternatifs ».", "Quoi (ce que montre l'image) + pourquoi (ce que le lecteur doit en retenir)", "def:texte-alternatif-apercu"], ["def", "Description longue", "Texte complet placé sous un schéma ou un graphique, ou en annexe, qui en donne toutes les informations dans un ordre logique. Le texte alternatif court l'annonce : « description détaillée sous le graphique ».", "Alternative courte (1 à 2 phrases : le message principal, repère de la formation) + description longue (toutes les valeurs, dans l'ordre de lecture)", "def:description-longue"], ["h", "Ce qui concerne un rédacteur"], ["table", ["Principe", "Ce que vous faites"], [["Structure", "Vrais styles de titre (Titre 1, Titre 2), dans l'ordre, sans sauter de niveau ; vraies listes"], ["Textes alternatifs", "Toute image utile a un texte alternatif relu ; une image décorative est marquée comme telle"], ["Couleurs et contrastes", "Contraste suffisant ; jamais une information portée par la seule couleur (ajoutez un mot ou un symbole)"], ["Liens", "Intitulé explicite hors contexte : « Procédure d'accès au local (PDF, 2 pages) » et non « cliquez ici »"], ["Tableaux", "Tableaux simples, ligne d'en-tête déclarée, pas de cellules fusionnées pour faire de la mise en page"], ["Multimédia", "Sous-titres et transcription pour toute vidéo ou audio ; transcription pour un briefing enregistré"], ["Langue et clarté", "Langue du document déclarée ; langage clair ; sigles développés à la première occurrence"]]], ["src", [["RGAA 4.1.2, texte officiel (DINUM, format ODT)", "https://accessibilite.numerique.gouv.fr/doc/RGAA-v4.1.2.odt"], ["Binclusive, annonce du RGAA 5 (24 juin 2026)", "https://binclusive.io/en/blog/rgaa-5-france-digital-accessibility-standard"], ["Handicap.fr, décret 2026-816 et EAA (3 septembre 2026)", "https://informations.handicap.fr/v-accessibilite-numerique-ce-qui-change-en-france-et-en-ue-39631.php"], ["Mon parcours handicap, entrée en vigueur de l'EAA", "https://www.monparcourshandicap.gouv.fr/actualite/accessibilite-numerique-et-handicap-entree-en-vigueur-de-leaa"], ["W3C, Understanding SC 1.4.3 Contrast (Minimum)", "https://w3c.github.io/wcag/understanding/contrast-minimum.html"]]]], "formes": ["structure", "quantites"]}, {"id": "l3r", "title": "Exemple résolu : le texte alternatif d'un graphique", "min": 8, "voie": "both", "blocks": [["p", "Cas fictif, différent de l'exercice. Vous insérez dans une note un graphique en barres, « Alarmes d'octobre 2026 par poste ». [POSTE_A] : 12 alarmes, barre rouge. [POSTE_B] : 4, barre grise. [POSTE_C] : 9, barre grise. Une ligne pointillée marque le seuil d'alerte de 10. Légende : rouge = au-dessus du seuil. Word propose : « Graphique à barres de différentes couleurs. »"], ["trajet", "Les étapes", ["Trouver le message : ce que le lecteur doit retenir. Ici, un seul poste dépasse le seuil : le [POSTE_A].", "Écrire l'alternative courte : quoi (le graphique des alarmes) + pourquoi (le dépassement), puis annoncer la description longue.", "Écrire la description longue : toutes les valeurs, dans l'ordre du graphique, en phrases courtes, sans mot de couleur.", "Corriger le graphique : la couleur ne doit pas porter l'information seule. Ajoutez la valeur au-dessus de chaque barre et les mots « au-dessus du seuil » sur la barre concernée.", "Relire chaque nombre contre le tableau de données d'origine."]], ["code", "Pourquoi Word ne suffit pas : il décrit des formes et des couleurs, pas l'information ; ni valeur ni seuil.\n\nTexte alternatif court :\n« Alarmes d'octobre 2026 par poste : seul le [POSTE_A] dépasse le seuil d'alerte de 10, avec 12 alarmes. Description détaillée sous le graphique. »\n\nDescription longue (sous le graphique) :\n« Le graphique compte les alarmes d'octobre 2026 dans trois postes. Le seuil d'alerte est de 10 alarmes. [POSTE_A] : 12 alarmes, au-dessus du seuil. [POSTE_B] : 4 alarmes. [POSTE_C] : 9 alarmes, juste sous le seuil. »"], ["tip", "Vérification : cachez le graphique et lisez seulement vos deux textes. Pouvez-vous dire quel poste dépasse le seuil, et de combien ? Toutes les valeurs (12, 4, 9, seuil de 10) sont-elles là, sans aucune inventée ? Si oui, le lecteur d'écran transmet la même information que l'image."], ["def", "Rapport de contraste", "Écart de luminosité entre le texte et son fond, de 1:1 (aucun contraste) à 21:1 (noir sur blanc). Critère WCAG (règles internationales d'accessibilité des contenus web) 1.4.3, niveau AA.", "Texte normal : au moins 4,5:1. Grand texte (18 pt, ou 14 pt gras) : au moins 3:1. Seuil strict : 4,49:1 ne passe pas. Exceptions : logos, texte purement décoratif.", "def:rapport-de-contraste"], ["tip", "Gris clair sur blanc et texte blanc sur orange vif sont les deux pièges classiques des supports de briefing. Testez avec un vérificateur de contraste avant diffusion."]], "formes": ["processus"]}, {"id": "l4", "title": "Word, PowerPoint et Teams accessibles, textes alternatifs", "min": 20, "voie": "pro", "blocks": [["p", "Votre quotidien, ce sont des comptes rendus Word, des supports PowerPoint de briefing et des réunions Teams. C'est là que l'accessibilité se gagne ou se perd."], ["def", "Texte alternatif", "Texte associé à une image, lu par le lecteur d'écran à la place de l'image. Il donne l'information ou la fonction de l'image dans son contexte, pas une description exhaustive.", "Quoi (ce que montre l'image) + pourquoi (ce que le lecteur doit en retenir). Court pour une image simple ; pour un schéma complexe : alternative courte + description longue dans le texte ou en annexe. Image décorative (elle n'apporte aucune information : filet, illustration d'ambiance, logo qui répète le nom écrit juste à côté) : marquée « décorative », sans texte.", "def:texte-alternatif"], ["h", "Texte alternatif proposé par l'IA dans Word et PowerPoint"], ["def", "PC Copilot+", "Ordinateur Windows doté d'une puce d'IA (NPU (processeur dédié à l'IA)) qui exécute certaines fonctions d'IA sur l'appareil.", "", "def:pc-copilot"], ["table", ["Appareil", "Texte alternatif proposé par l'IA", "Où l'image est traitée"], [["PC Copilot+", "Automatique à l'insertion (en anglais pour l'instant)", "Sur l'appareil"], ["Autres appareils", "À la demande : volet Texte de remplacement ou Assistant Accessibilité", "Modèle cloud de Microsoft"], ["Tous", "Abonnement Microsoft 365 suffisant, pas de licence Copilot ; texte signalé comme pouvant être inexact : à relire", "—"]]], ["warn", "Sur un schéma technique (synoptique, plan de câblage, courbe de réflectomètre), l'IA décrit les formes, pas le sens : elle peut lire une distance de travers ou inventer une légende. Réécrivez toujours ce type d'alternative vous-même."], ["carte", "Le volet Texte de remplacement", "fenetre", [[1, "Image sélectionnée", "Clic droit sur l'image, puis « Afficher le texte de remplacement » (« Modifier le texte de remplacement » dans d'anciennes versions) ; ou ruban Révision, bouton Texte de remplacement. Le volet s'ouvre à droite du document (libellés indicatifs).", 2], [2, "Texte de remplacement", "Le titre du volet, cité par Microsoft.", 1], [3, "Saisie : quoi + pourquoi", "Ce que montre l'image et ce que le lecteur doit en retenir. Court pour une image simple.", 2], [4, "Générer une description", "Proposition de l'IA, signalée comme pouvant être inexacte : relisez-la. Sur un schéma technique, réécrivez-la vous-même (libellé indicatif).", 1], [5, "Marquer comme décoratif", "Case pour une image sans information : elle n'aura pas de texte (libellé indicatif).", 1]]], ["def", "Vérificateur d'accessibilité Microsoft 365", "Outil intégré à Word, PowerPoint, Excel et Outlook qui contrôle le fichier selon des règles et classe les problèmes en Erreurs, Avertissements et Conseils, avec une aide pour corriger.", "Ruban Révision > Vérifier l'accessibilité (anciennes versions : Fichier > Informations > Vérifier la présence de problèmes > Vérifier l'accessibilité). Corrigez toutes les erreurs et tous les avertissements.", "def:verificateur-d-accessibilite-microsoft-3"], ["warn", "L'aide Microsoft ne décrit le vérificateur que sous Windows, Mac et sur le web ; rien pour Android ni iOS. Sur le Galaxy S25 Ultra, préparez le document, puis vérifiez-le sur votre poste ou dans Word pour le web avant de le diffuser."], ["carte", "Le vérificateur d'accessibilité", "fenetre", [[1, "Ruban Révision", "Onglet Révision, puis Vérifier l'accessibilité. Anciennes versions : Fichier › Informations › Vérifier la présence de problèmes.", 1, ["Révision", "Vérifier l'accessibilité"]], [2, "Volet Accessibilité", "Le volet s'ouvre à côté du document et liste les problèmes par catégorie (libellé indicatif).", 1], [3, "Erreurs", "À corriger toutes : le contenu est illisible pour certaines personnes.", 1], [4, "Avertissements", "À corriger aussi, avant toute diffusion.", 1], [5, "Conseils", "Contenu compréhensible, mais qui pourrait être mieux présenté. Améliorez-le si vous avez le temps.", 1], [6, "Services intelligents", "Contenu rendu accessible automatiquement par l'IA, par exemple un texte alternatif généré : relisez-le (libellé indicatif).", 1], [7, "Aide à la correction", "Sélectionnez un problème : l'outil indique comment le corriger. Relancez jusqu'à zéro erreur (libellé indicatif).", 1]]], ["h", "Gestes de base"], ["trajet", "", ["Word : utilisez les styles Titre 1, Titre 2 ; jamais un texte simplement mis en gras et agrandi.", "PowerPoint : partez des dispositions fournies ; chaque diapositive a un titre unique, même masqué.", "Ajoutez un texte alternatif relu à chaque image utile ; marquez les autres comme décoratives.", "Évitez les zones de texte flottantes ; vérifiez l'ordre de lecture signalé par le vérificateur.", "Contraste : au moins 4,5:1 entre le texte et le fond (3:1 pour un grand texte) ; le vérificateur signale les cas douteux.", "Rédigez des liens explicites ; développez les sigles une fois.", "Lancez le vérificateur ; corrigez ; relancez jusqu'à zéro erreur.", "Diffusez le fichier Word ou PowerPoint, ou un PDF exporté depuis le fichier balisé ; jamais un scan."]], ["h", "Réunions Teams"], ["ul", ["Sous-titres en direct : Plus d'actions (…) > Sous-titres. Annoncez-les en début de briefing.", "Les sous-titres ne sont pas enregistrés : activez la transcription si quelqu'un doit relire après.", "Sous-titres traduits : nécessitent Teams Premium ou le module Microsoft Copilot ; si l'organisateur a la licence, tous les participants en profitent.", "Qualité : parlez près du micro, un à la fois, sans bruit de fond ; réglez la langue parlée de la réunion."]], ["h", "Cas fictif : note pour un collègue malvoyant"], ["table", ["Dans la note", "Version accessible pour Marc"], [["Mise en forme manuelle des titres", "Document Word structuré avec styles"], ["Tableau", "Tableau simple avec en-têtes"], ["« En rouge = urgent »", "« URGENT : » écrit en toutes lettres"], ["Plan de câblage (image)", "Description textuelle"], ["Capture d'écran de tableau", "Vrai tableau"], ["Avant envoi", "Vérificateur lancé"]]], ["tip", "Demandez à Copilot dans Word : « Liste ce qui gêne la lecture de ce document par un lecteur d'écran (titres, images, tableaux, liens) et propose une correction pour chaque point. » Puis confirmez avec le vérificateur : Copilot ne remplace pas le contrôle."], ["src", [["Microsoft, FAQ texte de remplacement généré par IA", "https://support.microsoft.com/en-us/topic/frequently-asked-questions-about-ai-generated-alt-text-a667a4a6-5d18-45e6-aaf6-5370132f337a"], ["Microsoft 365 Insider, texte de remplacement automatique sur PC Copilot+", "https://techcommunity.microsoft.com/blog/microsoft365insiderblog/automatic-alt-text-generation-in-word-and-powerpoint-on-copilot-pcs/4479186"], ["Microsoft, Améliorer l'accessibilité avec le vérificateur", "https://support.microsoft.com/en-us/topic/2de56af7-1b5d-4392-905d-eeaa0139340d"], ["Microsoft, Rendre votre contenu accessible avec le vérificateur (plateformes)", "https://support.microsoft.com/office/38059c2d-45ef-4830-9797-618f0e96f3ab"], ["Microsoft, sous-titres en direct dans les réunions Teams", "https://support.microsoft.com/office/4be2d304-f675-4b57-8347-cbd000a21260"]]]], "formes": ["processus", "aspect"]}, {"id": "l5", "title": "Adapter à la cible et à l'international", "min": 12, "voie": "both", "blocks": [["p", "Un contenu inclusif est aussi un contenu adapté à son lecteur : son métier, sa langue, sa culture. Le même compte rendu ne se rédige pas de la même façon pour un chef de pôle, un nouvel arrivant et un prestataire étranger."], ["def", "Ton et registre", "Le ton est l'attitude du texte (factuel, rassurant, ferme) ; le registre est le niveau de langue (technique, courant, simplifié). On les choisit d'après la cible et l'objectif, et on les écrit dans le prompt.", "Cible (qui lit, ce qu'il sait) + objectif (ce qu'il doit faire) = ton + registre + longueur.", "def:ton-et-registre"], ["table", ["Cible", "Ton et style"], [["Chef de pôle", "Factuel, synthétique, décision attendue en tête"], ["Nouvel arrivant", "Rassurant, pas à pas, mots techniques expliqués"], ["Collègue avec handicap cognitif", "Langage clair ou FALC (Facile à lire et à comprendre), une idée par phrase, étapes numérotées"], ["Prestataire étranger", "Phrases simples, sans idiomes ni sigles internes, formats internationaux"]]], ["def", "Localisation", "Adaptation d'un contenu à une langue ET à une culture : traduction, mais aussi formats de date, d'heure, de nombres, unités, exemples et références.", "Traduction + formats + unités + culture + terminologie validée.", "def:localisation"], ["def", "Glossaire métier", "Liste des termes de référence avec leur traduction validée (par exemple par le contrat, la documentation du prestataire ou un référent). On la donne à l'IA pour qu'elle n'invente pas une traduction.", "Terme source | traduction validée | définition courte | source de validation.", "def:glossaire-metier"], ["h", "Points de contrôle d'un message international"], ["table", ["Élément", "En français", "Pour un lecteur international"], [["Date", "12/11 (ambigu : 12 novembre ou, lu à l'anglaise, 11 décembre)", "2026-11-12 (ISO 8601 (norme internationale d'écriture des dates)) ou 12 November 2026"], ["Heure", "22 h", "22:00 CET (24 h, avec le fuseau)"], ["Nombre", "12,4 km", "12.4 km"], ["Unités", "Unité locale implicite", "Unités du système international, écrites en clair"], ["Sigles internes", "PK (point kilométrique), CR (compte rendu), ODF (format ouvert de document)", "Développés ou remplacés"], ["Expressions figurées", "« caler une intervention »", "Formulation littérale"], ["Termes de sécurité", "Traduits au jugé", "Tirés du glossaire métier"]]], ["warn", "Un message à un prestataire sur une intervention réelle contient des données internes : feu orange, Copilot ou outil interne seulement. Un traducteur en ligne gratuit est un outil perso : réservé aux contenus publics."], ["h", "Inclusif, c'est aussi sans stéréotype"], ["p", "L'IA reproduit des biais : agents toujours masculins, images de techniciens tous semblables, exemples culturels uniques. Relisez texte et visuels avec cette question : « Qui est oublié ou caricaturé ? » Préférez des termes épicènes (« l'équipe », « la personne d'astreinte ») ; le point médian gêne la lecture par synthèse vocale et n'est pas compatible avec le FALC."], ["tip", "Pour un message bilingue, demandez à l'IA la version en langue cible PUIS une retraduction en français : comparez avec l'original pour repérer les glissements de sens."], ["src", [["ISO, format de date et d'heure ISO 8601", "https://www.iso.org/iso-8601-date-and-time-format.html"], ["Microsoft, sous-titres en direct dans les réunions Teams", "https://support.microsoft.com/office/4be2d304-f675-4b57-8347-cbd000a21260"], ["Inclusion Europe, L'information pour tous (règles européennes FALC, version française)", "https://www.inclusion-europe.eu/wp-content/uploads/2017/06/FR_Information_for_all.pdf"], ["Office des publications de l'UE, langage clair et facile à lire", "https://op.europa.eu/fr/web/webguide/plain-language-and-easy-to-read"]]]], "formes": ["comparaison", "classement"]}, {"id": "l5r", "title": "Exemple résolu : un message bilingue de visite (voie Pro)", "min": 17, "voie": "both", "blocks": [["p", "Cas fictif, différent de l'exercice. Un technicien anglophone de [FOURNISSEUR_Y] vient mettre à jour le logiciel d'une armoire, de nuit. Vous confirmez sa venue. Données internes : feu orange, Copilot dans Outlook, noms et lieux pseudonymisés."], ["code", "Vos notes : « Nuit du 3 au 4/12, 23h-3h. Badge à retirer à l'accueil du [CENTRE_C] avant 22h30. Chaussures de sécurité obligatoires. Photos interdites dans le local technique. Armoire de 2,1 m de haut. Prévoir une lampe frontale. Contact : [CONTACT_ACCUEIL]. »\nGlossaire (fictif, validé par le référent sécurité de l'équipe) : badge = access badge ; chaussures de sécurité = safety shoes ; local technique = equipment room ; armoire = cabinet."], ["trajet", "Les étapes", ["Vérifier le feu et pseudonymiser : sites et personnes remplacés par des marqueurs entre crochets.", "Compter les informations des notes : ici 7 (créneau, badge, chaussures, photos, armoire, lampe, contact).", "Écrire le prompt (Rôle, Cible, Objectif, Contexte, Format, Contraintes) et imposer le glossaire.", "Imposer les formats internationaux : date ISO 8601 (norme internationale d'écriture des dates) avec le jour en toutes lettres, heure sur 24 h avec le fuseau CET (heure d'Europe centrale), point décimal. Pour une nuit, les deux dates.", "Demander la version anglaise, la version française, puis la retraduction en français de la version anglaise.", "Contrôler avant l'envoi : calendrier, fuseau, glossaire, terme manquant, 7 informations dans chaque langue."]], ["code", "Rôle : tu es rédacteur technique bilingue français-anglais.\nCible : un technicien de [FOURNISSEUR_Y] qui lit l'anglais (langue non maternelle) ; mon responsable en copie, en français.\nObjectif : que l'intervention de nuit se passe sans refus d'accès ni oubli d'équipement.\nContexte : mes notes et le glossaire ci-dessous.\nFormat : anglais puis français, mêmes rubriques (Date and time / Access / Safety / Rules on site / Cabinet / Equipment to bring / Contact) ; date ISO 8601 avec le jour ; pour un créneau de nuit, la date et le jour du début ET de la fin ; heures sur 24 h, fuseau CET ; point décimal en anglais ; phrases courtes, sans idiome ni sigle interne.\nContraintes : uniquement les termes du glossaire ; n'ajoute aucune règle ; garde les marqueurs entre crochets.\nSi un terme manque au glossaire : laisse-le en français entre crochets et signale-le à la fin.\nEnsuite : retraduis la version anglaise en français.\n[coller les notes et le glossaire]"], ["trajet", "Faire préciser le créneau de nuit", ["Premier jet de l'IA : « Date and time: Thursday 2026-12-03, 23:00 to 03:00 CET. »", "Retraduction : « jeudi 3 décembre, de 23 h à 3 h » : on ne sait pas si 3 h est le jeudi ou le vendredi.", "Relance : « Écris la date et le jour de fin du créneau. »", "Version gardée : ci-dessous."]], ["code", "Version anglaise :\nDate and time: from Thursday 2026-12-03 at 23:00 CET to Friday 2026-12-04 at 03:00 CET (night shift).\nAccess: collect your access badge at the reception of [CENTRE_C] before 22:30 CET on Thursday 2026-12-03.\nSafety: safety shoes are mandatory.\nRules on site: no photos in the equipment room.\nCabinet: height 2.1 m.\nEquipment to bring: [lampe frontale].\nContact: [CONTACT_ACCUEIL].\nTerm not in the glossary: « lampe frontale », left in French.\n\nVersion française :\nDate et heure : du jeudi 3 décembre 2026 à 23 h au vendredi 4 décembre 2026 à 3 h (heure de Paris).\nAccès : retirez votre badge à l'accueil du [CENTRE_C] avant 22 h 30, le jeudi 3 décembre.\nSécurité : chaussures de sécurité obligatoires.\nRègles sur place : photos interdites dans le local technique.\nArmoire : 2,1 m de haut.\nÀ apporter : une lampe frontale.\nContact : [CONTACT_ACCUEIL].\n\nRetraduction en français de la version anglaise :\nDate et heure : du jeudi 3 décembre 2026 à 23 h au vendredi 4 décembre 2026 à 3 h, heure d'Europe centrale (poste de nuit). Accès : retirez votre badge d'accès à l'accueil du [CENTRE_C] avant 22 h 30 le jeudi 3 décembre. Sécurité : chaussures de sécurité obligatoires. Règles sur place : pas de photos dans le local technique. Armoire : hauteur 2,1 m. À apporter : [lampe frontale]. Contact : [CONTACT_ACCUEIL]."], ["table", ["Contrôle", "Résultat"], [["Jours de la semaine", "Le 3 décembre 2026 est un jeudi, le 4 un vendredi (calendrier)"], ["Créneau de nuit", "Début et fin datés tous les deux ; l'heure limite du badge est rattachée au jeudi"], ["Fuseau", "En décembre, la France est à l'heure d'hiver : CET est juste"], ["Glossaire", "access badge, safety shoes, equipment room, cabinet : conformes"], ["Terme absent", "« lampe frontale » laissé en français et signalé. Le référent valide « head torch » : vous le remplacez, puis l'ajoutez au glossaire"], ["Nombres", "2,1 m devient 2.1 m"], ["Retraduction", "Les 7 informations des notes, aucune en plus. « Night shift » (poste de nuit), ajouté par l'IA dans la version anglaise et retrouvé dans la retraduction : simple précision, pas une règle"]]], ["tip", "Vérification : comptez les informations de vos notes et retrouvez-les une par une dans chaque langue, puis dans la retraduction. Une règle de sécurité ajoutée ou perdue se voit à ce comptage. Faites valider la traduction des termes de sécurité et de tout terme absent du glossaire par le référent avant l'envoi."]], "formes": ["processus"]}], "quiz": [{"lecon": "l1", "voie": "both", "q": "Un collègue aveugle lit vos notes avec TalkBack. Votre note dit : « Les liaisons en rouge sont à reprendre. » Quel est le problème ?", "o": ["Aucun si le contraste du rouge sur le fond est suffisant", "Le lecteur d'écran ne transmet pas une information de couleur", "Le texte doit être agrandi pour que TalkBack le lise"], "a": 1, "why": "Leçon « Trois handicaps, trois façons de lire » : le lecteur d'écran lit le texte balisé ; il ne transmet pas un texte en couleur. Écrivez l'information en mots. Le contraste aide les personnes malvoyantes, pas un lecteur d'écran. La taille du texte ne change rien pour TalkBack, qui lit tout le texte."}, {"lecon": "l2", "voie": "both", "q": "Copilot a réécrit une consigne selon les règles européennes FALC. Un collègue expert a vérifié qu'aucune étape de sécurité n'a disparu, et la mention © Inclusion Europe est prête. Que manque-t-il encore pour apposer le logo « Facile à lire » ?", "o": ["Une autorisation écrite d'Inclusion Europe pour ce document", "Une validation de la consigne par le service sécurité", "La relecture et l'accord d'une personne du public visé"], "a": 2, "why": "Leçon « FALC et langage clair avec l'IA » : le logo n'est autorisé que si les règles sont suivies ET qu'au moins une personne avec une déficience intellectuelle a relu et confirmé que le texte est facile à comprendre. Le logo est gratuit : pas d'autorisation par document. La relecture par un sachant est déjà faite ; c'est un contrôle différent de la relecture par le public visé."}, {"lecon": "l3", "voie": "both", "q": "Un vérificateur donne 4,49:1 pour le texte de taille normale de votre support. Est-ce conforme au niveau AA des WCAG ?", "o": ["Non : le minimum est 4,5:1 pour un texte normal", "Oui : la valeur s'arrondit à 4,5:1", "Oui : 3:1 suffit pour un support projeté"], "a": 0, "w
